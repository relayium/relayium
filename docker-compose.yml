# Relayium — docker compose.
#
#   docker compose up -d                 # server only (LAN realtime + stored links)
#   docker compose --profile relay up -d # + coturn TURN relay + redis metering
#
# App config comes from ./server/.env (optional) plus the `environment:` block
# below. See server/.env.example for every RELAYIUM_* key.
name: relayium

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: relayium/relayium:local
    restart: unless-stopped
    ports:
      # Bind to loopback by default so a public host doesn't expose the plaintext
      # app port to the internet (put a TLS-terminating reverse proxy in front).
      # For direct LAN access (device-to-device realtime), set RELAYIUM_BIND=0.0.0.0.
      - "${RELAYIUM_BIND:-127.0.0.1}:8080:8080"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      RELAYIUM_ADDR: ":8080"
      RELAYIUM_STATIC: "/app/web/dist"
      RELAYIUM_DB: "/data/relayium.db"
      RELAYIUM_BLOB_DIR: "/data/blobs"
      # Enable relay-byte metering when the `relay` profile is running:
      # RELAYIUM_REDIS_ADDR: "redis:6379"
    volumes:
      - relayium-data:/data

  # --- Optional: TURN relay for cross-network transfers (profile: relay) ---
  # TURN needs the host's real IP and a wide UDP relay-port range, so it runs
  # with host networking. See docs/self-hosting.md.
  #
  # THE SECRET HAS TO BE SET IN TWO PLACES, and the failure when it isn't is
  # silent. coturn reads it from the interpolation below, which Compose resolves
  # from the shell or the project-root .env — NOT from ./server/.env, which is an
  # `env_file` and therefore only ever reaches the container it is attached to.
  # The server reads RELAYIUM_TURN_SECRET / RELAYIUM_TURN_URLS from its OWN
  # environment (./server/.env), and an empty -turn-secret disables TURN outright
  # (server/main.go). Set only the shell variable and you get a running coturn
  # that the server never hands out credentials for: the stack looks healthy and
  # strict-NAT transfers keep failing with nothing logged anywhere.
  #
  # Not fixed by adding a `RELAYIUM_TURN_SECRET: ${RELAYIUM_TURN_SECRET:-}`
  # passthrough here: `environment:` outranks `env_file:`, and the empty default
  # counts as set, so that would blank out the value of everyone who correctly
  # keeps their secret in ./server/.env.
  coturn:
    image: coturn/coturn:latest
    profiles: ["relay"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --realm=relayium.app
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=65535
      - --use-auth-secret
      - --static-auth-secret=${RELAYIUM_TURN_SECRET:?set it in the shell or the project-root .env for coturn, AND in ./server/.env so the server enables TURN too — see docs/self-hosting.md}
      - --no-cli
      # - --external-ip=YOUR.PUBLIC.IP
      # Relay-byte metering: also write stats to redis (host-networked, so localhost):
      # - --redis-statsdb=ip=127.0.0.1 dbname=0

  # --- Optional: Redis for coturn relay-byte metering (profile: relay) ---
  redis:
    image: redis:7-alpine
    profiles: ["relay"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - relayium-redis:/data

volumes:
  relayium-data:
  relayium-redis:

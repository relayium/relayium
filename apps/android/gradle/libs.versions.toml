# Every coordinate here was checked against the repository that serves it before
# it was written down — Google's Maven for AGP/AndroidX, Maven Central for
# Kotlin, BouncyCastle, OkHttp, coroutines and the WebRTC AAR. None of them is a
# "latest" guess, and `scripts/test/dependency-pinning-test.mjs` refuses a
# dynamic version, a range or a snapshot in this file.
#
# ## Why Kotlin is 2.2.10 and not the newest 2.2.x
#
# AGP 9.1.1's own POM depends on `org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10`
# (verified against the published POM). AGP 9 applies Kotlin itself, so declaring
# a DIFFERENT Kotlin version here puts two Kotlin Gradle plugins of two versions
# on one classpath. Matching AGP's own is the alignment the brief asks for; the
# Compose compiler plugin is versioned in lockstep with Kotlin, so it is 2.2.10
# too. Bumping Kotlin means bumping AGP and re-reading its POM, in one change.

[versions]
# Toolchain
agp = "9.1.1"
kotlin = "2.2.10"
# The Compose compiler plugin ships with Kotlin and must equal it exactly.
composeCompiler = "2.2.10"

# Android platform. min 26 is the floor the storage and crypto code is written
# against (SAF document trees, java.time, AES-GCM without provider quirks).
#
# compileSdk is 37 because androidx.core 1.19.0's own aar-metadata declares
# minCompileSdk=37 (verified against the artifact bytes, not release notes), and
# AGP 9.1.1 supports API <= 37. The SDK package is the minor-versioned
# `platforms;android-37.0`, which is what CI must install. targetSdk stays 36:
# compiling against newer headers raises no behaviour change for users, and
# targeting 37 is a separate, deliberately unmade decision.
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# Libraries
coroutines = "1.11.0"
okhttp = "5.5.0"
bouncycastle = "1.85.2"
# Upstream io.github.webrtc-sdk build. Verified present on Maven Central with
# AAR SHA-256 0a1627b1a48c2bc17d9a40d62fc47bd45166f44a311e95917f147c402de379b0,
# and both arm64-v8a and x86_64 .so segments 16 KiB aligned (Android 15+ page
# size requirement). Carries NO Google Play Services dependency, which is why it
# is this build rather than the org.webrtc one.
webrtc = "150.7871.01"

androidxCore = "1.19.0"
androidxAnnotation = "1.10.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxDocumentFile = "1.1.0"
composeBom = "2026.08.00"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
espresso = "3.7.0"
# Drives the SYSTEM DocumentsUI in the UI acceptance — the one surface the
# same-uid provider stub deliberately does not exercise. Test-only.
androidxUiAutomator = "2.3.0"

# Scanning a pairing QR code, and showing one.
#
# CameraX 1.6.2 (stable, released 2026-08-26) is the STABLE line and not the
# alpha the release page's dependency sample happens to print; that alpha is a
# different artifact and is deliberately not what is pinned here. 1.6.2 is the
# release that fixes the JSpecify annotation breakage, which is not optional for
# a Kotlin consumer. CameraX is a Jetpack library and pulls in no Google Play
# Services, which is what keeps this build installable without GMS.
camerax = "1.6.2"
# The decoder, and the encoder for the code this device shows. `core` is the
# pure-Java module: no native code, no GMS, no downloaded model — which is also
# what lets the whole decode path be covered by host unit tests against real
# ZXing rather than only on a device. ML Kit is not used: its bundled build is
# a closed model, and Google's code scanner runs through Play Services.
zxing = "3.5.4"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Lightweight BouncyCastle primitives only: X25519 raw scalar multiplication and
# BLAKE2b. The JCE provider is deliberately NOT installed — AES-GCM comes from
# the platform, and registering a provider would change every other consumer's
# crypto in the process.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidxDocumentFile" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiAutomator" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }

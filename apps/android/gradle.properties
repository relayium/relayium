# Deterministic, and small enough for a hosted runner.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is deliberately OFF for now: AGP 9's Android test tasks and
# the WebRTC AAR unpacking are not yet fully compatible with it, and a build that
# is sometimes cached and sometimes not is worse evidence than one that never is.
org.gradle.configuration-cache=false

# AndroidX only. There is no support-library code here and never will be.
android.useAndroidX=true
# Non-transitive R classes: a resource is referenced through the module that
# declares it, so a stale R reference is a compile error rather than a silent
# cross-module pickup.
android.nonTransitiveRClass=true
# No BuildConfig fields beyond the ones app/build.gradle.kts declares explicitly.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

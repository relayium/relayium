name: auto-release
# Cuts a release from main on a schedule, so that shipping does not depend on
# anyone remembering to.
#
# It was not remembering. v0.10.2 → v0.11.0 sat unreleased for months and 201
# commits, and the gap only surfaced when someone hit a CLI on a production box
# that was missing a feature written long before — `relayium send <file>` with
# no pairing code, which had never been in any published build.
#
# This is only safe because of what landed alongside it: until go.yml existed
# the server had no CI at all, and scheduling releases off an unverified main
# would have been worse than forgetting. The green-CI gate below is therefore
# load-bearing, not decorative.
#
# Blast radius is deliberately small. Nodes do not follow releases — they ask
# central which version to run (relayium-node's resolveTargetFromCentral), so a
# published tag changes nothing in the fleet until an operator starts a
# rollout. CLI users upgrade by running `relayium update`.
on:
  schedule:
    # Mondays, 04:00 UTC. Early in the week on purpose: a release that goes out
    # on a Friday is discovered on a Monday.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if nothing under server/ changed'
        type: boolean
        default: false

permissions:
  contents: write   # create and push the tag
  actions: write    # dispatch release.yml for that tag

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0   # tags and full history: both are inputs below

      - name: Work out whether there is anything to release
        id: scan
        run: |
          set -euo pipefail
          # NOT `git describe --tags`: this repo tags two components, and that
          # call returns the newest tag of whichever family happened to move
          # last. When the macOS app was ahead it returned `macos-v1.1.3`, and
          # every line below — the commit count, the server/ diff, the release
          # notes range, the version arithmetic — was computed from it. See
          # scripts/release/server-tag.sh for the full incident and the rules;
          # it returns a tag matching ^v[0-9]+\.[0-9]+\.[0-9]+$ or nothing.
          last="$(sh scripts/release/server-tag.sh latest)"
          if [ -z "$last" ]; then
            echo "no server tags yet — refusing to invent the first version number" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(git rev-list --count "$last"..HEAD)"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            # Nothing to ship is the normal state most weeks, and is not a
            # problem — but it is still written down, because a run that says
            # nothing is indistinguishable from a run that did not happen.
            echo "Nothing to release: main is at \`$last\`." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Commits are not the same thing as a release. Everything goreleaser
          # publishes is built from server/ (.goreleaser.yaml's two `dir:
          # server` builds — the relayium CLI and relayium-node); the macOS app
          # under apps/ is not in any artifact. So a run of docs- or app-only
          # commits would cut a tag whose binaries are byte-identical to the
          # previous one, and send every CLI user's `relayium update` to fetch
          # a version that changes nothing for them.
          #
          # This is not hypothetical: at the time this gate was added, main had
          # 52 commits since v0.11.1 and not one of them touched server/.
          # Ask git the yes/no question directly. Piping a potentially long
          # name list into `head` under pipefail can turn "changed" into exit
          # 141 when git receives SIGPIPE.
          if git diff --quiet "$last"..HEAD -- server/; then
            rel=""
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              echo "::error::git diff failed while checking release scope"
              exit "$diff_status"
            fi
            rel="changed"
          fi
          if [ -z "$rel" ] && [ "${{ inputs.force }}" != "true" ]; then
            {
              echo "### Nothing to release"
              echo
              echo "$count commits since \`$last\`, but none of them touch \`server/\`."
              echo "Every published artifact is built from there, so a tag would ship"
              echo "identical binaries. Run this workflow manually with \`force\` if you"
              echo "want one anyway."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "### $count commits since \`$last\`"
            echo
            # Let git bound its own output. With `pipefail`, piping a longer
            # history into `head` makes git receive SIGPIPE and exit 141,
            # aborting the release exactly when there are more than 40 commits.
            git log -n 40 --format='- %s' "$last"..HEAD
          } >> "$GITHUB_STEP_SUMMARY"

      # A red main must stop the release, and must stop it LOUDLY. Skipping
      # quietly here would reproduce the exact failure this workflow exists to
      # prevent: everything looks fine and nothing ships.
      #
      # And a main that could not be SHOWN to be green is a red main. This step
      # used to read the check runs with `|| true` and no pagination, so three
      # different kinds of missing evidence all read as "nothing is red": a
      # request that failed, a red or still-running check beyond the first 30
      # runs (main carries more than that), and a commit with no checks at all.
      # Each of them would have tagged and published. The step now only
      # fetches; scripts/release/checks-green.sh decides, offline-testable, and
      # scripts/test/checks-green-test.sh runs this very step against a stub
      # `gh` so the hole cannot be reopened from the YAML side either.
      - name: Require the checks on this commit to be green
        if: steps.scan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          runs="$(mktemp)"
          withheld() {
            # withheld HEADING DETAIL — the same summary block for every refusal.
            {
              echo "### Release withheld — $1 on \`$sha\`"
              echo '```'
              printf '%s\n' "$2"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          # EVERY page, to a file. `--paginate` writes one JSON document per
          # page and the script checks their number of runs against the API's
          # own total_count, so a page that went missing refuses the release
          # instead of shortening the list. The default `filter=latest` is
          # relied on: after a re-run, the newest attempt is the one that counts.
          #
          # No fallback on this command. If the read fails there is no evidence,
          # and no evidence is not the same thing as no failures.
          if ! gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" >"$runs"; then
            withheld "the check runs could not be read" "gh api failed; see this step's log"
            echo "::error::could not read the check runs for $sha; refusing to tag a commit nobody could verify"
            exit 1
          fi
          # A check that is queued or in progress counts as not-green: the point
          # is to release something already verified, not to race it. The script
          # exits 1 and names the checks when any is not green, and 3 when the
          # response cannot prove anything — not JSON, an API error body, fewer
          # runs than total_count, or no check runs at all besides this job.
          if verdict="$(sh scripts/release/checks-green.sh "$runs")"; then
            echo "Checks on \`$sha\`: $verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              withheld "checks are not green" "$verdict"
              echo "::error::main is not green; refusing to tag it"
            else
              withheld "the checks could not be shown to be green" "$verdict"
              echo "::error::could not establish that main is green; refusing to tag it"
            fi
            exit 1
          fi

      # Green checks on HEAD are not evidence that the GO lane ran. go.yml is
      # path-filtered, HEAD is usually a docs- or web-only commit, and on such a
      # commit the step above passes on the web and hygiene checks alone —
      # observed on push tip 7d3b2923: "29 check runs green", none of them from
      # go.yml — while every binary this workflow publishes is built from
      # server/. (On 2026-09-20 a manual release had to dispatch go.yml by hand
      # for exactly this reason.)
      #
      # So this step requires a successful go.yml run on a commit whose Go-lane
      # inputs are IDENTICAL to HEAD's: any commit from E — the last one that
      # changed server/ or go.yml's other `paths:` — to HEAD, each verified with
      # `git diff --quiet`. Not "on E": GitHub starts a push workflow once per
      # push, on the push tip, so in a batch push E itself never gets a run and
      # never can. scripts/release/go-evidence.sh holds the rules (which events
      # count, newest run decides, unusable evidence refuses) and
      # scripts/test/go-evidence-test.sh runs this very step against a stub `gh`.
      #
      # Deliberately NOT conditioned on `inputs.force`: force waives "nothing
      # under server/ changed", never "nobody tested what is being shipped".
      # Needs the full history the checkout above already fetches, and only
      # reads the Actions API, which `actions: write` covers.
      - name: Require a successful go.yml run for the server tree being released
        if: steps.scan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          withheld() {
            # withheld HEADING DETAIL — the same summary block for every refusal.
            {
              echo "### Release withheld — $1 on \`$sha\`"
              echo '```'
              printf '%s\n' "$2"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          # The script fetches (one read per candidate commit, every page, no
          # fallback) and decides. It exits 1 when no tree-identical commit from
          # E to HEAD carries a successful go.yml run — naming E, every commit
          # it looked at and what it found there — and 3 when the evidence
          # cannot prove anything: a failed read, an API error body, a missing
          # page, runs for a different commit, a shallow clone.
          if verdict="$(sh scripts/release/go-evidence.sh require "$sha")"; then
            echo "Go evidence for \`$sha\`: $verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              withheld "no successful go.yml run covers the server tree" "$verdict"
              echo "::error::the Go lane never succeeded on the server tree of $sha; refusing to tag it"
            else
              withheld "the Go evidence could not be established" "$verdict"
              echo "::error::could not establish that the Go lane verified the server tree of $sha; refusing to tag it"
            fi
            exit 1
          fi

      - name: Choose the next version
        id: ver
        if: steps.scan.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # The arithmetic lives in the script with the shape check, so that a
          # base tag which is not a server version cannot be bumped at all —
          # the string arithmetic that produced `vmacos-v1.2.0` fails loudly
          # there instead of yielding a tag name.
          next="$(sh scripts/release/server-tag.sh next "${{ steps.scan.outputs.last }}")"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: **$next**" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag it
        if: steps.scan.outputs.skip == 'false'
        run: |
          set -euo pipefail
          next="${{ steps.ver.outputs.next }}"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists — the version arithmetic and the tag list disagree"
            exit 1
          fi
          git config user.name  "relayium-release[bot]"
          git config user.email "github@relayium.com"
          git tag -a "$next" -m "$next

          Released automatically from main by .github/workflows/auto-release.yml.
          $(git rev-list --count "${{ steps.scan.outputs.last }}"..HEAD) commits since ${{ steps.scan.outputs.last }}."
          git push origin "$next"

      # See the comment on release.yml's workflow_dispatch: the tag above was
      # pushed with GITHUB_TOKEN and therefore started nothing by itself.
      - name: Build it
        if: steps.scan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "${{ steps.ver.outputs.next }}"
          echo "Dispatched release.yml for **${{ steps.ver.outputs.next }}**" >> "$GITHUB_STEP_SUMMARY"

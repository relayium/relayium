name: contracts
# The Device Inbox admission contract's own lane: the smallest command that
# judges each implementation's agreement with
# `contracts/device-inbox-admission-v1.json`, and nothing else.
#
# ## Why this workflow exists rather than four filter entries
#
# `docs/CI-PLATFORM-BOUNDARY.md` recorded, before this tree existed, that every
# workflow whose suite READS a file under a contract tree should name that file
# in its own path filter — the discipline `go.yml` and `web.yml` already apply to
# `device-inbox-manifest-v3-vectors.json`. Applied here that rule would have cost
# far more than it bought, and the cost is the whole reason this file exists:
#
#   * `go.yml` names the manifest fixture and therefore starts the EIGHT-SHARD
#     race lane on a fixture edit. That is proportionate for bytes the Go
#     manifest implementation is reproduced against; it is not proportionate for
#     a JSON document that two `go test` functions read in 60 milliseconds.
#   * `web.yml` would start the full Vite suite, the accessibility scan and
#     three headless-Chrome journeys.
#   * `swift-package.yml` is filtered to exactly `apps/RelayiumKit/**` with no
#     exclusions, because it is the one workflow that must see EVERY file in the
#     package. Widening it to reach a tree it does not compile would spend the
#     whole package suite — a PAID macOS runner — on a contract edit.
#
# So the contract tree gets a lane of its own that runs one Go test binary
# selector, one Vitest file and one `swift test --filter`. A contract-only edit
# starts THIS, plus the two always-on gates (`compat.yml`, `repo-hygiene.yml`)
# that carry no path filter and therefore cannot be routed around — and starts no
# macOS/iOS product build, no signing, no UI test, no native pairing acceptance,
# no Go race lane and no browser acceptance.
#
# The other direction is unchanged and deliberate: the three consumer tests live
# inside `server/**`, `web/**` and `apps/RelayiumKit/**`, so an ordinary source
# change in any of those still runs its own owning suite, and that suite still
# contains the consumer test. Neither lane is a substitute for the other, and
# `scripts/test/contract-ci-policy-test.mjs` asserts both halves by mutation.
#
# ## Why the Swift half is here at all
#
# It is a third `swift test` host and a third PAID macOS runner, which
# `scripts/test/swift-ci-boundary-test.mjs` would otherwise refuse — see the
# ownership rules it gained for this file. It is costed deliberately: without it
# a contract edit lands with two of the three implementations compared and the
# third not, and the Swift disagreement then surfaces later against an innocent
# commit that happened to touch the package. That is the exact failure the
# fixture path entries in `go.yml` and `web.yml` exist to prevent, and a contract
# whose third consumer is checked late is not a contract.
#
# Its `swift test` is always FILTERED, to this one test class. The repository's
# sole UNFILTERED `swift test` remains `swift-package.yml`'s, and the boundary
# policy still asserts there is exactly one of those.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # The Device Inbox contract and this file. This filter USED to be
    # `contracts/**`, on the argument that a second document should join the
    # lane with no workflow edit at all. `contracts/ops-deploy-v1.json` is that
    # second document, and it showed the argument was wrong: it has no Swift and
    # no TypeScript consumer, so under a tree-wide filter every edit to it would
    # have taken a PAID macOS runner and an `npm ci` to re-run two jobs that
    # cannot see it.
    #
    # So ownership of `contracts/` is per CONTRACT FILE, not per tree. This lane
    # owns the Device Inbox admission contract and keeps all three consumers;
    # `ops-deploy-contract.yml` owns the deploy contract on one Ubuntu runner.
    # What the tree-wide filter used to guarantee — that no contract file can
    # exist with no owner — is now asserted directly:
    # `scripts/test/contract-ci-policy-test.mjs` requires every file under
    # `contracts/` to be claimed by exactly one lane, so a third contract fails
    # until somebody gives it one.
    #
    # The three consumer TESTS are deliberately absent. Each already lives in a
    # tree its own suite watches, so naming them here would start a second lane —
    # including a second PAID macOS runner for a Swift test that
    # `swift-package.yml` was about to run anyway — for one answer.
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    paths:
      - 'contracts/device-inbox-admission-v1.json'
      - '.github/workflows/contracts.yml'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: contracts-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, and no job below reads a secret. This lane judges a document
# against three implementations; it publishes nothing, signs nothing and has no
# identity to borrow.
permissions:
  contents: read

jobs:
  # ── the Go consumer ───────────────────────────────────────────────────────
  go-contract:
    runs-on: ubuntu-latest
    # Seconds of real work behind a toolchain setup and a package build. Finite
    # and chosen, so a wedged run turns the board red in minutes instead of
    # holding a slot for GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      # One package, two named test functions, no `-race`. The race lane is
      # `go.yml`'s eight shards and is not what a document edit needs; `-count=1`
      # is what stops a cached PASS from answering for bytes that changed.
      - name: The Go half of the root contracts
        working-directory: server
        run: go test ./account/ -run '^TestDeviceInboxAdmissionContract' -count=1

  # ── the Web consumer ──────────────────────────────────────────────────────
  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # The full tree, not `--omit=dev`: the runner IS a devDependency here.
      # `npm ci` rather than `npm install` — the tree comes from
      # `package-lock.json` exactly and the lockfile is never rewritten in CI.
      # `--ignore-scripts` because nothing in that closure needs a lifecycle
      # script to run one Vitest file.
      - name: Install the dependency closure the test runner needs
        working-directory: web
        run: npm ci --ignore-scripts
      # One file. Not `npm test`, which is the whole suite plus jsdom journeys.
      - name: The Web half of the root contracts
        working-directory: web
        run: npx vitest run src/lib/device-inbox-admission-contract.test.ts

  # ── the Swift consumer ────────────────────────────────────────────────────
  swift-contract:
    runs-on: macos-15
    # A PAID runner, so the bound is chosen rather than inherited. The package's
    # own unfiltered suite is budgeted at 25 minutes in `swift-package.yml` for
    # a cold SwiftPM resolve plus every test in the target; this job pays the
    # same build and then runs FIVE test cases, measured at 0.7s locally. 25 is
    # that same cold-build bound, not a fresh measurement of the test itself.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Recorded so a future failure can be compared against the toolchain that
      # produced the last green run.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # ALWAYS filtered, and to this one class. `swift-package.yml` owns the
      # repository's sole unfiltered `swift test`; a second one here would run
      # the whole package suite on a document edit and charge a PAID macOS
      # runner twice for one answer. `scripts/test/swift-ci-boundary-test.mjs`
      # asserts both halves of that.
      - name: The Swift half of the root contracts
        working-directory: apps/RelayiumKit
        run: swift test --filter 'RelayiumKitTests.DeviceInboxAdmissionContractTests'

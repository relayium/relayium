name: go
# The server had no CI at all until now: macos.yml is filtered to apps/** and
# repo-hygiene only greps for leaked production identifiers, so a Go change
# could go green on every check while failing to compile. It was deployed on
# the strength of whatever the author happened to run locally — and this
# repository's auto-deploy has no binary rollback, so a server that fails to
# start stays failed until someone pushes a fix forward.
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/go.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The race suite is ~5 minutes; this is a "something has hung" bound, not a
    # target. Failing at 20 beats occupying a runner for the default six hours.
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Single source of truth for the toolchain version, same as release.yml.
          go-version-file: server/go.mod
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain version
        run: go version

      - name: go build
        working-directory: server
        run: go build ./...

      # Catches the classes `go build` accepts and the tests may never reach:
      # Printf arg mismatches, unreachable code, lost struct tags.
      - name: go vet
        working-directory: server
        run: go vet ./...

      # -race, not a plain `go test`. Central runs concurrent goroutines against
      # shared state by design — the GC sweep, the metering worker, the node
      # storage prober — and the failure mode of a data race there is a corrupted
      # ledger or a wedged deploy, discovered in production, not a red build.
      #
      # It costs about five minutes. That is the price of the check, and it is
      # cheaper than the incident.
      #
      # If this ever goes red intermittently, do not paper over it with a retry:
      # a flaky test here is usually a real timing assumption. The first one
      # found was a test seeding an exemption window from wall time and then
      # asserting the boundary at request time, which only held if setup
      # finished inside a second.
      - name: go test -race
        working-directory: server
        run: go test -race ./...

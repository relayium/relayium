name: go
# The server had no CI at all until now: macos.yml is filtered to apps/**,
# repo-hygiene only greps for leaked production identifiers, and release.yml
# runs on tags — so a Go change could be green on every check while failing to
# compile. It was deployed on the strength of whatever the author happened to
# run locally; the gate remains mandatory even though deploy now also rolls a
# failed binary/web swap back automatically.
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/go.yml'
  workflow_dispatch:

jobs:
  # Fast gate: everything that answers "is this code even correct" in ~3
  # minutes. Split from the race job on purpose — a compile break should not
  # wait behind a twenty-minute race detector run to be reported.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the toolchain version, same as release.yml.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain version
        run: go version
      - name: go build
        working-directory: server
        run: go build ./...
      # Catches the classes `go build` accepts and the tests may never reach:
      # Printf arg mismatches, unreachable code, lost struct tags.
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./...
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # Central runs concurrent goroutines against shared state by design — the GC
  # sweep, the metering worker, the node storage prober — and the failure mode
  # of a data race there is a corrupted ledger or a wedged deploy, found in
  # production rather than in a red build.
  race:
    runs-on: ubuntu-latest
    # The account package alone runs ~12 min locally and much longer on a
    # runner. Both bounds below exist because the FIRST version of this workflow
    # hit Go's default 10-minute PER-PACKAGE timeout and reported it as a test
    # failure with a goroutine dump — which reads like a hang in the code, not
    # a budget that was simply too small.
    #
    # Raised again after run 31616382749 (exact SHA): every race package except
    # account passed, and account showed no race and no failed assertion — it
    # was terminated exactly at 1500.972s by the then-25m per-package timeout,
    # i.e. the budget expired, the test did not fail. The identical full account
    # race passed locally in 714.694s, so the hosted runner is at least ~2.1x
    # slower here and its true duration is still unmeasured (only bounded from
    # below). The per-package budget is therefore ~3.8x the local measurement,
    # and the job budget leaves ~15 min on top for checkout, toolchain setup,
    # module download and the remaining packages. Both stay finite on purpose:
    # if a package ever exceeds these, that is a hang worth a goroutine dump,
    # not a number to keep raising.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # If this ever goes red intermittently, do not paper over it with a retry:
      # a flaky test here is usually a real timing assumption. The first one
      # found was a test seeding an exemption window from wall time and then
      # asserting the boundary at request time, which only held if setup
      # finished inside a second.
      - name: go test -race
        working-directory: server
        run: go test -race -timeout 45m ./...

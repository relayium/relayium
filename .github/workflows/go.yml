name: go
# The server had no CI at all until now: macos.yml is filtered to apps/**,
# repo-hygiene only greps for leaked production identifiers, and release.yml
# runs on tags — so a Go change could be green on every check while failing to
# compile. It was deployed on the strength of whatever the author happened to
# run locally; the gate remains mandatory even though deploy now also rolls a
# failed binary/web swap back automatically.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/go-race-shard.go'
      # The race shards' timing-evidence tool and the renewal lane's measured
      # weights: both decide what a shard job runs or reports.
      - 'scripts/go-race-timings.go'
      - 'scripts/go-race-timings-renewal.json'
      - 'scripts/go-race-timings-account.json'
      - 'scripts/test/db-rollback-harness.sh'
      # The CLI/public-truth gate builds the candidate and reads these exact
      # public inputs, so an edit to any of them must select this lane.
      - 'scripts/test/cli-public-truth-test.sh'
      - 'README.md'
      - 'web/public/llms.txt'
      # ...and the /cli page sources plus the maintained public copy it scans
      # for retired CLI claims: the generated en/zh guides, how-tos and
      # comparisons (every page under each directory is read), the privacy
      # and security pages, and the en/zh locale files.
      - 'web/src/lib/cli-page-data.ts'
      - 'web/src/lib/i18n/en.ts'
      - 'web/src/lib/i18n/zh.ts'
      - 'web/scripts/pages/content/spa-pages.mjs'
      - 'web/public/guides/**'
      - 'web/public/how-to/**'
      - 'web/public/compare/**'
      - 'web/public/zh/guides/**'
      - 'web/public/zh/how-to/**'
      - 'web/public/zh/compare/**'
      - 'web/public/privacy/index.html'
      - 'web/public/security/index.html'
      - 'web/public/zh/privacy/index.html'
      - 'web/public/zh/security/index.html'
      # Four frozen fixtures, named one file at a time, each with the Go
      # test that reads it directly:
      #
      # - `server/internal/inboxmanifest/vectors_test.go` reads
      #   `../../../apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json`
      #   and asserts the Go manifest implementation still agrees with it.
      # - `server/internal/linkcrypto/vectors_test.go` reads
      #   `../../../apps/RelayiumKit/Tests/Fixtures/crypto-vectors.json` and
      #   asserts every block of it against the Go link-crypto library.
      # - `server/internal/linkwire/vectors_test.go` reads
      #   `../../../apps/RelayiumKit/Tests/Fixtures/realtime-wire-vectors.json`
      #   and asserts the Go link-wire codecs and classifiers against it. That
      #   library is not imported by any command yet; the CLI keeps its own
      #   separate wire.
      # - `server/internal/linksession/vectors_test.go` reads
      #   `../../../apps/RelayiumKit/Tests/Fixtures/link-session-vectors.json`
      #   (W-N18 A08e) and drives the CLI's real lane machines through every
      #   cross-language state-machine scenario in it.
      #
      # Each file is therefore an input to this suite exactly like a `.go` file
      # is. Without its line an edit to those vectors lands having never run the
      # Go half of the cross-language contract, and the failure surfaces later
      # against an innocent commit that happened to touch `server/**`.
      #
      # Deliberately NOT `apps/RelayiumKit/**` or the whole `Tests/Fixtures/`
      # tree: no other file in that package is an input to any Go test, and
      # either glob would start the entire eight-shard race lane on every Swift
      # edit. `swift-package.yml` owns the package; these are five files it
      # shares. Every line here is mirrored in scripts/release/go-evidence.sh
      # `lane_paths`, which scripts/test/go-evidence-test.sh compares.
      - 'apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json'
      - 'apps/RelayiumKit/Tests/Fixtures/crypto-vectors.json'
      - 'apps/RelayiumKit/Tests/Fixtures/realtime-wire-vectors.json'
      - 'apps/RelayiumKit/Tests/Fixtures/link-session-vectors.json'
      # `server/internal/linksession/renew_vectors_test.go` reads the relay-renew/1
      # vectors the same way; this line was missing until 2026-09-28 (audit D-H2).
      - 'apps/RelayiumKit/Tests/Fixtures/relay-renew-vectors.json'
      # The fuzz campaign's own two files. Neither runs here — the campaign is
      # scheduled, never gating (see .github/workflows/go-fuzz-nightly.yml) —
      # but an edit to either must still start THIS workflow, because that is
      # what runs each fuzz target's `f.Add` seeds as ordinary tests and what
      # proves the module the inventory script enumerates still builds. Without
      # these two lines a change to the discovery script or to the campaign
      # lands having run no Go test at all.
      - 'scripts/list-go-fuzz-targets.sh'
      # A12: the CLI side of the pairing interop matrix, run by exact name in
      # `test` and `cli-windows` below, and the old-CLI builder it needs.
      - 'scripts/interop/cli-go-matrix.sh'
      - 'scripts/interop/build-old-cli.sh'
      - '.github/workflows/go-fuzz-nightly.yml'
      - '.github/workflows/go.yml'
      # The PR→main evidence verifier, its registry, the filter reader it imports,
      # the adoption transform, the toolchain certificate probe and registry, and
      # their tests decide whether a main push may witness this lane instead of
      # re-running it — so a change to any of them is a change to this lane
      # (scripts/ci/ci-evidence-view.mjs).
      - 'scripts/ci/ci-evidence.mjs'
      - 'scripts/ci/ci-evidence-registry.json'
      - 'scripts/ci/select-lanes.mjs'
      - 'scripts/ci/ci-evidence-view.mjs'
      - 'scripts/test/ci-evidence-test.mjs'
      - 'scripts/ci/ci-evidence-toolchain.mjs'
      - 'scripts/ci/ci-evidence-toolchain-registry.json'
      - 'scripts/test/ci-evidence-toolchain-test.mjs'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# `github.ref` is the obvious fallback and is WRONG here: it puts every `main`
# run in one group, and GitHub cancels an older PENDING run in a group when a
# newer one arrives even with `cancel-in-progress: false`. Two quick merges
# would silently drop the first commit's verification, and `main` would show a
# cancelled — not failed, not missing — check for a commit nobody tested.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: go-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR→main evidence: a cheap read-only screen before any paid macOS/Windows
  # probe. `eligible=true` only when this main push has a source proof that a
  # current toolchain certificate could complete; it ENABLES the certify jobs
  # and approves nothing. Never red, and anything but `eligible=true` means no
  # paid probe and the full lane.
  screen:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.screen.outputs.eligible }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Could a current toolchain certificate complete a proof?
        id: screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-evidence.mjs screen go >> "$GITHUB_OUTPUT"

  # PR→main evidence: the windows-latest toolchain a fresh run of this lane would get NOW,
  # resolved by copies of the lane's own selection/setup steps and certified
  # by scripts/ci/ci-evidence-toolchain.mjs. Ordinary main pushes the screen
  # found eligible only; skipped everywhere else. Bounded at 3 minutes and never
  # red: a failed, slow or unknown probe hands over no certificate, and the
  # lane then runs in full.
  certify-windows:
    needs: screen
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.screen.result == 'success' && needs.screen.outputs.eligible == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      certificates: ${{ steps.export.outputs.certificates }}
    steps:
      - name: Check out the probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - name: Certify this runner's toolchain now
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles windows-go --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Hand the certificates to the evidence job
        id: export
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs export --dir "$RUNNER_TEMP/ci-evidence-current" >> "$GITHUB_OUTPUT"

  # PR→main evidence reuse (scripts/ci/ci-evidence.mjs; docs/CI-PLATFORM-BOUNDARY.md).
  #
  # On an ORDINARY push to main, decides whether the merged pull request's
  # latest merge-gate run already proved this exact tree for this lane, on the
  # same toolchain this runner family offers now. Every other event — the merge
  # gate's own pull_request call, a dispatch, a release caller — skips the
  # decision, so `reuse` is empty and every job below runs its original steps
  # on its original runner. The verifier always exits 0 and any doubt is
  # `reuse=false`: a missing, partial, stale, uncertified or mismatched proof
  # means the full lane, never approval. It reads the GitHub API (hence the
  # read-only actions/pull-requests grants) and runs nothing it downloads.
  # Never red (`continue-on-error`), and nothing below depends on how it
  # ended: every original job's condition is an explicit `!cancelled()` over
  # its OWN needs, so a failed setup step, a timeout or a skipped dependency
  # here leaves `reuse` empty and the whole lane runs in full.
  # `!cancelled()`: a failed, timed-out or skipped dependency must not skip
  # this job either. It then decides `reuse=false`.
  evidence:
    needs: [screen, certify-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Promoted ONLY by the handover, after the witness was kept: a decision
    # whose upload failed or timed out, or whose retained file is missing or
    # not the decided witness, never reaches the jobs below.
    outputs:
      reuse: ${{ steps.handover.outputs.reuse }}
      witness: ${{ steps.handover.outputs.witness }}
    steps:
      - name: Check out the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          # Single source of truth for the toolchain version, same as release.yml.
          go-version-file: server/go.mod
      - name: Certify this runner's toolchain now (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles linux-go --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Take the certify jobs' certificates (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CI_EVIDENCE_CERTIFICATES_WINDOWS: ${{ needs['certify-windows'].outputs.certificates }}
        run: node scripts/ci/ci-evidence-toolchain.mjs import --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Does the merged pull request's full proof cover this main tree?
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_CURRENT_TOOLCHAIN_DIR: ${{ runner.temp }}/ci-evidence-current
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/go.json
        run: node scripts/ci/ci-evidence.mjs witness go >> "$GITHUB_OUTPUT"
      - name: Keep the witness (reuse only)
        id: keep
        if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-witness-go-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-witness
          if-no-files-found: error
          retention-days: 30
      - name: Hand the decision to the lane only once its witness is kept
        id: handover
        if: steps.verify.outputs.reuse == 'true' && steps.keep.outcome == 'success'
        env:
          CI_EVIDENCE_WITNESS: ${{ steps.verify.outputs.witness }}
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/go.json
        run: node scripts/ci/ci-evidence.mjs handover >> "$GITHUB_OUTPUT"
  # (end of the PR→main evidence jobs; everything above was generated by scripts/ci/ci-evidence-view.mjs)

  # Fast gate: everything that answers "is this code even correct" in ~3
  # minutes. Split from the race jobs on purpose — a compile break should not
  # wait behind a race detector run to be reported.
  test:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 15 before A12 added the named CLI pairing matrix (real CLI processes,
    # old-CLI build included), measured locally at a few minutes; the bound
    # stays finite and roughly twice the expected wall clock.
    timeout-minutes: 30
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the toolchain version, same as release.yml.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain version
        run: go version
      - name: go build
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        run: go build ./...
      # Catches the classes `go build` accepts and the tests may never reach:
      # Printf arg mismatches, unreachable code, lost struct tags.
      - name: go vet
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        run: go vet ./...
      # The A11 relay-renewal driver tests run in REAL time on 100-300 s
      # credentials — a renewal only happens inside a credential's final
      # margin — and together they take ~20 minutes, which pushed
      # `cmd/relayium` past Go's 10-minute per-package default here (run
      # 35959733079). They are skipped by ONE pattern and run, under -race, in
      # their own `link-renew` job below with that SAME pattern;
      # scripts/test/ci-event-policy-test.mjs asserts the two stay identical,
      # so nothing is skipped here that `link-renew` does not run.
      - name: go test
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        run: go test -skip '^(TestLinkRenew|TestLDRenew)' ./...
      # A12: the CLI pairing matrix, by exact name, with the old-version pairs
      # NOT skipping. This checkout is one commit deep, so `ldOldCLI` cannot
      # find 723481c78 and the step above ran every old-version pair as a SKIP;
      # the builder fetches that commit (read from `ldOldCommit`, never a second
      # literal), builds its CLI and refuses a binary that knows `__link`.
      # `cli-go-matrix.sh` then requires a PASS line per named test, no SKIP
      # (one named, reasoned subtest excepted), no FAIL, and both link roles in
      # the CLI processes' own output. See docs/CI-PLATFORM-BOUNDARY.md.
      - name: Build the released CLI (723481c78) the old-version pairs talk to
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          old="$(scripts/interop/build-old-cli.sh "$RUNNER_TEMP/relayium-old")"
          echo "RELAYIUM_OLD_CLI=$old" >> "$GITHUB_ENV"
      - name: CLI pairing interop matrix (named; old-version pairs included; no SKIP)
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        run: bash scripts/interop/cli-go-matrix.sh run linux "$RUNNER_TEMP/cli-matrix-linux.log"
      # The step prints each failed test's output itself; the whole -v log
      # (both CLI processes' transcripts for every cell) is kept on failure.
      - name: Keep the CLI matrix log (on failure)
        if: failure() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-matrix-linux-log
          path: ${{ runner.temp }}/cli-matrix-linux.log
          if-no-files-found: ignore
          retention-days: 14
      # SSH transport is retired. Verify the real binary rejects every former
      # entrypoint, without source/config writes, and never consumes stdin.
      - name: Retired SSH entrypoints (real CLI)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ssh-retirement.log"
          go test -count=1 -v -timeout 3m -run '^TestSSH(TransfersDisabled|RetirementDoesNotConsumeStdin)$' ./cmd/relayium | tee "$log"
          for t in TestSSHTransfersDisabled TestSSHRetirementDoesNotConsumeStdin; do
            grep -q "^--- PASS: $t " "$log" || { echo "::error::$t did not PASS" >&2; exit 1; }
          done
      - name: CLI binary and public truth agree
        if: needs.evidence.outputs.reuse != 'true'
        run: sh scripts/test/cli-public-truth-test.sh
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # The step above cannot see pion/turn. server/go.mod replaces it with the
      # directory server/third_party/pion-turn (see its PATCHES.md), and a
      # directory replace has no version, so govulncheck reports nothing for it
      # — not "clean", just unscanned. This asks the vulnerability database
      # about the exact upstream version the copy was taken from instead.
      #
      # Query mode exits 0 whether or not it finds advisories; findings arrive
      # only as `osv` entries in the JSON stream. So the stream is read, and
      # everything short of a positive, well-formed "nothing found for exactly
      # this module and version" fails: unparseable or empty output, a report
      # from another scanner version or mode, no confirmation that this module
      # at this version was looked up, an unknown message type, and any
      # advisory at all. The version comes from go.mod (whose require
      # TestPionTurnLocalCopyProvenance ties to the copy), never a second
      # literal here.
      - name: govulncheck (pion/turn, which the directory replace hides from the step above)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          scanner=golang.org/x/vuln/cmd/govulncheck@v1.6.0
          mod=github.com/pion/turn/v4
          ver="$(go list -m -f '{{.Version}}' "$mod")"
          if ! [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::go.mod gives no release version for $mod (got '$ver')" >&2
            exit 1
          fi
          report="$RUNNER_TEMP/govulncheck-pion-turn.json"
          go run "$scanner" -mode=query -json "$mod@$ver" > "$report"
          if ! jq -e -n -r \
            --arg scanner_version "${scanner##*@}" \
            --arg lookup "Looking up vulnerabilities in $mod at $ver..." '
              [inputs] as $m
              | if ($m | map(select(type != "object")) | length) > 0 then error("non-object message")
                elif ($m | map(select(keys - ["config", "progress", "osv"] != [])) | length) > 0 then error("unknown message type")
                elif ($m | map(select(has("config"))) | length) != 1 then error("expected exactly one config message")
                elif ($m | map(select(.config.scanner_version == $scanner_version and .config.scan_mode == "query")) | length) != 1
                  then error("not a govulncheck " + $scanner_version + " query-mode report")
                elif ($m | map(select(.progress.message == $lookup)) | length) != 1 then error("no confirmation of: " + $lookup)
                elif ($m | map(select(has("osv"))) | length) > 0
                  then error("advisories: " + ($m | map(select(has("osv")) | "\(.osv.id) \(.osv.summary)") | join("; ")))
                else "no advisories for " + $lookup end
            ' < "$report"; then
            echo "::error::$mod@$ver: the vulnerability query did not come back clean (see above)" >&2
            exit 1
          fi
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-go --lane go --job test --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-test-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # The Windows runtime lane of the `push -` stdin library (R-C14 phase 2a):
  # the exact-owned stdin helper (`internal/stdinpump`), and the stream
  # sender/receiver (`internal/xfer` stream_*.go), executed on a real Windows
  # host. Its mechanisms differ there in ways only running them can prove:
  # the parent-death pipe is an inherited handle named in argv, closing a
  # pipe cancels a pending ReadFile, TerminateProcess replaces signals, and
  # the no-clobber install is NTFS FileLinkInformation against files and
  # junctions. Compiling for Windows proves none of that; these are runtime
  # tests, and each one must appear as PASS below.
  #
  # Phase 2b extended this job to `./cmd/relayium` (the `push -` CLI, the
  # real `__pump-stdin` dispatch, the `__recv --stream-file` receiver as a
  # process via a test-only receiver-engine role). SSH CLI entrypoints are
  # now disabled; this job proves rejection with the actual built binary. A Windows-red compile of that package's TESTS means a new
  # server-only test file (one that imports `account`/`internal/storage`,
  # which use syscall.Statfs, or a helper from such a file) needs
  # `//go:build !windows` with a reason — never a Windows `storage`
  # implementation (the relay node is not released for Windows). Tagged so
  # far: cloud_e2e_test.go, inbox_e2e_test.go, inbox_send_e2e_test.go,
  # inbox_send_json_test.go; e2e_stdin_test.go is Unix-only (real sshd).
  #
  # No -race: the race toolchain is not established on this runner; the same
  # tests run under -race on ubuntu in `race-rest`.
  cli-windows:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'windows-latest' }}
    # 30 before A12 appended the CLI pairing matrix and the old-CLI build.
    timeout-minutes: 50
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Toolchain version
        if: needs.evidence.outputs.reuse != 'true'
        run: go version
      - name: go vet (Windows; the stream library's packages and the CLI)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        run: go vet ./internal/xfer ./internal/sshx ./internal/stdinpump ./cmd/relayium
      # The PASS grep is load-bearing, as in `test`: a renamed or deleted test
      # makes `-run` match nothing and `go test` still exits 0. Three tests
      # may SKIP here, each for a reason stated in the test itself: POSIX
      # umask/modes do not exist, os.Interrupt cannot be sent to one process,
      # and Windows may refuse to rename a directory another handle holds
      # (which makes that swap impossible). Any other SKIP fails the job.
      - name: Windows runtime tests (stdin pump, stream protocol)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cli-windows.log"
          go test -count=1 -v -timeout 10m \
            -run '^(TestStream|TestPump|TestHelper|TestExitWatchdog|TestReceiveAny|TestValidateStreamPath)' \
            ./internal/stdinpump ./internal/xfer | tee "$log"
          may_skip=" TestPumpHelperIgnoresInterrupt TestStreamRecvModesUnderUmask TestStreamRecvParentSwap "
          for t in TestPumpStopJoinsBlockedStdinWindows TestPumpHelperExitsOnParentDeathWindows TestStreamRecvRootWindows \
            TestPumpStopReleasesBlockedRead TestPumpEndMarkerIsEOF TestPumpKilledHelperIsNotEOF TestPumpStdinReadErrorIsStdinError \
            TestPumpHelperIgnoresInterrupt TestPumpSharedOffsetBeforeAndAfterStart TestPumpNotStartedLeavesPipeUnread \
            TestPumpStopBoundsStuckHelperAfterEnd TestPumpHelperExitsOnParentDeath TestHelperFraming TestPumpReadDecoding \
            TestStreamGoldenV1HelloUnchanged TestStreamGoldenFrames TestStreamRecvRefusesBeforeAccept \
            TestStreamRecvIncompleteInstallsNothing TestStreamRecvNoClobberRace TestStreamRecvModesUnderUmask \
            TestStreamRecvParentSwap TestStreamRecvWriteFailure TestStreamRecvBoundedErrorWrite TestStreamRecvIdle \
            TestStreamRecvRejectsMalformedChallenge TestStreamRecvResultEchoesAfterInstall \
            TestStreamRecvAbandonedGuardNeverInstalls TestStreamRecvWatchdogExitsWithFullStdoutAndStderr \
            TestStreamRecvWatchdogIdleRemovesStaging TestExitWatchdogPeerBounds TestStreamRoundTrip \
            TestStreamNoSourceBeforeAccept TestStreamJoinsBlockedSource TestStreamSourceVanishedNeverEnds \
            TestStreamAbortReleasesBlockedWrite TestStreamAbortReleasesBlockedTLSWrite TestStreamPrematureResultRejected \
            TestStreamCancelBeforeAcceptWithBlockedWrite TestStreamValidFastReceipt TestStreamWordingByPhase \
            TestStreamHeldEndAfterValidReceiptIsBounded TestStreamDelayedPrematureReceiptRejected \
            TestStreamChallengeFreshAndOnlyInEnd TestStreamWrongEchoOrWrongBytes TestStreamKeepaliveHoldsIdleReceiver \
            TestStreamProgress TestStreamRealPumpRoundTrip TestStreamRealPumpRefusalLeavesStdinUnread \
            TestStreamRealPumpKilledMidStream TestStreamJudgedStageIsNotOvertakenByEnd TestStreamNoSourceAfterWriteFailure \
            TestStreamRecvWatchdogReportsWhatWasStaged TestStreamRecvWatchdogHelperKeepsInstalledFile \
            TestStreamRecvGuardKeepsInstalledDestination \
            TestValidateStreamPath TestReceiveAnyDispatchesV1Unchanged TestReceiveAnyStreamInstallsUnderRoot \
            TestReceiveAnyStreamRefusesPathsBeforeAccept TestReceiveAnyStreamWriteFailedBoundedTCP \
            TestReceiveAnyStreamIdleTCP; do
            if grep -q "^--- PASS: $t " "$log"; then continue; fi
            if [[ "$may_skip" == *" $t "* ]] && grep -q "^--- SKIP: $t " "$log"; then continue; fi
            echo "::error::$t did not PASS on Windows" >&2
            exit 1
          done
          while read -r _ _ name _; do
            [[ "$may_skip" == *" $name "* ]] || { echo "::error::$name skipped on Windows" >&2; exit 1; }
          done < <(grep '^--- SKIP: ' "$log" || true)
      # `push -` in the CLI package, over the ssh stand-in and to a real
      # loopback `serve` listener (in-process and as a real `serve --once`
      # process). Two tests may SKIP, each for the reason stated in it:
      # SIGTERM cannot be sent to one process on Windows, and the old-release
      # listener test needs privately built old binaries
      # (RELAYIUM_E2E_OLD_RELAYIUM), which this job does not build. Any other
      # SKIP fails the job.
      - name: Windows runtime tests (SSH retirement, stream receiver, serve listener)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cli-windows-push-stdin.log"
          go test -count=1 -v -timeout 10m \
            -run '^(TestPushStdin|TestRecvStreamFile|TestSSH|TestStandinPosixWords|TestE2EPushStdinDaemon|TestE2EServeOnceStream)' \
            ./cmd/relayium | tee "$log"
          may_skip=" TestRecvStreamFileHelperSignalRemovesStaging TestE2EPushStdinDaemonOldReleases "
          for t in TestSSHTransfersDisabled TestSSHRetirementDoesNotConsumeStdin TestPushStdinShapeRefusalsTouchNothing TestPushStdinRefusesATerminal TestRecvStreamFileArgv \
            TestRecvStreamFileHelperInstalls TestRecvStreamFileHelperRefusesBeforeAccept \
            TestRecvStreamFileHelperIdleWatchdog TestRecvStreamFileHelperSignalRemovesStaging \
            TestRecvStreamFileHelperLostReceiptIsReportedOnStderr TestStandinPosixWordsUndoShellQuote \
            TestE2EPushStdinDaemonLoopback TestE2EPushStdinDaemonRefusals TestPushStdinDaemonPathRefusedBeforeDial \
            TestPushStdinDaemonListenerRefusesBadPaths TestE2EPushStdinDaemonUnauthorized TestE2EPushStdinDaemonPinMismatch \
            TestE2EPushStdinDaemonOldPeerFixtures TestE2EServeOnceStream TestE2EPushStdinDaemonStreamCut \
            TestPushStdinDaemonCancelInProcess TestPushStdinDaemonKeepaliveHoldsIdleListener \
            TestPushStdinDaemonExactlyOnceInstall TestPushStdinDaemonRefusalsNeverStartThePump; do
            if grep -q "^--- PASS: $t " "$log"; then continue; fi
            if [[ "$may_skip" == *" $t "* ]] && grep -q "^--- SKIP: $t " "$log"; then continue; fi
            echo "::error::$t did not PASS on Windows" >&2
            exit 1
          done
          while read -r _ _ name _; do
            [[ "$may_skip" == *" $name "* ]] || { echo "::error::$name skipped on Windows" >&2; exit 1; }
          done < <(grep -E '^ *--- SKIP: ' "$log" || true)
      - name: go vet (Windows; the inbox send lock)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        run: go vet ./internal/inboxsend/sendlock
      # The send lock's Windows half is LockFileEx, and these three tests hold
      # it from real child processes, so only a Windows runner exercises it.
      # The same load-bearing PASS grep as above; none of the three may SKIP.
      - name: Windows runtime tests (inbox send lock)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cli-windows-sendlock.log"
          go test -count=1 -v -timeout 2m ./internal/inboxsend/sendlock | tee "$log"
          for t in TestAnotherProcessHoldingTheLockExcludesThisOne TestAKilledHolderLeavesNoStaleLock \
            TestTwoHandlesInOneProcessExcludeEachOther; do
            grep -q "^--- PASS: $t " "$log" || { echo "::error::$t did not PASS on Windows" >&2; exit 1; }
          done
          if grep '^--- SKIP: ' "$log"; then
            echo "::error::a send lock test skipped on Windows" >&2
            exit 1
          fi
      # A12: the CLI pairing interop matrix on a real Windows host, by exact
      # name — CLI↔CLI over link/1 (files, folders, texts, decline, rejected
      # SAS), send/receive/text/pair over link, the CLI against a Go-authored
      # app peer, and the old-version pairs against the released 723481c78 CLI
      # built for Windows here. `cli-go-matrix.sh` drops only the ctrl-C cell
      # (SIGINT cannot be sent to one process on Windows) and fails on any
      # other missing PASS, any SKIP but its one reasoned subtest, or a log
      # without both link roles.
      - name: Build the released CLI (723481c78) for the old-version pairs (Windows)
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          old="$(scripts/interop/build-old-cli.sh "$(cygpath -u "$RUNNER_TEMP")/relayium-old")"
          echo "RELAYIUM_OLD_CLI=$old" >> "$GITHUB_ENV"
      - name: Windows CLI pairing interop matrix (named; old-version pairs included; no SKIP)
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        run: bash scripts/interop/cli-go-matrix.sh run windows "$RUNNER_TEMP/cli-matrix-windows.log"
      # Run 35959733079 printed only the FAIL summary and the log died with the
      # runner; now the failed tests' output is printed by the step and the
      # whole log is kept.
      - name: Keep the Windows CLI matrix log (on failure)
        if: failure() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-matrix-windows-log
          path: ${{ runner.temp }}/cli-matrix-windows.log
          if-no-files-found: ignore
          retention-days: 14
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile windows-go --lane go --job cli-windows --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-cli-windows-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # Central runs concurrent goroutines against shared state by design — the GC
  # sweep, the metering worker, the node storage prober — and the failure mode
  # of a data race there is a corrupted ledger or a wedged deploy, found in
  # production rather than in a red build.
  #
  # ## Why this is eight jobs and not one
  #
  # It was one `go test -race -timeout 45m ./...`, measured at ~43m35s. Every
  # previous response to that lane was to raise its timeout: 10m, then 25m,
  # then 45m, under a 60m job bound. A budget that close to the measurement is
  # not a hang detector — the lane fails by expiring before it fails by finding
  # a race, and run 31616382749 did exactly that at 1500.972s with no race and
  # no failed assertion, which reads like a hang in the code rather than a
  # budget that was too small.
  #
  # `server/account` is essentially all of it: 1904 top-level tests, 714.694s
  # locally against ~2615s hosted, i.e. this runner is ~3.66x slower.
  #
  # All eight shards were measured locally on 2026-08-21, same machine as that
  # 714.694s baseline:
  #
  #     shard 0  177.9s   shard 4  123.1s
  #     shard 1  133.6s   shard 5  156.8s
  #     shard 2  172.0s   shard 6  164.3s
  #     shard 3  155.2s   shard 7  150.6s
  #
  # The slowest is 177.9s, which is 24.9% of the serial run rather than the
  # 13.4% its test COUNT would predict — the tests are not equal in cost, and
  # every shard re-pays the package's fixed setup, so the eight together use
  # ~1233s of CPU against 714.694s serial. That is the trade: ~1.7x the total
  # machine time for ~4x less wall clock on the critical path.
  #
  # Scaled by the measured 3.66x runner factor, the slowest shard projects to
  # ~651s (~10.9 min) hosted. The 20m per-package budget is therefore ~1.8x the
  # projection, and the 25m job budget leaves ~10 min on top for checkout,
  # toolchain setup, module download and the race build. Both stay finite on
  # purpose: unlike the 45m budget against a 43m35s measurement they replace,
  # exceeding either of these means a hang worth its goroutine dump rather than
  # a number to raise again.
  #
  # Sharding hides one class it cannot see: a race that only appears when two
  # tests run in the same process, or in a particular order. That is what
  # account-race-nightly.yml exists for — do not delete it as redundant.
  race-account:
    name: race account shard ${{ matrix.shard }}
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One shard failing must not cancel the other seven. A race is usually
      # reported by exactly one shard, and cancelling the rest would hide
      # whether the others were clean and turn a rerun into a guess.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # scripts/go-race-shard.go lists the package's top-level tests (the
      # compiled list is authoritative) and plans them longest-processing-time
      # first over scripts/go-race-timings-account.json: every account test's
      # hosted -race -count=1 duration from full-bootstrap run 37421626823
      # attempt 1 at e4b538f18 (2652 tests, one legitimate SKIP, 6392.31s
      # summed), regenerated by `go-race-timings.go corpus` from the eight
      # uploaded evidence archives. The weighted plan for that list is
      # 798.839-799.730s per shard — a planned estimate, not a measured gain,
      # until a new hosted run under this profile measures it. (Historical: in
      # the older run 36893745143, FNV's count-balanced shards measured 635s
      # to 1116s.) A test added since plans at the largest measured weight
      # (124.87s), so it joins first rather than last;
      # a measured entry for a deleted test is ignored. All eight jobs derive
      # the same plan, and the helper proves it on every invocation — every
      # test in exactly one shard, the union equal to the list, no shard
      # empty, each anchored selector exact — and exits non-zero otherwise, so
      # eight green jobs cannot between them have run nothing.
      #
      # Listing and running happen in ONE step so the ~11KB anchored regex never
      # has to survive a trip through GITHUB_ENV. The helper lists with -race so
      # this build populates the cache the test run immediately reuses.
      #
      # If this ever goes red intermittently, do not paper over it with a retry:
      # a flaky test here is usually a real timing assumption. The first one
      # found was a test seeding an exemption window from wall time and then
      # asserting the boundary at request time, which only held if setup
      # finished inside a second.
      #
      # Timing evidence. The run is `go test -json`, rendered back to the
      # usual -v text for this log by scripts/go-race-timings.go, and kept
      # whole; `evidence` then records every assigned test's result and
      # elapsed seconds with the commit, toolchain, GitHub run ID and attempt,
      # -race/-count, shard and the complete compiled inventory (from the
      # helper's -plan-out). It fails the
      # step if an assigned test produced no result or a test outside the shard
      # ran. The upload below keeps it whether the job passed or not, so eight
      # shards of one run are a corpus `go-race-timings.go corpus` can turn into
      # a refreshed profile; replacing the profile is a deliberate edit that
      # ci-event-policy-test.mjs pins by digest.
      #
      # `|| status=$?` keeps go test's status through tee and render (pipefail)
      # without letting `set -e` skip the evidence; the step still exits with it.
      - name: go test -race (account shard ${{ matrix.shard }} of 8)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-race-timing"
          mkdir -p "$out"
          RUN_REGEX="$(go run ../scripts/go-race-shard.go -weights ../scripts/go-race-timings-account.json -shards 8 \
            -shard '${{ matrix.shard }}' -plan-out "$out/plan.json")"
          status=0
          go test -race -count=1 -timeout 20m -json -run "$RUN_REGEX" ./account | tee "$out/go-test.json" | go run ../scripts/go-race-timings.go render || status=$?
          go run ../scripts/go-race-timings.go evidence -lane account -plan "$out/plan.json" -json "$out/go-test.json" \
            -source-sha "$(git rev-parse HEAD)" -toolchain "$(go version)" -run-id "$GITHUB_RUN_ID" \
            -run-attempt "$GITHUB_RUN_ATTEMPT" -race -count 1 -go-exit "$status" \
            -out "$out/evidence.json" || { [ "$status" -ne 0 ] || status=1; }
          exit "$status"
      - name: Keep the account shard timing evidence
        if: always() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-race-timing-account-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-race-timing
          if-no-files-found: error
          retention-days: 30
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-go --lane go --job race-account --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-race-account-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # Every package EXCEPT account, which the shards above cover. The list is
  # enumerated from `go list ./...` at run time rather than written out here, so
  # a new package is race-checked the moment it exists — a hand-maintained list
  # is the one that silently stops covering things.
  race-rest:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          # The second file is the nested pion-turn module's (last step), so
          # its test-only downloads are cached with the rest.
          cache-dependency-path: |
            server/go.sum
            server/third_party/pion-turn/go.sum
      - name: go test -race (every package except account)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        # Named explicitly because the last line DEPENDS on word splitting, and
        # that is a bash behaviour. It is already the runner default; stating it
        # means a future default change turns into a different shell rather than
        # into one `go test` argument containing 26 newline-separated package
        # paths, which fails in a way that reads like a broken package list.
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one package is excluded, matched in full so a future
          # `account/...` subpackage is still covered here.
          PKGS="$(go list ./... | grep -v '^github.com/relayium/relayium/account$')"
          if [ -z "$PKGS" ]; then
            echo "go list produced no packages outside account" >&2
            exit 1
          fi
          echo "$PKGS"
          # Word splitting is the point: this is a package list.
          # shellcheck disable=SC2086
          # The renewal driver tests run in `link-renew` (same pattern).
          go test -race -count=1 -timeout 20m -skip '^(TestLinkRenew|TestLDRenew)' $PKGS
      # server/third_party/pion-turn is pion/turn v4.1.4 plus Relayium's
      # allocation identity patch (see its PATCHES.md), and it is its OWN
      # module: the `go.mod` there is upstream's, byte for byte. `go list ./...`
      # above, and every `./...` in `test`, therefore stop at that directory, so
      # without this step the patched code's own tests — including the ones that
      # fail on unpatched v4.1.4 — would never run anywhere. The relay node is
      # built from this copy, so it is race-checked with everything else here,
      # and vetted here because `test`'s `go vet ./...` cannot see it either.
      #
      # `.` and `./internal/...` rather than `./...`: those are the packages the
      # node links. The rest is upstream's `examples/`, which Relayium does not
      # build and which upstream's own code already fails `go vet` on. The
      # module's go.sum is upstream's and verifies its test-only downloads.
      - name: go vet and go test -race (the pion-turn local copy, a nested module)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server/third_party/pion-turn
        shell: bash
        run: |
          set -euo pipefail
          go vet . ./internal/...
          go test -race -count=1 -timeout 10m . ./internal/...
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-go --lane go --job race-rest --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-race-rest-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # A11 relay-renew/1, end to end: two CLI ends, the real signalling hub and
  # grant registry, the in-process TURN server with REST auth on every request
  # and per-allocation byte counters, and (Linux/macOS) a real node's ledger.
  # These tests are wall-clock bound BY DESIGN: a renewal is only requested
  # inside a credential's final margin and only proven by moving bytes past the
  # old deadline, so each one waits out 100-300 s credentials in real time.
  # Accelerating them further would mean shrinking the product's own margins,
  # which is what they prove.
  #
  # Split from `test` and `race-rest` (run 35959733079: both hit the 10m / 20m
  # per-package bound inside cmd/relayium with no failed assertion). The
  # pattern is the one both of those `-skip`; ci-event-policy-test.mjs asserts
  # the same string, that the shards below plan exactly it and run it under
  # -race with a finite -timeout and -count=1, and that it matches every test
  # in linkrenew*_test.go.
  #
  # Two jobs, planned from measured time. Locally (2026-09-24) the 15 tests
  # took 1183s without -race and ~1190s with it — they sleep far more than they
  # compute — and PR #156's hosted run 36873812806 (job 110408099155) took
  # 1190.398s, its top-level PASS times summing to 1188.60s. As one job that
  # made link-renew the Go workflow's critical path (~21 min in each of the ten
  # main runs measured on 2026-10-01). Because the tests wait rather than
  # compute, splitting them shortens the wall clock almost linearly.
  #
  # scripts/go-race-shard.go lists the tests with the SAME pattern `test` and
  # `race-rest` -skip (compiled, so a new renewal test joins automatically),
  # and plans them by longest-processing-time first over
  # scripts/go-race-timings-renewal.json — those hosted PASS times, recorded
  # with their run, job, commit and toolchain. The plan is 593.721s and
  # 594.880s. A test with no recorded time plans at the largest one, so a new
  # test is placed first rather than dropped; a stale entry is ignored. The
  # helper proves the two -run selectors exact, disjoint, non-empty and
  # together the whole list, and fails otherwise.
  #
  # Each job needs a PASS for every test it was assigned, and no SKIP anywhere,
  # subtests included (the ledger test skips only under -short): `evidence`
  # checks both against the plan and the `go test -json` stream, and fails on
  # any test outside the plan. Bounds: 20m per package is ~2x the ~595s plan,
  # 25m per job adds checkout, setup and the race build; both stay finite on
  # purpose — exceeding either is a hung renewal, not a number to raise. No
  # retry, and fail-fast off so one renewal failure leaves the other known.
  #
  # scripts/test/go-local.sh still runs the whole pattern in one process; the
  # policy accepts that as equivalent because the plan's union is the pattern.
  link-renew:
    name: link-renew shard ${{ matrix.shard }}
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Toolchain version
        if: needs.evidence.outputs.reuse != 'true'
        run: go version
      - name: go test -race (A11 relay-renewal driver tests, shard ${{ matrix.shard }} of 2)
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-race-timing"
          mkdir -p "$out"
          # The declarations, independently of the compiler: `evidence` fails if
          # the compiled list differs (a build tag would otherwise drop a test).
          grep -hoE '^func (TestLinkRenew|TestLDRenew)[A-Za-z0-9_]*' cmd/relayium/*_test.go | awk '{print $2}' > "$out/declared.txt"
          RUN_REGEX="$(go run ../scripts/go-race-shard.go -package ./cmd/relayium -pattern '^(TestLinkRenew|TestLDRenew)' \
            -weights ../scripts/go-race-timings-renewal.json -shards 2 -shard '${{ matrix.shard }}' -plan-out "$out/plan.json")"
          status=0
          go test -race -count=1 -timeout 20m -json -run "$RUN_REGEX" ./cmd/relayium | tee "$out/go-test.json" | go run ../scripts/go-race-timings.go render || status=$?
          go run ../scripts/go-race-timings.go evidence -lane renewal -plan "$out/plan.json" -json "$out/go-test.json" \
            -source-sha "$(git rev-parse HEAD)" -toolchain "$(go version)" -run-id "$GITHUB_RUN_ID" \
            -run-attempt "$GITHUB_RUN_ATTEMPT" -race -count 1 -go-exit "$status" \
            -require-pass -forbid-skip -expect-inventory "$out/declared.txt" -out "$out/evidence.json" || { [ "$status" -ne 0 ] || status=1; }
          exit "$status"
      - name: Keep the renewal shard timing evidence
        if: always() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-race-timing-renewal-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-race-timing
          if-no-files-found: error
          retention-days: 30
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-go --lane go --job link-renew --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-link-renew-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # The one lane that runs an OLD server binary against a NEW database.
  #
  # deploy/auto-deploy.sh rolls a failed swap back by putting the previous
  # binary in front of the file the new one already opened, migrated and wrote
  # to. Every migration test in server/account runs one binary FORWARD over an
  # old file; none of them ever hands a newer file to an older binary, so the
  # rollback direction had no coverage at all — and the failure it would find is
  # a production instance that will not start, discovered at the worst moment.
  #
  # scripts/test/db-rollback-harness.sh builds two real binaries — the commit in
  # server/ROLLBACK-FLOOR and this worktree — and drives one shared SQLite file
  # through floor -> HEAD -> floor -> HEAD over the public HTTP surface.
  #
  # server/ROLLBACK-FLOOR names the oldest STILL-SUPPORTED rollback baseline,
  # not the currently deployed commit. It is expected to sit behind production
  # and must not be advanced just because a deploy happened; see that file for
  # the three conditions an advance has to meet. For this job the consequence is
  # simply that the floor-to-HEAD gap only ever grows, which makes the exercise
  # stricter over time rather than staler.
  #
  # Isolated from `test` on purpose. It is the only job here that needs full git
  # history, it costs two server builds, and a rollback failure is a different
  # answer from a compile failure: sharing a job would make one of them wait for
  # the other and report as the other.
  #
  # 20 minutes against a measured ~7s of stage time. That is not a padded
  # estimate — nothing in the stages scales with the runner, so anything
  # approaching the budget is a hung server or a wedged database rather than a
  # slow one. The budget does have to absorb two real things beyond the stages:
  # the two server builds, and just under 6.5 minutes of deliberate waiting if
  # the harness's month-window gate lands near a UTC month boundary — its 360s
  # margin plus a 5s settle, hard-capped at 420s (the gate refuses to start
  # the stages inside the margin, because /api/me/usage answers per calendar
  # month and a straddling run would report the reset as an accounting
  # mismatch). Both fit with room to spare.
  rollback-floor:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm go
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
        with:
          # The floor is an ANCESTOR of HEAD, and the default depth-1 checkout
          # does not contain an ancestor's objects. Without full history the
          # harness cannot build the floor binary at all, and the reachability
          # test below has nothing to check — which is exactly why that test
          # skips elsewhere and is made strict here.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          # Keyed on HEAD's go.sum only. The floor commit has its own, possibly
          # different, dependency graph, so the floor build is the one that may
          # still fetch from the module proxy. That is expected: this job is not
          # offline, and the harness does not claim to be. Integrity comes from
          # each tree's own go.sum, and GOFLAGS=-mod=readonly in the harness
          # stops either build from rewriting go.mod/go.sum to make itself
          # compile.
          cache-dependency-path: server/go.sum
      # The harness builds with GOTOOLCHAIN=local, so this is the toolchain both
      # binaries are compiled with, and a tree asking for a newer Go fails here
      # rather than silently downloading one. Recorded for the same reason as in
      # `test`.
      - name: Toolchain version
        if: needs.evidence.outputs.reuse != 'true'
        run: go version
      # Fail on an unreadable or unreachable floor record BEFORE spending two
      # server builds on it. RELAYIUM_ROLLBACK_FLOOR_STRICT turns the
      # shallow-clone skips in server/rollback_floor_test.go into failures; this
      # is the one job with the history to make that meaningful.
      - name: rollback floor record parses and points at a real ancestor
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: server
        env:
          RELAYIUM_ROLLBACK_FLOOR_STRICT: '1'
        run: go test -count=1 -timeout 5m -run 'RollbackFloor' ./
      - name: real-binary SQLite rollback evidence
        if: needs.evidence.outputs.reuse != 'true'
        run: scripts/test/db-rollback-harness.sh
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-go --lane go --job rollback-floor --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-go-rollback-floor-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

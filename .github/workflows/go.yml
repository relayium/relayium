name: go
# The server had no CI at all until now: macos.yml is filtered to apps/**,
# repo-hygiene only greps for leaked production identifiers, and release.yml
# runs on tags — so a Go change could be green on every check while failing to
# compile. It was deployed on the strength of whatever the author happened to
# run locally; the gate remains mandatory even though deploy now also rolls a
# failed binary/web swap back automatically.
on:
  push:
    # Only `main`. A branch push used to start this workflow AND its pull
    # request start a second, identical run of the same commit — two full race
    # lanes for one change. The pull_request trigger below is what gates branch
    # work; this one exists so `main` itself is never unverified.
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/go-race-shard.go'
      - 'scripts/test/db-rollback-harness.sh'
      # One frozen-bytes fixture, named one file at a time.
      # `server/internal/inboxmanifest/vectors_test.go` reads it directly at
      # `../../../apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json`
      # and asserts the Go manifest implementation still agrees with it, so the
      # file is an input to this suite exactly like a `.go` file is. Without
      # this line an edit to those vectors lands having never run the Go half of
      # the cross-language contract, and the failure surfaces later against an
      # innocent commit that happened to touch `server/**`.
      #
      # Deliberately NOT `apps/RelayiumKit/**` or the whole `Tests/Fixtures/`
      # tree: no other file in that package is an input to any Go test, and
      # either glob would start the entire eight-shard race lane on every Swift
      # edit. `swift-package.yml` owns the package; this is one file it shares.
      - 'apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json'
      # The fuzz campaign's own two files. Neither runs here — the campaign is
      # scheduled, never gating (see .github/workflows/go-fuzz-nightly.yml) —
      # but an edit to either must still start THIS workflow, because that is
      # what runs each fuzz target's `f.Add` seeds as ordinary tests and what
      # proves the module the inventory script enumerates still builds. Without
      # these two lines a change to the discovery script or to the campaign
      # lands having run no Go test at all.
      - 'scripts/list-go-fuzz-targets.sh'
      - '.github/workflows/go-fuzz-nightly.yml'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/go-race-shard.go'
      - 'scripts/test/db-rollback-harness.sh'
      # One frozen-bytes fixture, named one file at a time.
      # `server/internal/inboxmanifest/vectors_test.go` reads it directly at
      # `../../../apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json`
      # and asserts the Go manifest implementation still agrees with it, so the
      # file is an input to this suite exactly like a `.go` file is. Without
      # this line an edit to those vectors lands having never run the Go half of
      # the cross-language contract, and the failure surfaces later against an
      # innocent commit that happened to touch `server/**`.
      #
      # Deliberately NOT `apps/RelayiumKit/**` or the whole `Tests/Fixtures/`
      # tree: no other file in that package is an input to any Go test, and
      # either glob would start the entire eight-shard race lane on every Swift
      # edit. `swift-package.yml` owns the package; this is one file it shares.
      - 'apps/RelayiumKit/Tests/Fixtures/device-inbox-manifest-v3-vectors.json'
      # The fuzz campaign's own two files. Neither runs here — the campaign is
      # scheduled, never gating (see .github/workflows/go-fuzz-nightly.yml) —
      # but an edit to either must still start THIS workflow, because that is
      # what runs each fuzz target's `f.Add` seeds as ordinary tests and what
      # proves the module the inventory script enumerates still builds. Without
      # these two lines a change to the discovery script or to the campaign
      # lands having run no Go test at all.
      - 'scripts/list-go-fuzz-targets.sh'
      - '.github/workflows/go-fuzz-nightly.yml'
      - '.github/workflows/go.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# `github.ref` is the obvious fallback and is WRONG here: it puts every `main`
# run in one group, and GitHub cancels an older PENDING run in a group when a
# newer one arrives even with `cancel-in-progress: false`. Two quick merges
# would silently drop the first commit's verification, and `main` would show a
# cancelled — not failed, not missing — check for a commit nobody tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gate: everything that answers "is this code even correct" in ~3
  # minutes. Split from the race jobs on purpose — a compile break should not
  # wait behind a race detector run to be reported.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the toolchain version, same as release.yml.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain version
        run: go version
      - name: go build
        working-directory: server
        run: go build ./...
      # Catches the classes `go build` accepts and the tests may never reach:
      # Printf arg mismatches, unreachable code, lost struct tags.
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./...
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # Central runs concurrent goroutines against shared state by design — the GC
  # sweep, the metering worker, the node storage prober — and the failure mode
  # of a data race there is a corrupted ledger or a wedged deploy, found in
  # production rather than in a red build.
  #
  # ## Why this is eight jobs and not one
  #
  # It was one `go test -race -timeout 45m ./...`, measured at ~43m35s. Every
  # previous response to that lane was to raise its timeout: 10m, then 25m,
  # then 45m, under a 60m job bound. A budget that close to the measurement is
  # not a hang detector — the lane fails by expiring before it fails by finding
  # a race, and run 31616382749 did exactly that at 1500.972s with no race and
  # no failed assertion, which reads like a hang in the code rather than a
  # budget that was too small.
  #
  # `server/account` is essentially all of it: 1904 top-level tests, 714.694s
  # locally against ~2615s hosted, i.e. this runner is ~3.66x slower.
  #
  # All eight shards were measured locally on 2026-08-21, same machine as that
  # 714.694s baseline:
  #
  #     shard 0  177.9s   shard 4  123.1s
  #     shard 1  133.6s   shard 5  156.8s
  #     shard 2  172.0s   shard 6  164.3s
  #     shard 3  155.2s   shard 7  150.6s
  #
  # The slowest is 177.9s, which is 24.9% of the serial run rather than the
  # 13.4% its test COUNT would predict — the tests are not equal in cost, and
  # every shard re-pays the package's fixed setup, so the eight together use
  # ~1233s of CPU against 714.694s serial. That is the trade: ~1.7x the total
  # machine time for ~4x less wall clock on the critical path.
  #
  # Scaled by the measured 3.66x runner factor, the slowest shard projects to
  # ~651s (~10.9 min) hosted. The 20m per-package budget is therefore ~1.8x the
  # projection, and the 25m job budget leaves ~10 min on top for checkout,
  # toolchain setup, module download and the race build. Both stay finite on
  # purpose: unlike the 45m budget against a 43m35s measurement they replace,
  # exceeding either of these means a hang worth its goroutine dump rather than
  # a number to raise again.
  #
  # Sharding hides one class it cannot see: a race that only appears when two
  # tests run in the same process, or in a particular order. That is what
  # account-race-nightly.yml exists for — do not delete it as redundant.
  race-account:
    name: race account shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One shard failing must not cancel the other seven. A race is usually
      # reported by exactly one shard, and cancelling the rest would hide
      # whether the others were clean and turn a rerun into a guess.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # scripts/go-race-shard.go lists the package's top-level tests and hashes
      # each name to a shard, so all eight jobs derive the same partition from
      # the source alone with no index file to keep in sync. It proves the
      # partition on every invocation — every test in exactly one shard, the
      # union equal to the list, no shard empty — and exits non-zero otherwise,
      # so eight green jobs cannot between them have run nothing.
      #
      # Listing and running happen in ONE step so the ~11KB anchored regex never
      # has to survive a trip through GITHUB_ENV. The helper lists with -race so
      # this build populates the cache the test run immediately reuses.
      #
      # If this ever goes red intermittently, do not paper over it with a retry:
      # a flaky test here is usually a real timing assumption. The first one
      # found was a test seeding an exemption window from wall time and then
      # asserting the boundary at request time, which only held if setup
      # finished inside a second.
      - name: go test -race (account shard ${{ matrix.shard }} of 8)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          RUN_REGEX="$(go run ../scripts/go-race-shard.go -shards 8 -shard '${{ matrix.shard }}')"
          go test -race -count=1 -timeout 20m -run "$RUN_REGEX" ./account

  # Every package EXCEPT account, which the shards above cover. The list is
  # enumerated from `go list ./...` at run time rather than written out here, so
  # a new package is race-checked the moment it exists — a hand-maintained list
  # is the one that silently stops covering things.
  race-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go test -race (every package except account)
        working-directory: server
        # Named explicitly because the last line DEPENDS on word splitting, and
        # that is a bash behaviour. It is already the runner default; stating it
        # means a future default change turns into a different shell rather than
        # into one `go test` argument containing 26 newline-separated package
        # paths, which fails in a way that reads like a broken package list.
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one package is excluded, matched in full so a future
          # `account/...` subpackage is still covered here.
          PKGS="$(go list ./... | grep -v '^github.com/relayium/relayium/account$')"
          if [ -z "$PKGS" ]; then
            echo "go list produced no packages outside account" >&2
            exit 1
          fi
          echo "$PKGS"
          # Word splitting is the point: this is a package list.
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 20m $PKGS

  # The one lane that runs an OLD server binary against a NEW database.
  #
  # deploy/auto-deploy.sh rolls a failed swap back by putting the previous
  # binary in front of the file the new one already opened, migrated and wrote
  # to. Every migration test in server/account runs one binary FORWARD over an
  # old file; none of them ever hands a newer file to an older binary, so the
  # rollback direction had no coverage at all — and the failure it would find is
  # a production instance that will not start, discovered at the worst moment.
  #
  # scripts/test/db-rollback-harness.sh builds two real binaries — the commit in
  # server/ROLLBACK-FLOOR and this worktree — and drives one shared SQLite file
  # through floor -> HEAD -> floor -> HEAD over the public HTTP surface.
  #
  # server/ROLLBACK-FLOOR names the oldest STILL-SUPPORTED rollback baseline,
  # not the currently deployed commit. It is expected to sit behind production
  # and must not be advanced just because a deploy happened; see that file for
  # the three conditions an advance has to meet. For this job the consequence is
  # simply that the floor-to-HEAD gap only ever grows, which makes the exercise
  # stricter over time rather than staler.
  #
  # Isolated from `test` on purpose. It is the only job here that needs full git
  # history, it costs two server builds, and a rollback failure is a different
  # answer from a compile failure: sharing a job would make one of them wait for
  # the other and report as the other.
  #
  # 20 minutes against a measured ~7s of stage time. That is not a padded
  # estimate — nothing in the stages scales with the runner, so anything
  # approaching the budget is a hung server or a wedged database rather than a
  # slow one. The budget does have to absorb two real things beyond the stages:
  # the two server builds, and just under 6.5 minutes of deliberate waiting if
  # the harness's month-window gate lands near a UTC month boundary — its 360s
  # margin plus a 5s settle, hard-capped at 420s (the gate refuses to start
  # the stages inside the margin, because /api/me/usage answers per calendar
  # month and a straddling run would report the reset as an accounting
  # mismatch). Both fit with room to spare.
  rollback-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The floor is an ANCESTOR of HEAD, and the default depth-1 checkout
          # does not contain an ancestor's objects. Without full history the
          # harness cannot build the floor binary at all, and the reachability
          # test below has nothing to check — which is exactly why that test
          # skips elsewhere and is made strict here.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # Keyed on HEAD's go.sum only. The floor commit has its own, possibly
          # different, dependency graph, so the floor build is the one that may
          # still fetch from the module proxy. That is expected: this job is not
          # offline, and the harness does not claim to be. Integrity comes from
          # each tree's own go.sum, and GOFLAGS=-mod=readonly in the harness
          # stops either build from rewriting go.mod/go.sum to make itself
          # compile.
          cache-dependency-path: server/go.sum
      # The harness builds with GOTOOLCHAIN=local, so this is the toolchain both
      # binaries are compiled with, and a tree asking for a newer Go fails here
      # rather than silently downloading one. Recorded for the same reason as in
      # `test`.
      - name: Toolchain version
        run: go version
      # Fail on an unreadable or unreachable floor record BEFORE spending two
      # server builds on it. RELAYIUM_ROLLBACK_FLOOR_STRICT turns the
      # shallow-clone skips in server/rollback_floor_test.go into failures; this
      # is the one job with the history to make that meaningful.
      - name: rollback floor record parses and points at a real ancestor
        working-directory: server
        env:
          RELAYIUM_ROLLBACK_FLOOR_STRICT: '1'
        run: go test -count=1 -timeout 5m -run 'RollbackFloor' ./
      - name: real-binary SQLite rollback evidence
        run: scripts/test/db-rollback-harness.sh

name: swift-package
# The shared Swift package's own test lane, and the repository's ONE unfiltered
# `swift test`.
#
# ## Why this is its own workflow
#
# `apps/RelayiumKit/**` is Apple-shared source: `macos.yml` and `ios.yml` both
# compile it, and `native-web-pairing.yml` builds `LocalTransferPeer` out of it.
# Until this file existed, the unfiltered `swift test` lived in `macos.yml`'s
# `test` job, so the ONLY way to run the shared package's own suite was to start
# the macOS workflow — and the only way to start the macOS workflow on a package
# change was to put `apps/RelayiumKit/**` in its filter, which also arms the
# signing lane's `needs:` chain and the release dispatch that hangs off it.
#
# The consequence was paid on every test-only edit. Adding an XCTest case under
# `apps/RelayiumKit/Tests/` — a file no product target compiles, that no
# `xcodebuild` graph reads, and that the pairing acceptance never loads — started
# three macOS runners: this suite inside `macos.yml`, two full `xcodebuild`
# graphs plus a simulator UI smoke and three acceptance runs inside `ios.yml`,
# and a 45-minute Swift+Go+Chrome pairing acceptance. None of the three could
# observe the change, and none of them could be started independently, because
# path filters in GitHub Actions are per-WORKFLOW and never per-job.
#
# So the suite moved into a file of its own. That is what lets the three heavy
# workflows narrow their filters to the package's SOURCE — `apps/RelayiumKit/**`
# followed by `!apps/RelayiumKit/Tests/**` — while the package's tests keep
# running on every change to the package, here, on one runner.
#
# ## What this file is the sole owner of
#
# The unfiltered `swift test`. Neither Apple build lane runs a `swift test` of
# its own: `macos.yml` lost its copy when this file was created, and `ios.yml`'s
# ten hand-kept `--filter` selectors over `apps/ios` guards were retired when
# this filter gained `apps/ios/**`, because they had become a strict subset of
# this job. `contracts.yml` runs one filtered contract class and nothing else.
# `scripts/test/swift-ci-boundary-test.mjs` asserts that exactly one unfiltered
# `swift test` exists in this repository and that it is this job — zero would
# leave every Swift assertion in the package unexecuted behind a green board, and
# two would charge a paid macOS runner twice for one answer. That policy also
# owns this file's path filter, its exclusion-free shape and the ordered
# `!apps/RelayiumKit/Tests/**` entries the three heavy Apple/pairing filters
# carry; `scripts/test/ci-event-policy-test.mjs` governs the repository-wide
# properties every workflow has — triggers, concurrency, runner budgets.
#
# ## Why the filter is exactly four entries
#
#   apps/RelayiumKit/**             the package this job tests: Sources, Tests,
#                                   Fixtures, `Package.swift` and
#                                   `Package.resolved`. Deliberately NOT narrowed
#                                   to Sources — a fixture or a test file is an
#                                   input to `swift test` exactly like a source
#                                   file, and this is the workflow that has to
#                                   notice.
#   apps/mac/**                     the two app trees. This job compiles neither,
#   apps/ios/**                     and it READS both: dozens of the package's
#                                   XCTest cases are guards over a project file,
#                                   a plist, an entitlement, a privacy manifest,
#                                   a `.strings` catalog or a Swift source under
#                                   one of these roots. A file a test opens is an
#                                   input to that test exactly like a fixture is,
#                                   and until these two entries existed an
#                                   `apps/mac/**`-only change ran NONE of its
#                                   guards — `macos.yml` runs no `swift test` —
#                                   while an `apps/ios/**`-only change ran the
#                                   ten selectors `ios.yml` listed by hand out of
#                                   the thirty-odd files that read that tree. A
#                                   hand-kept selector list is what drifted; the
#                                   whole suite cannot.
#   .github/workflows/…             this file, so an edit to its own triggers
#                                   runs under them rather than landing
#                                   unverified.
#
# Nothing else. This job builds no app, signs nothing, reads no secret and
# publishes nothing. Its only upload besides the evidence certificate is the
# failure-only crash evidence below (`scripts/ci/swift-test-diagnostics.py`),
# which `scripts/test/swift-ci-boundary-test.mjs` holds to exactly three named
# steps and one exact EXIT trap on the `swift test` step. Its guards also open a few files under
# `server/`, `scripts/` and `web/`; those trees are NOT here on purpose — they
# would start the whole suite on every server and web commit — and the claims
# that matter on them belong in the Linux checks `repo-hygiene.yml` runs on
# every push (`scripts/test/document-claims-test.mjs` is the pattern).
#
# This is the ONE workflow whose filter spans two platform roots, and
# `scripts/test/ci-event-policy-test.mjs` section 6b names it as the only
# exception: the rule exists because a workflow that BUILDS one platform must be
# startable for that platform alone, and this one builds neither — the same
# suite answers for both.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    paths:
      - 'apps/RelayiumKit/**'
      - 'apps/mac/**'
      # The macOS release-readiness manifest is a release-CONTROL record, not
      # an input: no build, package test or signed artifact reads it. The
      # unfiltered repo-hygiene lane runs `test-release-readiness.sh
      # --files-only` on every change, and macos-release.yml re-checks it in
      # full, so a record-only edit needs neither Apple lane. The exclusion is
      # this one exact file and must FOLLOW `apps/mac/**` (last match wins);
      # anything else under apps/mac still starts this lane.
      - '!apps/mac/release-readiness.json'
      - 'apps/ios/**'
      # The named-execution proof this lane's `swift test` log is judged by.
      # It decides whether the forced interop classes RAN, so an edit to it is
      # an edit to this lane's verdict and must re-run the lane that executes
      # it on a real log — not only its forged-log cases in repo-hygiene.
      - 'scripts/ci/assert-swift-named-execution.mjs'
      # The crash-diagnostics helper this lane's mark, EXIT trap and failure-only
      # capture execute, and its owning fixture tests: exactly these two files,
      # so a helper-only or test-only change re-runs the lane whose steps run it
      # (the fixtures also run in repo-hygiene). Not `scripts/**`.
      - 'scripts/ci/swift-test-diagnostics.py'
      - 'scripts/test/swift-test-diagnostics-test.py'
      # The physical-device fixture isolation control this job runs, and the
      # two physical launchers whose real fixture binding it executes: exactly
      # these three files, so an edit to any of them re-runs the lane that runs
      # the control. The Swift files it compiles are already under apps/ios/**.
      # Not `scripts/**`.
      - 'scripts/test/ios-physical-fixture-isolation-test.mjs'
      - 'scripts/ios-device-pair-acceptance.sh'
      - 'scripts/ios-device-inbox-acceptance.sh'
      - '.github/workflows/swift-package.yml'
      # The PR→main evidence verifier, its registry, the filter reader it imports,
      # the adoption transform, the toolchain certificate probe and registry, and
      # their tests decide whether a main push may witness this lane instead of
      # re-running it — so a change to any of them is a change to this lane
      # (scripts/ci/ci-evidence-view.mjs).
      - 'scripts/ci/ci-evidence.mjs'
      - 'scripts/ci/ci-evidence-registry.json'
      - 'scripts/ci/select-lanes.mjs'
      - 'scripts/ci/ci-evidence-view.mjs'
      - 'scripts/test/ci-evidence-test.mjs'
      - 'scripts/ci/ci-evidence-toolchain.mjs'
      - 'scripts/ci/ci-evidence-toolchain-registry.json'
      - 'scripts/test/ci-evidence-toolchain-test.mjs'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:
  # The manual escape hatch for testing the workflow itself, matching every
  # other governed workflow. It carries no inputs: nothing here signs,
  # notarizes, publishes or consumes a build number, so there is no release
  # contract to gate.
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else. Identical to
# the rule in every other governed workflow, and asserted verbatim by
# `scripts/test/ci-event-policy-test.mjs`: group by PR NUMBER when there is one
# and by `github.run_id` — unique per run — otherwise, so a PR supersedes only
# itself and nothing can ever cancel a `main` or dispatch run.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: swift-package-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR→main evidence: a cheap read-only screen before any paid macOS/Windows
  # probe. `eligible=true` only when this main push has a source proof that a
  # current toolchain certificate could complete; it ENABLES the certify jobs
  # and approves nothing. Never red, and anything but `eligible=true` means no
  # paid probe and the full lane.
  screen:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.screen.outputs.eligible }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Could a current toolchain certificate complete a proof?
        id: screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-evidence.mjs screen swift-package >> "$GITHUB_OUTPUT"

  # PR→main evidence: the macos-15 toolchain a fresh run of this lane would get NOW,
  # resolved by copies of the lane's own selection/setup steps and certified
  # by scripts/ci/ci-evidence-toolchain.mjs. Ordinary main pushes the screen
  # found eligible only; skipped everywhere else. Bounded at 3 minutes and never
  # red: a failed, slow or unknown probe hands over no certificate, and the
  # lane then runs in full.
  certify-macos:
    needs: screen
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.screen.result == 'success' && needs.screen.outputs.eligible == 'true' }}
    runs-on: macos-15
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      certificates: ${{ steps.export.outputs.certificates }}
    steps:
      - name: Check out the probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - name: Certify this runner's toolchain now
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles macos-xcode-go --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Hand the certificates to the evidence job
        id: export
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs export --dir "$RUNNER_TEMP/ci-evidence-current" >> "$GITHUB_OUTPUT"

  # PR→main evidence reuse (scripts/ci/ci-evidence.mjs; docs/CI-PLATFORM-BOUNDARY.md).
  #
  # On an ORDINARY push to main, decides whether the merged pull request's
  # latest merge-gate run already proved this exact tree for this lane, on the
  # same toolchain this runner family offers now. Every other event — the merge
  # gate's own pull_request call, a dispatch, a release caller — skips the
  # decision, so `reuse` is empty and every job below runs its original steps
  # on its original runner. The verifier always exits 0 and any doubt is
  # `reuse=false`: a missing, partial, stale, uncertified or mismatched proof
  # means the full lane, never approval. It reads the GitHub API (hence the
  # read-only actions/pull-requests grants) and runs nothing it downloads.
  # Never red (`continue-on-error`), and nothing below depends on how it
  # ended: every original job's condition is an explicit `!cancelled()` over
  # its OWN needs, so a failed setup step, a timeout or a skipped dependency
  # here leaves `reuse` empty and the whole lane runs in full.
  # `!cancelled()`: a failed, timed-out or skipped dependency must not skip
  # this job either. It then decides `reuse=false`.
  evidence:
    needs: [screen, certify-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Promoted ONLY by the handover, after the witness was kept: a decision
    # whose upload failed or timed out, or whose retained file is missing or
    # not the decided witness, never reaches the jobs below.
    outputs:
      reuse: ${{ steps.handover.outputs.reuse }}
      witness: ${{ steps.handover.outputs.witness }}
    steps:
      - name: Check out the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Take the certify jobs' certificates (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CI_EVIDENCE_CERTIFICATES_MACOS: ${{ needs['certify-macos'].outputs.certificates }}
        run: node scripts/ci/ci-evidence-toolchain.mjs import --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Does the merged pull request's full proof cover this main tree?
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_CURRENT_TOOLCHAIN_DIR: ${{ runner.temp }}/ci-evidence-current
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/swift-package.json
        run: node scripts/ci/ci-evidence.mjs witness swift-package >> "$GITHUB_OUTPUT"
      - name: Keep the witness (reuse only)
        id: keep
        if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-witness-swift-package-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-witness
          if-no-files-found: error
          retention-days: 30
      - name: Hand the decision to the lane only once its witness is kept
        id: handover
        if: steps.verify.outputs.reuse == 'true' && steps.keep.outcome == 'success'
        env:
          CI_EVIDENCE_WITNESS: ${{ steps.verify.outputs.witness }}
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/swift-package.json
        run: node scripts/ci/ci-evidence.mjs handover >> "$GITHUB_OUTPUT"
  # (end of the PR→main evidence jobs; everything above was generated by scripts/ci/ci-evidence-view.mjs)

  # No secrets, so this runs on pull requests from forks like any other check.
  # Deliberately no job-level `if:`, no `continue-on-error:` and no retry: a
  # suite that may skip itself reports NOTHING rather than red, and a suite that
  # is re-rolled until it passes reports the run that agreed rather than the
  # code.
  swift-test:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'macos-15' }}
    # Finite, and chosen rather than inherited.
    #
    # The evidence is `macos.yml`'s `test` job, which carried this exact command
    # until it moved here: 59 successful runs took 5.5 minutes at worst and 3.5
    # on average for this `swift test` PLUS four release-script tests, so this
    # command alone is bounded above by that 5.5-minute worst case. 25 is far
    # enough above it to absorb a cold SwiftPM resolve, a fresh WebRTC/Sodium
    # binary fetch and real growth in the package, and still turns a `swift
    # test` that never exits red in minutes rather than holding a PAID macOS
    # runner for GitHub's 6-hour default.
    timeout-minutes: 25
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm swift-package
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      # The package suite contains cross-implementation classes whose other
      # half is Go (the sealed-box interop and the live CLI-sender acceptance).
      # Forcing them HERE is what makes a Swift-side change re-prove interop;
      # this is the one toolchain this file installs, and only because of that.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Toolchain versions
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          xcodebuild -version
          swift --version
          go version
      # The physical acceptance fixture is named per run and per phase, never
      # the fixed name an earlier run left in a real device's Received folder.
      # This control compiles the product's and the UI-test suites' exact
      # fixture-name source with swiftc and executes the two physical
      # launchers' own naming functions and runtime binding under bash. It
      # touches no device and no network; it runs here, before the suite's
      # crash-diagnostics window, because this is the macOS job that has
      # swiftc and already watches every file it reads.
      - name: Physical fixture isolation controls
        if: needs.evidence.outputs.reuse != 'true'
        run: node scripts/test/ios-physical-fixture-isolation-test.mjs
      # Crash diagnostics, 1 of 4: the time this job's test window opened,
      # bound to this commit, run id and attempt, with the checked-out HEAD and
      # the toolchain. Run 37175317336 kept no stack for a native SIG11 in the
      # XCTest runner — the stdout line cannot say which test was running, and
      # nothing but the log was retained. Writes one small file
      # under `$RUNNER_TEMP` and always exits 0; `continue-on-error` and its own
      # one-minute bound mean a diagnostics failure changes nothing about the
      # suite below or its verdict.
      - name: Mark the swift test window for crash diagnostics
        if: needs.evidence.outputs.reuse != 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          SWIFT_DIAG_SHA: ${{ github.sha }}
          SWIFT_DIAG_RUN_ID: ${{ github.run_id }}
          SWIFT_DIAG_ATTEMPT: ${{ github.run_attempt }}
        run: /usr/bin/python3 scripts/ci/swift-test-diagnostics.py mark --runner-temp "$RUNNER_TEMP" --head "$SWIFT_DIAG_SHA" --run-id "$SWIFT_DIAG_RUN_ID" --attempt "$SWIFT_DIAG_ATTEMPT"
      # The whole package suite, with no `--filter`. This is the repository's
      # only unfiltered `swift test`; see the header. RELAYIUM_SWIFT_INTEROP=1
      # makes every Go-interop case a FAILURE rather than a skip when its
      # prerequisites are missing.
      #
      # The EXIT trap is crash diagnostics, 2 of 4: it records the IMMUTABLE
      # moment this pipeline ended, so a crash report captured later can be
      # bound to the test window and a crash during the diagnostics cannot.
      # An EXIT trap's last command WOULD replace the script's status (a failed
      # or timed-out finish turned an exit 7 into 9 or 142 in the fixture
      # tests), so the trap saves `$?` first, turns off errexit for its own
      # command and re-exits with exactly that status. The helper bounds itself
      # to 5 s and `perl`'s alarm bounds the trap's command to 10 s.
      - name: swift test
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: apps/RelayiumKit
        shell: bash
        env:
          RELAYIUM_SWIFT_INTEROP: '1'
          SWIFT_DIAG_SHA: ${{ github.sha }}
          SWIFT_DIAG_RUN_ID: ${{ github.run_id }}
          SWIFT_DIAG_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          trap 'rc=$?; set +e; /usr/bin/perl -e "alarm shift; exec @ARGV" 10 /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/ci/swift-test-diagnostics.py" finish --runner-temp "$RUNNER_TEMP" --head "$SWIFT_DIAG_SHA" --run-id "$SWIFT_DIAG_RUN_ID" --attempt "$SWIFT_DIAG_ATTEMPT"; exit "$rc"' EXIT
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: Named-execution proof
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          node scripts/ci/assert-swift-named-execution.mjs "$RUNNER_TEMP/swift-test.log" \
            InboxCLISenderLiveInteropTests/testLiveCLISendIsCommittedByTheNativeEngineAndTheCLIReadsSaved \
            InboxCLISenderLiveInteropTests/testCorruptedFinalFrameTagCommitsNothingAndTheCLIDoesNotReadSaved \
            InboxCLISenderLiveInteropTests/testAHelperThatExitsBeforeReadyFailsBoundedAndIsCleanedUp \
            InboxCLISenderLiveInteropTests/testAHelperStuckBeforeReadyIsKilledReapedAndCleanedUp \
            InboxCLISenderLiveInteropTests/testAHungCentralRequestIsTornDownByTheDeadline \
            InboxSealedBoxInteropTests/testTheGoSenderSealsAKeyThisReceiverOpensAndEveryNearMissFails \
            InboxSealedBoxInteropTests/testTheGoPhaseFailsOnAKeyCentralWouldRefuse \
            InboxSealedBoxInteropTests/testTheSwiftSenderSealsAKeyTheGoReceiverOpens \
            InboxSealedBoxInteropTests/testTheGoOpenPhaseFailsOnATamperedBoxAndOnTheWrongTarget \
            InboxFinalizeRecoveryLiveTests/testLiveALostFinalizeAnswerIsRecoveredWithoutASecondObject \
            InboxFinalizeRecoveryLiveTests/testLiveEveryAnswerLostEndsUnknownAndRetryRecoversOnce \
            InboxFinalizeRecoveryLiveTests/testLiveProcessKilledAfterCentralCommittedRecoversOnce \
            InboxFinalizeRecoveryLiveTests/testLivePreRecoveryServerStaysUnknownThroughRecordPurgeAndNeverReuploads \
            InboxFinalizeRecoveryLiveTests/testLiveAnExpiredObjectIsTerminalAndNothingIsSentAgain \
            InboxFinalizeRecoveryLiveTests/testLiveARemovedObjectIsTerminal \
            InboxFinalizeRecoveryLiveTests/testLiveAFinalizeThatNeverArrivedThenReapedStaysUnknownAndIsNeverReuploaded \
            InboxFinalizeRecoveryLiveTests/testLiveAnUnresolvedReapedSessionIsTerminalFailedAndNotReuploaded \
            InboxFinalizeRecoveryLiveTests/testLiveCancelledWhileCentralHoldsTheCommittedAnswerRecoversOnce \
            InboxFinalizeRecoveryLiveTests/testLivePhaseAndObjectRecordWriteFailuresNeverCauseASecondUpload \
            InboxFinalizeRecoveryLiveTests/testLiveAForeignAccountsBearerUploadsNothingOnEitherAccount \
            InboxFinalizeRecoveryLiveTests/testLiveAnEarlierBuildsLostFinalizeIsAdoptedAndRecoveredNotReuploaded \
            InboxFinalizeRecoveryLiveTests/testLiveAnEarlierBuildsSessionWhoseRecordIsGoneStaysUnknownNeverReuploaded \
            InboxFinalizeRecoveryLiveTests/testLiveAnEarlierFinalizeCommittingDuringAnUnprovenContinuationIsRecoveredNeverReinit \
            InboxFinalizeRecoveryLiveTests/testLiveAnEarlierFinalizeWinningTheRaceWithTheSendersFinalizeIsRecovered \
            InboxFinalizeRecoveryLiveTests/testLiveMixedAndAllEmptyManifestsAreUploadedAndCountedOnce \
            InboxFinalizeRecoveryLiveTests/testLiveTwoConcurrentDeliveriesEachUploadOnceWhenOneAnswerIsLost \
            InboxFinalizeRecoveryLiveTests/testLiveTheShareUploadStillSendsAPlainFinalize
      # Crash diagnostics, 3 and 4 of 4, ONLY after this job has already failed
      # — a green run skips both and pays nothing, and neither can turn a red
      # run green: the failure above is the verdict. The helper (one 60-second
      # budget, a watchdog, and this step's 2-minute bound) copies the original
      # `swift-test.log`, reads the Mach-O UUID of the test bundle this job
      # built with the fixed `/usr/bin/dwarfdump`, and keeps a SANITIZED stack
      # only from an `xctest`/`swiftpm-testing-helper` crash report captured
      # inside the window between the mark and the recorded test end that
      # lists that UUID. No report is
      # `UNAVAILABLE`, never a cause. No build, no test, no debugger.
      - name: Capture crash evidence after a failed swift test
        if: failure() && needs.evidence.outputs.reuse != 'true'
        timeout-minutes: 2
        env:
          SWIFT_DIAG_SHA: ${{ github.sha }}
          SWIFT_DIAG_RUN_ID: ${{ github.run_id }}
          SWIFT_DIAG_ATTEMPT: ${{ github.run_attempt }}
        run: /usr/bin/python3 scripts/ci/swift-test-diagnostics.py capture --runner-temp "$RUNNER_TEMP" --home "$HOME" --head "$SWIFT_DIAG_SHA" --run-id "$SWIFT_DIAG_RUN_ID" --attempt "$SWIFT_DIAG_ATTEMPT"
      - name: Upload crash evidence after a failed swift test
        if: failure() && needs.evidence.outputs.reuse != 'true'
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-swift-test-diagnostics-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-test-diagnostics/capture
          if-no-files-found: warn
          retention-days: 7
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile macos-xcode-go --lane swift-package --job swift-test --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-swift-package-swift-test-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

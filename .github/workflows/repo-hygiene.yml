name: repo-hygiene
on:
  push:
  pull_request:

jobs:
  no-production-identifiers:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (with the human-readable
      # version in a trailing comment) so a compromised or retagged upstream release
      # can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # scripts/check-production-identifiers.sh guards against production
      # infrastructure detail (real IPs, production server paths, internal
      # node hostnames) leaking into this public repo. See the header comment
      # in that script for the full rationale and the reasoning behind its
      # allowlists — do not delete this step because it "looks like noise."
      - name: Check for production identifiers
        run: scripts/check-production-identifiers.sh

  uninstall-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # web/public/uninstall-node.sh deletes files on a stranger's machine, and
      # every bug ever found in it ended the same way: blobs rm -rf'd, exit 0,
      # "uninstalled." The suite asserts which files SURVIVED, not just the exit
      # status. Pure POSIX sh with stubbed systemctl/curl — no node required.
      - name: uninstall-node.sh decision matrix
        run: sh scripts/test/uninstall-node-test.sh

  install-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # web/public/install-node.sh decides what privileges a relay node has on
      # its host, and the properties that keep the unprivileged node service
      # unable to install anything live entirely in generated systemd units —
      # which unit a node-writable file may trigger, who owns the runtime
      # directory, and the absence of any write path to the binary. None of that
      # is reachable from Go tests. Pure POSIX sh with stubbed
      # id/systemctl/useradd and a file:// release — no root, no network.
      - name: install-node.sh unit generation
        run: sh scripts/test/install-node-test.sh

  macos-publish-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # The macOS publish job creates an IMMUTABLE GitHub Release, so every check
      # that can still say "no" has to run before it. Both releases published so
      # far had that backwards and ended with a permanent release and no metadata
      # behind it — run 31931451292 most recently.
      #
      # Step order is invisible to every other check here: the YAML is valid
      # either way and actionlint is happy either way, so without this the only
      # signal would be a third unrecoverable release. It lives in repo-hygiene
      # rather than in the web suite because it guards `.github/workflows/`,
      # which no path filter in `web.yml` covers, and this workflow runs on every
      # push. No dependencies, so there is nothing to install.
      - name: macos publish job orders validation before the immutable release
        run: node scripts/test/macos-publish-order-test.mjs

  server-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # scripts/release/server-tag.sh decides which tag auto-release.yml treats
      # as the last server release, and therefore what it diffs, counts and
      # publishes. It replaced a `git describe --tags` that returned the newest
      # tag of ANY family: with the macOS app tagged ahead of the server, that
      # produced the tag `vmacos-v1.2.0` and a release run that failed in
      # GoReleaser. The suite reconstructs that exact repository shape.
      #
      # The same script also gates release.yml — which refs it will build and
      # sign — so the suite covers both ends: what may be tagged, and what may
      # be released.
      - name: server-tag.sh selection, version arithmetic and release gate
        run: sh scripts/test/server-tag-test.sh

name: repo-hygiene
on:
  push:
    # Only `main`. This workflow has no path filter, so a branch push ran it
    # for every commit and its pull request ran it again for the same tree.
    # The pull_request trigger below is what gates branch work; this one
    # exists so `main` itself is never unverified.
    branches:
      - main
  pull_request:

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# `github.ref` is the obvious fallback and is WRONG here: it puts every `main`
# run in one group, and GitHub cancels an older PENDING run in a group when a
# newer one arrives even with `cancel-in-progress: false`. Two quick merges
# would silently drop the first commit's verification, and the branch would show
# a cancelled — not failed, not missing — check for a commit nobody tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  no-production-identifiers:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (with the human-readable
      # version in a trailing comment) so a compromised or retagged upstream release
      # can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # scripts/check-production-identifiers.sh guards against production
      # infrastructure detail (real IPs, production server paths, internal
      # node hostnames) leaking into this public repo. See the header comment
      # in that script for the full rationale and the reasoning behind its
      # allowlists — do not delete this step because it "looks like noise."
      - name: Check for production identifiers
        run: scripts/check-production-identifiers.sh

  uninstall-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # web/public/uninstall-node.sh deletes files on a stranger's machine, and
      # every bug ever found in it ended the same way: blobs rm -rf'd, exit 0,
      # "uninstalled." The suite asserts which files SURVIVED, not just the exit
      # status. Pure POSIX sh with stubbed systemctl/curl — no node required.
      - name: uninstall-node.sh decision matrix
        run: sh scripts/test/uninstall-node-test.sh

  install-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # web/public/install-node.sh decides what privileges a relay node has on
      # its host, and the properties that keep the unprivileged node service
      # unable to install anything live entirely in generated systemd units —
      # which unit a node-writable file may trigger, who owns the runtime
      # directory, and the absence of any write path to the binary. None of that
      # is reachable from Go tests. Pure POSIX sh with stubbed
      # id/systemctl/useradd and a file:// release — no root, no network.
      - name: install-node.sh unit generation
        run: sh scripts/test/install-node-test.sh

  macos-publish-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # The macOS publish job creates an IMMUTABLE GitHub Release, so every check
      # that can still say "no" has to run before it. Both releases published so
      # far had that backwards and ended with a permanent release and no metadata
      # behind it — run 31931451292 most recently.
      #
      # Step order is invisible to every other check here: the YAML is valid
      # either way and actionlint is happy either way, so without this the only
      # signal would be a third unrecoverable release. It lives in repo-hygiene
      # rather than in the web suite because it guards `.github/workflows/`,
      # which no path filter in `web.yml` covers, and this workflow has no path
      # filter of its own, so it runs on every pull request and every `main`
      # push. No dependencies, so there is nothing to install.
      - name: macos publish job orders validation before the immutable release
        run: node scripts/test/macos-publish-order-test.mjs

  native-web-pairing-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Two delivery gates that nothing else in this repository can see.
      #
      # `native-web-pairing.yml` runs the ONLY test that can catch two capable
      # peers disagreeing about each other — a real macOS client and a real
      # browser, no doubles on either side — and `web/scripts/check-wire-vectors.mjs`
      # is the ONLY thing that notices when the generated Swift wire vectors stop
      # matching the Web implementation they were transcribed from.
      #
      # Both are invisible to every other check: the YAML stays valid with the
      # acceptance step deleted, with `web/**` dropped from its path filter, with
      # `continue-on-error: true` added, or with the two steps swapped. The next
      # signal after any of those would be another cross-client regression
      # reaching a user. So it is asserted here, where there is no path filter,
      # so every pull request and every `main` push runs it — the same reason
      # macos-publish-order lives here. No dependencies, so there is nothing to
      # install.
      - name: native/web pairing acceptance and wire-vector gates are wired
        run: node scripts/test/native-web-pairing-gate-test.mjs

  ci-event-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Which events start a workflow, and which runs may cancel which, are
      # invisible to every other check in this repository. The YAML stays valid
      # when `push` loses its `branches: [main]` filter — and every workflow
      # then runs twice per commit on a branch with an open pull request, both
      # green. It stays valid when the concurrency group moves back to
      # `github.ref`, which lets a second merge cancel the first commit's
      # PENDING verification even with cancel-in-progress false, leaving `main`
      # showing a cancelled check for code nobody tested.
      #
      # The same file also holds the race lane's shape: the eight-way account
      # shard matrix, the separate non-account job, no retries, and the nightly
      # serial lane staying non-gating. Delete the matrix and one shard's tests
      # silently stop being race-checked; give the nightly a pull_request
      # trigger and the ~44 minute lane the split replaced is a gate again.
      #
      # It lives here for the same reason as macos-publish-order: this workflow
      # has no path filter, so it runs on every pull request and every `main`
      # push. No dependencies, so there is nothing to install.
      - name: workflow trigger, concurrency and race-lane policy
        run: node scripts/test/ci-event-policy-test.mjs

  swift-ci-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Who owns `apps/RelayiumKit/`, and what a change inside it costs.
      #
      # The shared Swift package is one directory and three kinds of input:
      # source both apps compile, a test target nothing else compiles, and
      # fixtures that Go and TypeScript tests read. Path filters in GitHub
      # Actions are per-WORKFLOW, so while the only unfiltered `swift test`
      # lived in `macos.yml`, one added XCTest case started two xcodebuild
      # graphs, a simulator UI smoke, three acceptance runs and a 45-minute
      # pairing runner — none of which could observe it.
      #
      # `swift-package.yml` now owns that suite and the three heavy filters
      # follow `apps/RelayiumKit/**` with `!apps/RelayiumKit/Tests/**`. Every
      # way of undoing that leaves the YAML valid and actionlint happy: delete
      # the exclusion, narrow it, widen it until the package's own source stops
      # triggering, move it ONE LINE UP where the pattern it qualifies
      # overrides it, or add a positive glob below it. So the filters are
      # compiled and evaluated the way GitHub does — ordered, last match wins —
      # against real package paths, in both directions.
      #
      # It lives here for the same reason as macos-publish-order: this workflow
      # has no path filter, so every pull request and every `main` push runs
      # it — which is also what makes an edit to the policy itself, or to any
      # of the six workflows it judges, produce its own hosted evidence instead
      # of landing behind a filter that does not name it. No dependencies, so
      # there is nothing to install.
      - name: shared Swift package CI ownership boundary
        run: node scripts/test/swift-ci-boundary-test.mjs

  contract-ci-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # Who owns `contracts/`, and what a document edit is allowed to start.
      #
      # `contracts/device-inbox-admission-v1.json` is read by two Go test
      # functions, one Vitest file and one XCTest class. Naming it in those
      # three suites' own path filters — the rule this repository already
      # applies to the frozen manifest vectors — would have started go.yml's
      # eight-shard race lane, web.yml's full Vite suite with an accessibility
      # scan and three headless-Chrome journeys, and would have widened
      # swift-package.yml past the two entries that make it the one workflow
      # guaranteed to see every file in the package. So the tree got
      # `contracts.yml`, running the three smallest commands that judge the
      # three implementations.
      #
      # That decision has two halves and both decay silently. A contract edit
      # must start the cheap lane and no heavy one; an ordinary Go, Web or
      # Swift change must still start its own suite AND that suite must still
      # execute the consumer test. Every way of breaking either leaves the YAML
      # valid and actionlint happy, so the filters are compiled and evaluated
      # the way GitHub does — ordered, last match wins — and the consuming
      # sources are read to prove they still open the document.
      #
      # It lives here for the same reason as swift-ci-boundary: this workflow
      # has no path filter, which is the only place a rule about which
      # workflows a contract edit starts can be checked on a commit that starts
      # none of them. No dependencies, so there is nothing to install.
      - name: root contract tree CI ownership and cost boundary
        run: node scripts/test/contract-ci-policy-test.mjs

  go-race-shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # go.yml runs `server/account` as eight `-run`-filtered jobs. Nothing in
      # that arrangement can notice a test assigned to NO shard: all eight go
      # green and the test has simply stopped being race-checked. The suite
      # proves the partition over the recorded 1904-name corpus — union equal to
      # the corpus, all 28 shard pairs disjoint, every name exactly once — pins
      # the shard hash by value, and checks the emitted `-run` regex is anchored
      # on both ends so `^TestUser` cannot also drag TestUserDelete into a second
      # shard.
      #
      # It never builds ./account (the corpus is a checked-in snapshot), so it
      # belongs in this always-on lane rather than behind go.yml's path filter.
      # The live list is re-proved on every shard job by the helper itself.
      - name: account race shard assignment is a partition
        run: sh scripts/test/go-race-shard-test.sh

  server-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # scripts/release/server-tag.sh decides which tag auto-release.yml treats
      # as the last server release, and therefore what it diffs, counts and
      # publishes. It replaced a `git describe --tags` that returned the newest
      # tag of ANY family: with the macOS app tagged ahead of the server, that
      # produced the tag `vmacos-v1.2.0` and a release run that failed in
      # GoReleaser. The suite reconstructs that exact repository shape.
      #
      # The same script also gates release.yml — which refs it will build and
      # sign — so the suite covers both ends: what may be tagged, and what may
      # be released.
      - name: server-tag.sh selection, version arithmetic and release gate
        run: sh scripts/test/server-tag-test.sh

  macos-ui-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # scripts/macos-ui-session-acceptance.sh starts one pairing counterpart
      # per LocalSessionUITests method and then independently asks each one
      # whether it really served a link/1 session. It used to ask ALL of them
      # regardless of which tests the caller had selected, so a single-method
      # run passed xcodebuild and then failed against the peer nothing had
      # contacted. scripts/lib/macos-ui-test-selection.sh is the mapping from
      # selectors to required counterparts, and getting it wrong in the other
      # direction — verifying nothing while still printing the full PASS — is
      # the more expensive mistake. Pure sh over an argument list: the macOS
      # run itself needs a signed build and three peers and cannot run here.
      - name: macOS UI acceptance selector mapping
        run: sh scripts/test/macos-ui-selection-test.sh

  dependency-pinning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # How SPECIFIC a dependency reference is, is invisible to every other check
      # here. `actions/checkout@v6` is valid YAML, actionlint accepts it, and
      # every job stays green while upstream keeps the right to repoint that tag
      # at a different commit — including the jobs that sign the CLI, notarize
      # the macOS app and create an immutable GitHub Release. The same is true of
      # `from:` on the crypto package the entire end-to-end promise rests on, of
      # a Package.resolved that says one thing on macOS and another on iOS, and
      # of a lockfile entry that quietly starts resolving from somebody else's
      # host.
      #
      # The rules are not all the same strength, and the script says so rather
      # than flattening them into one claim. A 40-hex `uses:` pin and a
      # Package.resolved `revision` name an immutable object. `exact: "0.11.0"`
      # is a fixed version CONSTRAINT — the resolver cannot pick another release,
      # but the tag behind it lives upstream. `node-version: 24` is a mutable
      # major SELECTOR, and rule 4 only requires that every lane name the SAME
      # major, so no lane silently tests a runtime no other lane does.
      #
      # This gate is deterministic and offline: it reads the tracked files and
      # compares references to themselves and to each other. It does not reach a
      # vulnerability database — `govulncheck` (go.yml) and `npm audit`
      # (web.yml) do that today, per pull request and blocking. It also does not
      # prove a build CONSUMED these files unchanged; nothing here yet passes
      # `-onlyUsePackageVersionsFromResolvedFile`. docs/DEPENDENCY-POLICY.md
      # records both, and being behind latest is never a failure here.
      #
      # It lives in repo-hygiene for the same reason as macos-publish-order: this
      # workflow has no path filter, so it runs on every pull request and every
      # `main` push, and its subjects (`.github/workflows/`, `apps/**`, `web/`)
      # are covered by no single other lane. The suite also mutates an in-memory
      # copy of the repository on every run to prove each rule can still fail; no
      # dependencies, so there is nothing to install.
      - name: dependency references are pinned and internally consistent
        run: node scripts/test/dependency-pinning-test.mjs

  dependabot-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # `.github/dependabot.yml` is the only file here that grants a robot the
      # right to CHANGE the references `dependency-pinning` insists are precise.
      # Nothing else in this repository can see it widen. The YAML stays valid,
      # GitHub keeps accepting it, and every job stays green when an `ignore:`
      # block appears — majors then stop opening pull requests entirely and the
      # queue looks healthier than it is — or when `github-actions` or `swift` is
      # added, both of which docs/DEPENDENCY-POLICY.md deliberately leaves
      # unconfigured (deferred items 1 and 5: the `upload-artifact` major
      # divergence must not be "resolved" by a bot, and Swift bumps mean nothing
      # without the vector tests and a real build the paused iOS lane cannot
      # supply). The same is true of the cap growing, the two ecosystems drifting
      # onto one weekday, a group widening to swallow majors, and of
      # `target-branch`, `reviewers`, `registries` or
      # `insecure-external-code-execution` appearing.
      #
      # The script is offline and reads one tracked file. It has no YAML
      # dependency for the same reason as the jobs above — `web/` is the only
      # Node project here and this must run with nothing installed — so it
      # carries a narrow parser that DIAGNOSES tabs, odd indentation, duplicate
      # keys, unknown keys and missing keys rather than skipping what it cannot
      # read. It also mutates an in-memory copy on every run, one mutation per
      # rule class, to prove each rule can still fail.
      #
      # It lives in repo-hygiene for the same reason as macos-publish-order:
      # this workflow has no path filter, so it runs on every pull request and
      # every `main` push, and `.github/dependabot.yml` is covered by no other
      # lane. What it cannot check is whether Dependabot is ENABLED, whether
      # security alerts are on, or whether anything is a required check — those
      # are live repository settings, not tree state.
      - name: Dependabot update automation stays bounded and reviewable
        run: node scripts/test/dependabot-policy-test.mjs

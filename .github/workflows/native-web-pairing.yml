name: native-web-pairing
# The ONE hosted job where the macOS native client and a real browser have to
# agree with each other.
#
# ## Why this is its own workflow rather than a job in macos.yml
#
# `scripts/native-web-pairing-acceptance.sh` needs all four of a macOS runner
# (the Swift `LocalTransferPeer` is the app's own `LinkWorkspaceModel` assembled
# by `AppEnvironment`), a Go toolchain (a real `./server` on an ephemeral
# loopback port), Node plus the built Web bundle, and a real headless Chrome.
# Only a macOS runner can host it.
#
# It cannot live in `macos.yml`, because path filters in GitHub Actions are
# per-WORKFLOW and not per-job. This run's inputs include `web/**` and
# `server/**`; adding those to `macos.yml` would also start `signed-build` —
# which imports the Developer ID certificate, builds and signs the app and can
# be dispatched into notarization and an immutable release — on every web copy
# change. `macos.yml`'s own header states the opposite intent ("the path filter
# keeps a web or server commit from starting a macOS runner"), and widening it
# is exactly the expensive duplicate run that must not happen here.
#
# So the acceptance has one home, and this file is it. Nothing else in the
# repository invokes that script; `scripts/test/native-web-pairing-gate-test.mjs`
# runs on every push (via `repo-hygiene.yml`) and fails if that stops being true
# or if this file's path filter stops covering an owning tree.
#
# ## Why the wire-vector gate is NOT here any more
#
# `npm run test:vectors` used to be this job's first step. It judges the same
# cross-language contract from the frozen-bytes side, it takes seconds, and it
# needs nothing but a checkout and Node — so hosting it here made it wait behind
# a macOS runner, a Go toolchain, an `npm ci` and a Chrome install, and, worse,
# put it BEHIND this workflow's path filter. A contract check that only runs
# when one platform's trees change is a contract check a second platform can
# bypass by existing. It now lives in `compat.yml`, which has no path filter at
# all and therefore runs on every change. See `docs/CI-PLATFORM-BOUNDARY.md`.
#
# ## Why the path filter is exactly this list
#
# Every tree named below is a real INPUT to the run — something this job reads,
# compiles or serves — and not merely a neighbour of one:
#
#   apps/RelayiumKit/**  the native half that is actually compiled. The
#                        acceptance runs `swift build --product
#                        LocalTransferPeer` against this package, and the peer
#                        binary, the link workspace and the `AppEnvironment`
#                        that assembles it all live inside it
#                        …minus `!apps/RelayiumKit/Tests/**`, which follows it.
#                        `swift build` builds PRODUCTS; it does not compile the
#                        package's test target, and this run loads no fixture
#                        from it. A test-only edit therefore started a
#                        45-minute Swift+Go+Chrome macOS runner that could not
#                        observe the change — the same non-input cost
#                        `apps/mac/**` is excluded for below, one directory in.
#
#                        The FIXTURES are deliberately NOT re-included after
#                        that negation. `apps/RelayiumKit/Tests/Fixtures/` is
#                        frozen-bytes input to the Swift, Go and Web vector
#                        suites; this acceptance reads none of them. It mints a
#                        live pairing code against a real server and drives two
#                        live peers, so a fixture edit cannot change its
#                        outcome. The workflows that DO consume those bytes name
#                        the exact files: `swift-package.yml` (the whole
#                        package), `go.yml` and `web.yml` (one fixture path per
#                        consuming test), and `compat.yml` unfiltered.
#
#                        A MIXED diff — package source plus package tests in one
#                        commit — still starts this workflow: the source file is
#                        still a positive match and one match is enough.
#   web/**               the bundle the browser half loads, and the e2e harness
#                        and driver it is driven through
#   server/**            the real hub: /api/pair, the pairing room, the ws join
#                        budget the script paces itself against
#   scripts/...          the acceptance itself and the shared isolation library
#                        it sources, named ONE FILE AT A TIME
#
# The 1.2.5 regression this exists to catch — two capable peers reaching
# different conclusions about what the other could speak — was authored on one
# side of that list and observed on the other. A filter that named only the
# native tree would have let its own fix's counterpart land unwatched.
#
# What is deliberately GONE, and why:
#
#   apps/mac/** the shipped macOS app is what this acceptance SPEAKS FOR, and it
#               is still not an input to it. `scripts/native-web-pairing-
#               acceptance.sh` builds exactly two trees — `server` and
#               `apps/RelayiumKit` — and serves the Web bundle; no file under
#               `apps/mac/` is read, compiled or served by the run. The app
#               target holds SwiftUI views over `RelayiumAppKit`, and that
#               package is inside `apps/RelayiumKit/**`, which IS watched — so
#               the logic this acceptance exercises still triggers it. An
#               apps/mac-only change therefore starts `macos.yml`, plus the
#               always-on `compat.yml` and `repo-hygiene.yml`, and not a
#               45-minute pairing runner that would rebuild nothing it touched.
#   apps/**     matched `apps/ios/**`, so an iOS-only change started a
#               45-minute macOS pairing runner that builds nothing it touched —
#               and it matched `apps/README.md`, which is an input to nothing.
#               It would also have silently adopted a future `apps/android/**`
#               or `apps/windows/**` root the day it appeared.
#   scripts/**  matched every Go, release and iOS script in the repository, and
#               would likewise adopt a future Android or Windows script into
#               this macOS runner. The two files this run actually sources are
#               named instead.
#
# `scripts/test/ci-event-policy-test.mjs` asserts all of that as BEHAVIOUR — it
# compiles these globs and checks which files they match — because every one of
# those widenings leaves the YAML valid and actionlint happy. The
# `!apps/RelayiumKit/Tests/**` entry below, its ordering and the fixtures that
# must NOT be re-included under it belong to
# `scripts/test/swift-ci-boundary-test.mjs`, which judges the same question for
# all three heavy Apple/pairing filters at once.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # ORDER IS LOAD-BEARING: GitHub applies these per file, in order, and the
    # LAST match decides. The negation must follow `apps/RelayiumKit/**`, and
    # nothing may re-include a subtree of it below.
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    paths:
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      - 'web/**'
      - 'server/**'
      - 'scripts/native-web-pairing-acceptance.sh'
      - 'scripts/lib/local-acceptance.sh'
      # A12: the CLI peer cells this workflow also hosts (`cli-web`, and the
      # CLI ↔ macOS step in `pairing`), named one file at a time for the same
      # reason as the two above. The CLI itself is under `server/**` and the
      # browser driver under `web/**`, both already watched.
      - 'scripts/interop/cli-web-acceptance.sh'
      - 'scripts/interop/cli-web-oracle.py'
      - 'scripts/interop/cli-mac-acceptance.sh'
      - 'scripts/interop/cli-mac-peer.mjs'
      - 'scripts/interop/cli-mac-oracle.py'
      - 'scripts/interop/cli-matrix-plan.py'
      - 'scripts/interop/cli-process.mjs'
      - '.github/workflows/native-web-pairing.yml'
      # The PR→main evidence verifier, its registry, the filter reader it imports,
      # the adoption transform, the toolchain certificate probe and registry, and
      # their tests decide whether a main push may witness this lane instead of
      # re-running it — so a change to any of them is a change to this lane
      # (scripts/ci/ci-evidence-view.mjs).
      - 'scripts/ci/ci-evidence.mjs'
      - 'scripts/ci/ci-evidence-registry.json'
      - 'scripts/ci/select-lanes.mjs'
      - 'scripts/ci/ci-evidence-view.mjs'
      - 'scripts/test/ci-evidence-test.mjs'
      - 'scripts/ci/ci-evidence-toolchain.mjs'
      - 'scripts/ci/ci-evidence-toolchain-registry.json'
      - 'scripts/test/ci-evidence-toolchain-test.mjs'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:
  workflow_dispatch:

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# `github.ref` is the obvious fallback and is WRONG here: it puts every `main`
# run in one group, and GitHub cancels an older PENDING run in a group when a
# newer one arrives even with `cancel-in-progress: false`. Two quick merges
# would silently drop the first commit's verification, and the branch would show
# a cancelled — not failed, not missing — check for a commit nobody tested.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: native-web-pairing-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR→main evidence: a cheap read-only screen before any paid macOS/Windows
  # probe. `eligible=true` only when this main push has a source proof that a
  # current toolchain certificate could complete; it ENABLES the certify jobs
  # and approves nothing. Never red, and anything but `eligible=true` means no
  # paid probe and the full lane.
  screen:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.screen.outputs.eligible }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Could a current toolchain certificate complete a proof?
        id: screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-evidence.mjs screen native-web-pairing >> "$GITHUB_OUTPUT"

  # PR→main evidence: the macos-15 toolchain a fresh run of this lane would get NOW,
  # resolved by copies of the lane's own selection/setup steps and certified
  # by scripts/ci/ci-evidence-toolchain.mjs. Ordinary main pushes the screen
  # found eligible only; skipped everywhere else. Bounded at 3 minutes and never
  # red: a failed, slow or unknown probe hands over no certificate, and the
  # lane then runs in full.
  certify-macos:
    needs: screen
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.screen.result == 'success' && needs.screen.outputs.eligible == 'true' }}
    runs-on: macos-15
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      certificates: ${{ steps.export.outputs.certificates }}
    steps:
      - name: Check out the probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - name: Certify this runner's toolchain now
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles macos-xcode-node-go-chrome --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Hand the certificates to the evidence job
        id: export
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs export --dir "$RUNNER_TEMP/ci-evidence-current" >> "$GITHUB_OUTPUT"

  # PR→main evidence reuse (scripts/ci/ci-evidence.mjs; docs/CI-PLATFORM-BOUNDARY.md).
  #
  # On an ORDINARY push to main, decides whether the merged pull request's
  # latest merge-gate run already proved this exact tree for this lane, on the
  # same toolchain this runner family offers now. Every other event — the merge
  # gate's own pull_request call, a dispatch, a release caller — skips the
  # decision, so `reuse` is empty and every job below runs its original steps
  # on its original runner. The verifier always exits 0 and any doubt is
  # `reuse=false`: a missing, partial, stale, uncertified or mismatched proof
  # means the full lane, never approval. It reads the GitHub API (hence the
  # read-only actions/pull-requests grants) and runs nothing it downloads.
  # Never red (`continue-on-error`), and nothing below depends on how it
  # ended: every original job's condition is an explicit `!cancelled()` over
  # its OWN needs, so a failed setup step, a timeout or a skipped dependency
  # here leaves `reuse` empty and the whole lane runs in full.
  # `!cancelled()`: a failed, timed-out or skipped dependency must not skip
  # this job either. It then decides `reuse=false`.
  evidence:
    needs: [screen, certify-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Promoted ONLY by the handover, after the witness was kept: a decision
    # whose upload failed or timed out, or whose retained file is missing or
    # not the decided witness, never reaches the jobs below.
    outputs:
      reuse: ${{ steps.handover.outputs.reuse }}
      witness: ${{ steps.handover.outputs.witness }}
    steps:
      - name: Check out the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          go-version-file: server/go.mod
      - name: Certify this runner's toolchain now (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles linux-node-go-chrome --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Take the certify jobs' certificates (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CI_EVIDENCE_CERTIFICATES_MACOS: ${{ needs['certify-macos'].outputs.certificates }}
        run: node scripts/ci/ci-evidence-toolchain.mjs import --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Does the merged pull request's full proof cover this main tree?
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_CURRENT_TOOLCHAIN_DIR: ${{ runner.temp }}/ci-evidence-current
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/native-web-pairing.json
        run: node scripts/ci/ci-evidence.mjs witness native-web-pairing >> "$GITHUB_OUTPUT"
      - name: Keep the witness (reuse only)
        id: keep
        if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-witness-native-web-pairing-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-witness
          if-no-files-found: error
          retention-days: 30
      - name: Hand the decision to the lane only once its witness is kept
        id: handover
        if: steps.verify.outputs.reuse == 'true' && steps.keep.outcome == 'success'
        env:
          CI_EVIDENCE_WITNESS: ${{ steps.verify.outputs.witness }}
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/native-web-pairing.json
        run: node scripts/ci/ci-evidence.mjs handover >> "$GITHUB_OUTPUT"
  # (end of the PR→main evidence jobs; everything above was generated by scripts/ci/ci-evidence-view.mjs)

  # No secrets are read here, so this runs on fork pull requests like any other
  # check. Deliberately no `if:` and no `continue-on-error`: a cross-client
  # acceptance that is allowed to skip or to be advisory is not a gate, and the
  # guard test asserts their absence.
  pairing:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'macos-15' }}
    # Worst case is ten rounds, each preceded by a 65s wait for the server's
    # own per-IP WebSocket join budget (5/min, production behaviour that must not
    # be relaxed for a test), on top of the Swift, Go and Vite builds. The bound
    # is generous on purpose: a run that is merely slow must not read as the
    # regression. 45 before A12 appended the CLI ↔ macOS step (at most eight
    # more paced rounds of ~1.5 min, the Swift build reused); 60 is the policy
    # ceiling for this paid runner (ci-event-policy-test.mjs).
    timeout-minutes: 60
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm native-web-pairing
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain versions
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          xcodebuild -version
          swift --version
          go version
          node --version
      - name: Install web dependencies
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: web
        run: npm ci
      # The macOS runner image ships no browser. `e2e/harness.mjs` resolves
      # Chrome or THROWS — it never degrades to a skip — so a missing browser is
      # a red build here; installing it explicitly is what keeps that red from
      # being the normal outcome.
      - name: Install Google Chrome
        if: needs.evidence.outputs.reuse != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          if [ ! -x "$chrome" ]; then
            brew install --cask google-chrome
          fi
          [ -x "$chrome" ] || { echo "::error::Google Chrome did not install"; exit 1; }
          "$chrome" --version
      # The cell nothing else in this repository can fill: no fake WebSocket, no
      # BroadcastChannel room, no Swift-authored "peer". A real server, a real
      # pairing code minted through /api/pair, the macOS app's own link workspace
      # in one process, a real headless Chrome on the real built bundle in
      # another, and real WebRTC between them — in BOTH role assignments, with
      # the SAS digits and the transferred bytes compared across the two
      # implementations.
      #
      # `TMPDIR` is pinned to the runner's own temp so the per-run root a FAILED
      # run keeps is somewhere the upload step below can find it. The launcher
      # creates it under `${TMPDIR:-/tmp}`, which on a macOS runner is neither
      # `/tmp` nor `RUNNER_TEMP` by default.
      - name: macOS native to browser pairing acceptance
        if: needs.evidence.outputs.reuse != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/native-web-pairing-acceptance.sh
      # A12: the real `relayium pair` CLI against the same macOS link workspace,
      # both code roles × both link roles, text, files, a directory tree and
      # consecutive batches both ways, bytes compared by the oracle. The Mac
      # peer auto-accepts and cannot be driven to decline or cancel; those CLI
      # cells are proved by `cli-web` below and by android-interop.yml.
      - name: CLI to macOS app link workspace (A12)
        if: needs.evidence.outputs.reuse != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/interop/cli-mac-acceptance.sh
      # A failed run keeps its per-run root for diagnosis, and the browser log,
      # the peer log and the two observation files inside it are the only record
      # of which side stopped agreeing. Failure-only and short-lived: nothing in
      # that root is signing or notarization material, but this is a public
      # repository and an artifact is not a place to leave anything by default.
      - name: Retain pairing diagnosis
        if: failure() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-web-pairing-diagnosis
          path: |
            ${{ runner.temp }}/relayium-acceptance-*/**/*.log
            ${{ runner.temp }}/relayium-acceptance-*/**/*.json
          retention-days: 7
          if-no-files-found: ignore
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile macos-xcode-node-go-chrome --lane native-web-pairing --job pairing --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-native-web-pairing-pairing-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # A12: the real `relayium pair` CLI ↔ a real browser (Chromium) over a real
  # pairing code on a real loopback server. Linux is enough — the CLI is built
  # from `server/`, the page from `web/` — so this does not wait for a macOS
  # runner. Both code roles (the CLI mints; the signed-in page mints) × both
  # link roles, and per round: text both ways, flat and folder batches both
  # ways (two consecutive each way), a decline each way, a cancel by the
  # sending page, a stop by the receiving page, text after both, and /quit or
  # ctrl-C mid-transfer. Every byte and tree is compared by
  # `scripts/interop/cli-web-oracle.py`. Firefox is not run: the e2e harness
  # speaks CDP to Chrome only (web/e2e/README.md).
  #
  # Same rules as `pairing`: no `if:`, no `continue-on-error`, no secrets.
  cli-web:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Worst case 14 rounds of ~1.5 min, each after a 65 s join-budget wait.
    timeout-minutes: 50
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm native-web-pairing
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Toolchain versions
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          go version
          node --version
      - name: Install web dependencies
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: web
        run: npm ci
      # `e2e/harness.mjs` resolves Chrome or throws; the ubuntu image ships it.
      - name: Verify a real Chrome is present
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$chrome" ] || { echo "::error::no Google Chrome on this runner"; exit 1; }
          "$chrome" --version
      - name: CLI to browser pairing acceptance (A12)
        if: needs.evidence.outputs.reuse != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/interop/cli-web-acceptance.sh
      - name: Retain CLI pairing diagnosis
        if: failure() && needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-web-pairing-diagnosis
          path: |
            ${{ runner.temp }}/relayium-acceptance-*/*.log
            ${{ runner.temp }}/relayium-acceptance-*/observed-*.json
            ${{ runner.temp }}/relayium-acceptance-*/plan-*.json
          retention-days: 7
          if-no-files-found: ignore
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile linux-node-go-chrome --lane native-web-pairing --job cli-web --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-native-web-pairing-cli-web-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

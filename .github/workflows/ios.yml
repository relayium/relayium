name: ios
# The iOS half of the native product, split out of `macos.yml`.
#
# It lived there because both targets need a macOS runner and, at the time, the
# iOS app was one compile step. It grew a device-Release build, a UI smoke and
# three acceptance runs, and the two platforms stayed welded together: every
# macOS-only change started an iOS runner and every iOS-only change started the
# macOS signing lane. Splitting the FILE is what makes the path filters below
# able to tell the two apart at all — a filter is per-workflow, so no filter
# inside one file could ever have separated them.
#
# What each tree in the filter is an input TO, so a future edit can tell which
# entries are load-bearing:
#
#   apps/ios/**          the app this workflow builds and drives
#   apps/RelayiumKit/**  the SHARED package both native apps compile against;
#                        it is deliberately in this filter AND in macos.yml's,
#                        because a change there can break either app alone
#                        …minus `!apps/RelayiumKit/Tests/**`, which follows it.
#                        GitHub applies a `paths:` list per file in order with
#                        the LAST match winning, so the package's SOURCE still
#                        starts this workflow and its XCTest target and
#                        fixtures no longer do. `xcodebuild` compiles the
#                        package's library products, never its test target, so
#                        a test-only edit started two full xcodebuild graphs, a
#                        simulator UI smoke and three acceptance runs that
#                        could not observe it.
#
#                        That is not a coverage loss, including for the five
#                        iOS guard selectors below, which ARE files under
#                        `apps/RelayiumKit/Tests/`: editing one of them starts
#                        `swift-package.yml`, whose unfiltered `swift test`
#                        runs those very classes along with the rest of the
#                        suite. This workflow runs them for the other
#                        direction — an `apps/ios/**` change, which
#                        `swift-package.yml` does not watch.
#
#                        A MIXED diff — package source plus package tests in
#                        one commit — still starts this workflow, because the
#                        source file remains a positive match and one match is
#                        enough.
#   scripts/...          the three acceptance runs below and the isolation
#                        library they are built from, named one file at a time
#                        rather than as `scripts/**` so a Go-shard or
#                        release-script edit does not start an iOS runner
#
# `server/**` is deliberately ABSENT even though the acceptance step compiles a
# throwaway server from it: this workflow is the iOS gate, not a server gate,
# and `go.yml` owns server changes. The consequence is recorded honestly — a
# server change that breaks the local acceptance is caught by the next iOS-side
# change rather than at once. That is the pre-existing behaviour of the job in
# `macos.yml`, preserved rather than silently widened.
on:
  push:
    # Only `main`. A branch push used to start this workflow AND its pull
    # request start a second, identical run of the same commit. The
    # pull_request trigger below is what gates branch work; this one exists so
    # `main` itself is never unverified.
    branches:
      - main
    # Defined once and aliased below, the way `web.yml` and
    # `native-web-pairing.yml` already do it. Two hand-maintained copies drift,
    # and a filter that is narrower on `pull_request` than on `push` is a gate
    # that passes on the branch and is simply not run after the merge.
    #
    # ORDER IS LOAD-BEARING: the last pattern that matches a given file wins,
    # so the negation must FOLLOW `apps/RelayiumKit/**`. Swapping the two
    # leaves the YAML valid, leaves actionlint happy, and silently restores the
    # runs it exists to remove.
    paths: &paths
      - 'apps/ios/**'
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      - 'scripts/ios-ui-session-acceptance.sh'
      - 'scripts/local-transfer-acceptance.sh'
      - 'scripts/local-transfer-cleanup-test.sh'
      - 'scripts/lib/local-acceptance.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *paths
  # The manual escape hatch for testing the workflow itself, matching every
  # other governed workflow. It carries no inputs: nothing here signs,
  # notarizes, publishes or consumes a build number, so there is no release
  # contract to gate.
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else. Identical to
# the rule in every other governed workflow, and asserted by
# `scripts/test/ci-event-policy-test.mjs`: group by PR NUMBER when there is one
# and by `github.run_id` — unique per run — otherwise, so a PR supersedes only
# itself and nothing can ever cancel a `main` or dispatch run. `github.workflow`
# is part of the key, so this workflow's runs never share a group with
# `macos.yml`'s.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The iOS app compiles against the same shared package as macOS, so a
  # `apps/RelayiumKit/**` change that breaks it has to fail here rather than the
  # next time somebody opens Xcode. Unsigned and simulator-only: this is compile
  # evidence, not a release path, and there is nothing to distribute. No
  # secrets, so it runs on fork pull requests like macOS's `test` job does.
  #
  # The job keeps its `ios-build` name across the move so a failing check reads
  # the same as it did in `macos.yml`; `ci-event-policy-test.mjs` asserts that
  # this is now the ONLY workflow that owns it.
  #
  # This job has NO job-level `if:`, and must not regain one.
  #
  # It used to honour a `[macos-only]` marker in a `main` commit message: a push
  # whose head commit message contained that string skipped the iOS build
  # outright. The marker was inherited from `macos.yml` — where a dispatch meant
  # a macOS signing/notarization/publication run that must not build iOS — and
  # it was carried across the native split rather than re-examined.
  #
  # It is REMOVED, and that is the one behavioural change here. An escape hatch
  # in a gate is not a gate:
  #
  #   * the skip is invisible where it matters. A skipped check does not report
  #     red; it reports nothing, and a merge box reads that as "not a problem".
  #   * it is available to exactly the commit least likely to deserve it. Nobody
  #     types a skip marker on a calm afternoon.
  #   * it applied to `push` on `main` — AFTER review, where this workflow is the
  #     only thing that would have compiled iOS at all.
  #   * the case it was justified by is the case that most needed the build. A
  #     shared `apps/RelayiumKit/**` change carrying the marker is precisely a
  #     change where BOTH Apple consumers have to compile; skipping iOS there
  #     leaves the shared package broken for one app behind a green board.
  #
  # A push that genuinely must not build iOS should not be matching this
  # workflow's path filter in the first place. If it does match, the honest fix
  # is the filter, not a marker that overrides it.
  #
  # `scripts/test/ci-event-policy-test.mjs` asserts that neither this marker nor
  # any other commit-message condition returns to this file.
  ios-build:
    runs-on: macos-15
    # Finite, and chosen rather than inherited. This job builds two full
    # xcodebuild graphs (simulator Debug and device Release), runs a UI smoke on
    # a booted simulator, and then three acceptance runs that compile a
    # throwaway Go server and drive the built app over it. Real work is
    # comfortably inside this bound; the bound exists so a wedged run — a
    # simulator that never finishes booting, an acceptance child that never
    # exits — gives a PAID macOS runner back in minutes instead of holding it
    # for GitHub's 6-hour default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The acceptance step below builds the throwaway local server from
      # `server/` with `go build`, and the macOS runner image ships no Go on
      # PATH. Pinned and version-file-driven like every other Go job here, so
      # the acceptance server is compiled by the same toolchain the server
      # module declares.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          go version
      # The iOS project, privacy, distribution, icon and version guards are
      # XCTest cases in the SHARED package, not in the iOS project — so
      # `xcodebuild` never runs them, and `swift test` runs only in `macos.yml`,
      # whose path filter deliberately excludes `apps/ios/**`. An iOS-only pull
      # request therefore compiled the app and accepted its UI while nothing
      # executed the guards that read `apps/ios/Relayium.xcodeproj`, its
      # `PrivacyInfo.xcprivacy`, its signing configuration, its icon set or the
      # version it shares with its share extension. Those are exactly the inputs
      # an iOS-only change edits.
      #
      # Five selectors — four whole classes and one single method — named one at
      # a time rather than as a pattern: a regex like `IOS.*` would silently
      # adopt the next `IOS…Tests` class somebody writes and, far worse, could be
      # widened to the whole suite — 200-plus test files and every WebRTC and
      # account case with it — without looking like a change of scope.
      # `--filter` is a UNION, so this runs these five and nothing else.
      #
      # The fifth is a METHOD, not a class, and that is deliberate.
      # `BundleVersionTests` covers both native apps; only
      # `testTheIOSAppAndItsExtensionShipOneVersion` reads `apps/ios`; its one
      # sibling reads `apps/mac`, which this workflow does not trigger on.
      # SwiftPM's `Target.Class/method` filter syntax is what makes the narrow
      # selection possible; pulling in the whole class instead would run macOS
      # assertions on an iOS-only change.
      #
      # `scripts/test/ci-event-policy-test.mjs` asserts the exact five, in both
      # directions and by equality; that each resolves to a class file — and,
      # for the method, to a case — that actually exists, since a `--filter`
      # matching nothing exits 0; and that the step cannot be weakened into a
      # no-op or a whole-suite run.
      #
      # First, before the two xcodebuild graphs: these are seconds of file
      # reading, and an iOS project change that breaks one should turn the board
      # red without paying for a simulator build first. The whole suite stays in
      # `macos.yml`, which is the only place `swift test` runs unfiltered.
      #
      # TWO BOUNDS, and the tighter one belongs here. `ios-build`'s
      # `timeout-minutes: 75` above is a budget for two simulator builds; this
      # step compiles the shared package and reads files, and finishes in
      # minutes. Inheriting 75 would let a wedged `swift test` hold a PAID
      # macOS runner for over an hour before the board turns red, so the step
      # carries its own smaller number — well above the real runtime, well
      # below the job's. `timeout-minutes` is valid GitHub Actions syntax on a
      # step; the policy test requires this one to stay finite, positive and
      # within 40 minutes, and separately requires the carrier job to keep the
      # finite budget section 6i governs. Neither bound can silently become
      # GitHub's six-hour default, and neither replaces the other.
      - name: iOS project, privacy, distribution, icon and version guards
        working-directory: apps/RelayiumKit
        timeout-minutes: 25
        run: |
          swift test \
            --filter 'RelayiumKitTests.IOSSurfaceGuardTests' \
            --filter 'RelayiumKitTests.IOSPrivacyManifestTests' \
            --filter 'RelayiumKitTests.IOSDistributionSigningTests' \
            --filter 'RelayiumKitTests.IOSAppIconAssetTests' \
            --filter 'RelayiumKitTests.BundleVersionTests/testTheIOSAppAndItsExtensionShipOneVersion'
      # `generic/platform=iOS Simulator` builds for the simulator SDK without
      # booting a device or needing a runtime download.
      - name: Build (unsigned, iOS Simulator)
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO build
      # TestFlight uses the device Release graph, not the simulator Debug graph.
      # Keep signing disabled here so forks can still exercise the compiler,
      # while catching release-only settings and device-SDK failures before an
      # archive consumes a build number.
      - name: Build (unsigned, iOS Device Release)
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-ios-release" \
            CODE_SIGNING_ALLOWED=NO build
      # A compile cannot prove that TabView produced five usable screens. Pick
      # an installed iPhone runtime by id so this remains independent of the
      # device marketing name on each macOS runner image.
      - name: Run iOS primary-task UI smoke
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j \
            | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          print(next(device["udid"]
                     for devices in data["devices"].values()
                     for device in devices
                     if device.get("isAvailable")
                     and device.get("name", "").startswith("iPhone")))')"
          [ -n "$device_id" ] || {
            echo "::error::no available iPhone Simulator runtime"; exit 1; }
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            -only-testing:RelayiumUITests test
      # The step above is deliberately offline: with no origin passed, the app
      # resolves production, `UITestMode.allowsResidency` is false, and every
      # `LocalSessionUITests` path SKIPS. That is why they can share the target
      # without slowing the smoke down — and why they need this step, which
      # starts a throwaway server and a real counterpart process first so the
      # skips become real transfers.
      #
      # Both local acceptance runs are here rather than in `test`, together,
      # because they share one launcher (`scripts/lib/local-acceptance.sh`) and
      # one pair of built binaries. T2a proves the transport between two host
      # processes; T2b drives the built App's own UI over it and is what the Q0
      # iOS matrix cells rest on. The cleanup test proves neither strands a
      # child process when it fails.
      #
      # `RELAYIUM_ACCEPTANCE_DERIVED_DATA` reuses the app this job already
      # built; without it the acceptance run would compile the whole app a
      # second time.
      #
      # `TMPDIR` is pinned to the runner's own temp so the per-run root a FAILED
      # run keeps is somewhere the upload step below can find it. The launcher
      # creates it under `${TMPDIR:-/tmp}`, which on a macOS runner is neither
      # `/tmp` nor `RUNNER_TEMP` by default.
      - name: Run local transfer and built-App session acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          scripts/local-transfer-acceptance.sh
          scripts/local-transfer-cleanup-test.sh
          RELAYIUM_ACCEPTANCE_DERIVED_DATA="$RUNNER_TEMP/dd-ios" \
            scripts/ios-ui-session-acceptance.sh
      # A failed acceptance run keeps its per-run root for diagnosis, and the
      # xcodebuild log inside it is the only record of which UI step stopped.
      # Failure-only and short-lived, exactly as the UI-smoke `.xcresult` upload
      # is: nothing in that root is signing or notarization material, but it is
      # a public repository and an artifact is not a place to leave anything by
      # default.
      - name: Retain acceptance diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-session-acceptance-diagnosis
          path: ${{ runner.temp }}/relayium-acceptance-*/**/*.log
          retention-days: 7
          if-no-files-found: ignore

name: ios
# The iOS half of the native product, split out of `macos.yml`.
#
# It lived there because both targets need a macOS runner and, at the time, the
# iOS app was one compile step. It grew a device-Release build, a UI smoke and
# three acceptance runs, and the two platforms stayed welded together: every
# macOS-only change started an iOS runner and every iOS-only change started the
# macOS signing lane. Splitting the FILE is what makes the path filters below
# able to tell the two apart at all — a filter is per-workflow, so no filter
# inside one file could ever have separated them.
#
# What each tree in the filter is an input TO, so a future edit can tell which
# entries are load-bearing:
#
#   apps/ios/**          the app this workflow builds and drives
#   apps/RelayiumKit/**  the SHARED package both native apps compile against;
#                        it is deliberately in this filter AND in macos.yml's,
#                        because a change there can break either app alone
#                        …minus `!apps/RelayiumKit/Tests/**`, which follows it.
#                        GitHub applies a `paths:` list per file in order with
#                        the LAST match winning, so the package's SOURCE still
#                        starts this workflow and its XCTest target and
#                        fixtures no longer do. `xcodebuild` compiles the
#                        package's library products, never its test target, so
#                        a test-only edit started two full xcodebuild graphs, a
#                        simulator UI smoke and three acceptance runs that
#                        could not observe it.
#
#                        That is not a coverage loss, including for the five
#                        iOS guard selectors below, which ARE files under
#                        `apps/RelayiumKit/Tests/`: editing one of them starts
#                        `swift-package.yml`, whose unfiltered `swift test`
#                        runs those very classes along with the rest of the
#                        suite. This workflow runs them for the other
#                        direction — an `apps/ios/**` change, which
#                        `swift-package.yml` does not watch.
#
#                        A MIXED diff — package source plus package tests in
#                        one commit — still starts this workflow, because the
#                        source file remains a positive match and one match is
#                        enough.
#   scripts/...          the three acceptance runs below and the isolation
#                        library they are built from, named one file at a time
#                        rather than as `scripts/**` so a Go-shard or
#                        release-script edit does not start an iOS runner
#
# `server/**` is deliberately ABSENT even though the acceptance step compiles a
# throwaway server from it: this workflow is the iOS gate, not a server gate,
# and `go.yml` owns server changes. The consequence is recorded honestly — a
# server change that breaks the local acceptance is caught by the next iOS-side
# change rather than at once. That is the pre-existing behaviour of the job in
# `macos.yml`, preserved rather than silently widened.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    #
    # ORDER IS LOAD-BEARING: the last pattern that matches a given file wins,
    # so the negation must FOLLOW `apps/RelayiumKit/**`. Swapping the two
    # leaves the YAML valid, leaves actionlint happy, and silently restores the
    # runs it exists to remove.
    paths:
      - 'apps/ios/**'
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      - 'scripts/ios-ui-session-acceptance.sh'
      - 'scripts/local-transfer-acceptance.sh'
      - 'scripts/local-transfer-cleanup-test.sh'
      - 'scripts/lib/local-acceptance.sh'
      - '.github/workflows/ios.yml'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:
  # The manual escape hatch for testing the workflow itself, matching every
  # other governed workflow. It carries no inputs: nothing here signs,
  # notarizes, publishes or consumes a build number, so there is no release
  # contract to gate.
  workflow_dispatch:

permissions:
  contents: read

# The upload toolchain, declared ONCE for the whole lane.
#
# Apple refuses App Store Connect uploads built with anything older than Xcode
# 26 and the iOS 26 SDK, and has since 2026-04-28. `macos-15`'s
# `/Applications/Xcode.app` is still Xcode 16.4 with the iOS 18.5 SDK, so a lane
# that says nothing about its toolchain compiles this app with a toolchain no
# archive may be uploaded from — and reports green for it. The build succeeds,
# the UI smoke passes, the acceptance runs pass, and the first signal is Apple
# rejecting an archive that has already consumed a build number.
#
# "Newest installed Xcode" is NOT the fix. The hosted image inventory announces
# an Xcode 27 PUBLIC PREVIEW, and a newest-wins rule adopts it silently the day
# an image refresh lands one — silently because a preview compiles this app
# perfectly well and nothing goes red.
#
# The claim here is deliberately narrow, because the obvious stronger one is not
# supported: Apple's current guidance accepts builds from Xcode 27 betas for
# TestFlight, so this lane does NOT assert that such an archive is refused at
# upload. What it asserts is that a preview toolchain sits outside the one Xcode
# major this lane certifies, and that its output is not something to submit an
# App Store build on. This lane selects the newest Xcode WITHIN one required
# major and fails closed when that major is not installed. EXACT-MAJOR SELECTION
# IS THE DEFENCE against drifting onto an unvalidated newer major; the marker
# check below is a cheap extra refusal, not a prerelease detector. Adopting a
# newer major is a decision made against Apple's then-current requirement and a
# demonstrated accepted upload, not against an image inventory.
#
# `RELAYIUM_SELECT_XCODE` lives HERE rather than in each job because three
# copies of a version gate drift silently: a job left on 16.4 still compiles,
# still passes, and still says nothing. GitHub Actions rejects YAML anchors and
# a composite action would be a second file for one script, so a workflow-level
# `env:` entry expanded into each job's `run:` is the one shared form that is
# both YAML-safe and correct here.
#
# Every job runs it as its first step after checkout — before `xcodebuild`,
# `swift` or `xcrun` touch anything — and it exports `DEVELOPER_DIR` through
# `$GITHUB_ENV` so each later step in that job inherits the selection.
# `scripts/test/ci-event-policy-test.mjs` section 6p asserts the structure and
# the fail-closed exits by mutation.
#
# This gate is about the TOOLCHAIN and nothing else. It signs nothing, archives
# nothing and uploads nothing; the release-side gates in
# `docs/ios-app-store-submission.md` stay exactly where they are.
env:
  # The REQUIRED major, not a floor. Exactly one Xcode major is currently
  # certified for this lane's output: 16.4 is below Apple's upload floor, and
  # Xcode 27 is still a public preview this lane holds no App Store submission
  # evidence for. Changing this number re-points what the whole lane certifies.
  RELAYIUM_XCODE_MAJOR: '26'
  # The SDK stays a FLOOR, because it is a different fact: what Apple validates
  # is the SDK the binary was LINKED against, and any iOS 26-or-later SDK inside
  # the required Xcode major satisfies it.
  RELAYIUM_MIN_IOS_SDK_MAJOR: '26'
  RELAYIUM_SELECT_XCODE: |
    set -euo pipefail

    required_xcode="${RELAYIUM_XCODE_MAJOR:?}"
    min_sdk="${RELAYIUM_MIN_IOS_SDK_MAJOR:?}"

    # `newer A B` is true when version A sorts after B field by field, so 26.10
    # beats 26.9 and a two-field version still compares against a three-field
    # one. A plain string comparison gets both of those wrong.
    newer() {
      awk -v a="$1" -v b="$2" 'BEGIN {
        na = split(a, x, "."); nb = split(b, y, ".");
        n = (na > nb) ? na : nb;
        for (i = 1; i <= n; i++) {
          ai = (i <= na) ? x[i] + 0 : 0;
          bi = (i <= nb) ? y[i] + 0 : 0;
          if (ai > bi) exit 0;
          if (ai < bi) exit 1;
        }
        exit 1;
      }'
    }

    # `prerelease TEXT` is true when TEXT carries an EXPLICIT seed marker.
    #
    # Scope, precisely: this refuses a toolchain that announces itself as a
    # beta, preview or seed in its bundle path or its full `xcodebuild -version`
    # report. It is a cheap extra refusal, NOT a reliable prerelease detector —
    # Apple guarantees no such marker — and it is not what keeps the announced
    # Xcode 27 preview out of this lane. The required-major filter below does
    # that, and it is the defence to preserve.
    #
    # Two things are deliberately NOT treated as seed markers:
    #   * "release candidate"/"rc". Apple's App Store Connect release notes have
    #     explicitly permitted RC toolchains for App Store distribution — Xcode
    #     26.6 with the iOS 26.5 RC SDK — so blanket-refusing every RC would
    #     reject a combination Apple accepts.
    #   * A build number's shape. A trailing lowercase letter does not mean
    #     seed: stable Xcode 16.0 shipped as build `16A242d`.
    prerelease() {
      case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
        *beta*|*preview*|*seed*|*prerelease*|*pre-release*) return 0 ;;
      esac
      return 1
    }

    # Every installed toolchain, judged by what it REPORTS rather than by its
    # bundle name. The image rotates its Xcode point releases without any commit
    # here, so a hard-coded path turns an image refresh into a lane outage; but
    # the newest of them is not the answer either, so each candidate is filtered
    # before it can win.
    echo "Installed Xcode toolchains on macOS $(sw_vers -productVersion):"
    selected=""
    selected_version=""
    selected_build=""
    for app in /Applications/Xcode*.app; do
      developer="$app/Contents/Developer"
      binary="$developer/usr/bin/xcodebuild"
      [ -x "$binary" ] || continue

      # A bundle that cannot report a version is not a candidate. Skipping it
      # rather than aborting keeps one broken install from taking the lane down,
      # and costs nothing: if no candidate survives, the empty-selection exit
      # below is red.
      if ! report="$(DEVELOPER_DIR="$developer" "$binary" -version 2>/dev/null)"; then
        echo "  $app -> refused: xcodebuild reported no version"
        continue
      fi
      version="$(printf '%s\n' "$report" | awk 'NR == 1 { print $2 }')"
      build="$(printf '%s\n' "$report" | awk '/^Build version/ { print $3 }')"
      if [ -z "$version" ] || [ -z "$build" ]; then
        echo "  $app -> refused: incomplete version report from xcodebuild"
        continue
      fi

      if prerelease "$report" || prerelease "$app"; then
        echo "  $app -> Xcode $version ($build) refused: announces itself as a beta, preview or seed"
        continue
      fi

      # The required major, enforced HERE so a newer one cannot win by simply
      # being installed. A higher major is not an upgrade this lane may make on
      # its own: it is an untested toolchain, and on this image it is a preview.
      major="${version%%.*}"
      if [ "$major" != "$required_xcode" ]; then
        echo "  $app -> Xcode $version ($build) skipped: not the required major $required_xcode"
        continue
      fi

      echo "  $app -> Xcode $version ($build) eligible"
      if [ -z "$selected" ] || newer "$version" "$selected_version"; then
        selected="$developer"
        selected_version="$version"
        selected_build="$build"
      fi
    done

    # Fail closed. Reaching this line means the image carries no eligible Xcode
    # $required_xcode at all — a runner-image regression, and a lane that must
    # go red rather than quietly fall back to whatever else is on disk.
    if [ -z "$selected" ]; then
      echo "::error::no eligible Xcode $required_xcode is installed on this runner; refusing to build an iOS app with another major"
      exit 1
    fi

    # Belt and braces on the loop above: if a future edit lets a different major
    # through, this is the second place it dies rather than the first place it
    # ships.
    selected_major="${selected_version%%.*}"
    if [ "$selected_major" != "$required_xcode" ]; then
      echo "::error::selected Xcode $selected_version is not the required major $required_xcode; an archive from it is not known to be accepted at upload"
      exit 1
    fi

    export DEVELOPER_DIR="$selected"
    echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"

    # Printed on every job for audit, so a run's own log answers "which
    # toolchain built this?" without anybody rerunning it.
    xcodebuild -version
    swift --version

    sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
    simulator_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
    echo "Selected Xcode $selected_version ($selected_build) at $selected"
    echo "  iphoneos SDK $sdk_version"
    echo "  iphonesimulator SDK $simulator_sdk_version"

    # The SDK floor, checked separately from the Xcode major because they are
    # separate facts: what Apple validates at upload is the SDK the binary was
    # linked against, and an Xcode that satisfies the check above with its
    # iphoneos SDK removed or downgraded would otherwise pass.
    sdk_major="${sdk_version%%.*}"
    if [ "$sdk_major" -lt "$min_sdk" ]; then
      echo "::error::iphoneos SDK $sdk_version is below the App Store minimum major $min_sdk; an archive against it is rejected at upload"
      exit 1
    fi

# Supersede a pull request's own earlier runs, and nothing else. Identical to
# the rule in every other governed workflow, and asserted by
# `scripts/test/ci-event-policy-test.mjs`: group by PR NUMBER when there is one
# and by `github.run_id` — unique per run — otherwise, so a PR supersedes only
# itself and nothing can ever cancel a `main` or dispatch run.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: ios-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # These jobs deliberately have no `needs:` edges. The previous single job
  # spent about 37 minutes serially doing ~2 minutes of guards, ~5 minutes of
  # builds, ~22 minutes of UI smoke and ~7 minutes of transfer acceptance. The
  # three independent evidence classes now run concurrently. The reusable
  # workflow still fails closed if any job fails, so this changes wall-clock
  # time rather than coverage.
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      - name: iOS project, privacy, distribution, icon and version guards
        working-directory: apps/RelayiumKit
        timeout-minutes: 20
        run: |
          swift test \
            --filter 'RelayiumKitTests.IOSSurfaceGuardTests' \
            --filter 'RelayiumKitTests.IOSPrivacyManifestTests' \
            --filter 'RelayiumKitTests.IOSDistributionSigningTests' \
            --filter 'RelayiumKitTests.IOSAppIconAssetTests' \
            --filter 'RelayiumKitTests.BundleVersionTests/testTheIOSAppAndItsExtensionShipOneVersion'
      # `generic/platform=iOS Simulator` builds for the simulator SDK without
      # booting a device or needing a runtime download.
      - name: Build (unsigned, iOS Simulator)
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO build
      # TestFlight uses the device Release graph, not the simulator Debug graph.
      # Keep signing disabled here so forks can still exercise the compiler,
      # while catching release-only settings and device-SDK failures before an
      # archive consumes a build number.
      - name: Build (unsigned, iOS Device Release)
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-ios-release" \
            CODE_SIGNING_ALLOWED=NO build

  ios-ui-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      - name: Run iOS primary-task UI smoke
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j \
            | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          print(next(device["udid"]
                     for devices in data["devices"].values()
                     for device in devices
                     if device.get("isAvailable")
                     and device.get("name", "").startswith("iPhone")))')"
          [ -n "$device_id" ] || {
            echo "::error::no available iPhone Simulator runtime"; exit 1; }
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            -resultBundlePath "$RUNNER_TEMP/ios-ui-smoke.xcresult" \
            -only-testing:RelayiumUITests test
      - name: Retain UI smoke diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-smoke-diagnosis
          path: ${{ runner.temp }}/ios-ui-smoke.xcresult
          retention-days: 7
          if-no-files-found: error

  ios-transfer-acceptance:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go toolchain version
        run: go version
      # Populate the same DerivedData directory the built-App acceptance uses.
      # DerivedData is intentionally rebuilt on this runner instead of crossing
      # runner boundaries as a large, path-sensitive artifact.
      - name: Build acceptance app (unsigned, iOS Simulator)
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run local transfer and built-App session acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          scripts/local-transfer-acceptance.sh
          scripts/local-transfer-cleanup-test.sh
          RELAYIUM_ACCEPTANCE_DERIVED_DATA="$RUNNER_TEMP/dd-ios" \
            scripts/ios-ui-session-acceptance.sh
      - name: Retain acceptance diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-session-acceptance-diagnosis
          path: ${{ runner.temp }}/relayium-acceptance-*/**/*.log
          retention-days: 7
          if-no-files-found: ignore

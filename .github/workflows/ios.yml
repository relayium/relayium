name: ios
# The iOS half of the native product, split out of `macos.yml`.
#
# It lived there because both targets need a macOS runner and, at the time, the
# iOS app was one compile step. It grew a device-Release build, a UI smoke and
# three acceptance runs, and the two platforms stayed welded together: every
# macOS-only change started an iOS runner and every iOS-only change started the
# macOS signing lane. Splitting the FILE is what makes the path filters below
# able to tell the two apart at all — a filter is per-workflow, so no filter
# inside one file could ever have separated them.
#
# What each tree in the filter is an input TO, so a future edit can tell which
# entries are load-bearing:
#
#   apps/ios/**          the app this workflow builds and drives
#   apps/RelayiumKit/**  the SHARED package both native apps compile against;
#                        it is deliberately in this filter AND in macos.yml's,
#                        because a change there can break either app alone
#                        …minus `!apps/RelayiumKit/Tests/**`, which follows it.
#                        GitHub applies a `paths:` list per file in order with
#                        the LAST match winning, so the package's SOURCE still
#                        starts this workflow and its XCTest target and
#                        fixtures no longer do. `xcodebuild` compiles the
#                        package's library products, never its test target, so
#                        a test-only edit started two full xcodebuild graphs, a
#                        simulator UI smoke and three acceptance runs that
#                        could not observe it.
#
#                        That is not a coverage loss: editing a file under
#                        `apps/RelayiumKit/Tests/` starts `swift-package.yml`,
#                        whose unfiltered `swift test` runs the whole suite.
#                        The same lane also starts on `apps/ios/**`, because
#                        its guard tests READ this tree, so this workflow
#                        runs no `swift test` of its own.
#
#                        A MIXED diff — package source plus package tests in
#                        one commit — still starts this workflow, because the
#                        source file remains a positive match and one match is
#                        enough.
#   scripts/...          iOS UI tests and release-candidate guards below,
#                        named one file at a time rather than as `scripts/**`.
#                        Built-App transfer acceptance has its own dependency-
#                        complete lane, including `server/**`.
#
# `server/**` is deliberately absent: the narrow `ios-transfer-interop.yml`
# lane owns the server-backed built-App acceptance without buying this entire
# iOS build/UI matrix for every server commit.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    #
    # ORDER IS LOAD-BEARING: the last pattern that matches a given file wins,
    # so the negation must FOLLOW `apps/RelayiumKit/**`. Swapping the two
    # leaves the YAML valid, leaves actionlint happy, and silently restores the
    # runs it exists to remove.
    paths:
      - 'apps/ios/**'
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      # The App Store candidate contract `ios-build` runs first
      # (`bash scripts/test/ios-app-store-candidate-test.sh`), the script it
      # drives, and the two inputs it requires to exist and validates: the
      # metadata validator and the metadata packet. A change to any of them
      # used to start no conditional lane at all (audit D-H2, 2026-09-28).
      - 'scripts/test/ios-app-store-candidate-test.sh'
      - 'scripts/ios-app-store-candidate.sh'
      - 'scripts/ios-app-store-metadata-validate.mjs'
      - 'docs/app-store-metadata-ios.json'
      - '.github/workflows/ios.yml'
      # The PR→main evidence verifier, its registry, the filter reader it imports,
      # the adoption transform, the toolchain certificate probe and registry, and
      # their tests decide whether a main push may witness this lane instead of
      # re-running it — so a change to any of them is a change to this lane
      # (scripts/ci/ci-evidence-view.mjs).
      - 'scripts/ci/ci-evidence.mjs'
      - 'scripts/ci/ci-evidence-registry.json'
      - 'scripts/ci/select-lanes.mjs'
      - 'scripts/ci/ci-evidence-view.mjs'
      - 'scripts/test/ci-evidence-test.mjs'
      - 'scripts/ci/ci-evidence-toolchain.mjs'
      - 'scripts/ci/ci-evidence-toolchain-registry.json'
      - 'scripts/test/ci-evidence-toolchain-test.mjs'
  # Called by `.github/workflows/merge-gate.yml`, and by nothing else.
  #
  # This REPLACES this file's own `pull_request:` trigger, and the replacement
  # is the whole point. A path-filtered workflow that does not trigger emits no
  # check run AT ALL, so branch protection could never tell "this lane passed"
  # from "this lane was legitimately not selected" from "this lane never ran" —
  # which is why every filtered lane here reported red over a merge button that
  # still worked. `merge-gate.yml` calls each lane, judges the results, and
  # reports one always-present context that CAN be required.
  #
  # Restoring `pull_request:` here would run this lane twice for every commit
  # on a branch with an open pull request: once directly, once through the gate.
  # `scripts/test/ci-event-policy-test.mjs` asserts its absence for that reason.
  #
  # No `inputs:` and no `secrets:`. Nothing in this file reads either, and a
  # callee that declares one it never uses is a callee a future caller can be
  # asked to supply.
  workflow_call:
  # The manual escape hatch for testing the workflow itself, matching every
  # other governed workflow. It carries no inputs: nothing here signs,
  # notarizes, publishes or consumes a build number, so there is no release
  # contract to gate.
  workflow_dispatch:

permissions:
  contents: read

# The upload toolchain, declared ONCE for the whole lane.
#
# Apple refuses App Store Connect uploads built with anything older than Xcode
# 26 and the iOS 26 SDK, and has since 2026-04-28. `macos-15`'s
# `/Applications/Xcode.app` is still Xcode 16.4 with the iOS 18.5 SDK, so a lane
# that says nothing about its toolchain compiles this app with a toolchain no
# archive may be uploaded from — and reports green for it. The build succeeds,
# the UI smoke passes, the acceptance runs pass, and the first signal is Apple
# rejecting an archive that has already consumed a build number.
#
# "Newest installed Xcode" is NOT the fix. The hosted image inventory announces
# an Xcode 27 PUBLIC PREVIEW, and a newest-wins rule adopts it silently the day
# an image refresh lands one — silently because a preview compiles this app
# perfectly well and nothing goes red.
#
# The claim here is deliberately narrow, because the obvious stronger one is not
# supported: Apple's current guidance accepts builds from Xcode 27 betas for
# TestFlight, so this lane does NOT assert that such an archive is refused at
# upload. What it asserts is that a preview toolchain sits outside the one Xcode
# major this lane certifies, and that its output is not something to submit an
# App Store build on. This lane selects the newest Xcode WITHIN one required
# major and fails closed when that major is not installed. EXACT-MAJOR SELECTION
# IS THE DEFENCE against drifting onto an unvalidated newer major; the marker
# check below is a cheap extra refusal, not a prerelease detector. Adopting a
# newer major is a decision made against Apple's then-current requirement and a
# demonstrated accepted upload, not against an image inventory.
#
# `RELAYIUM_SELECT_XCODE` lives HERE rather than in each job because four
# copies of a version gate drift silently: a job left on 16.4 still compiles,
# still passes, and still says nothing. GitHub Actions rejects YAML anchors and
# a composite action would be a second file for one script, so a workflow-level
# `env:` entry expanded into each job's `run:` is the one shared form that is
# both YAML-safe and correct here.
#
# Every job runs it as its first step after checkout — before `xcodebuild`,
# `swift` or `xcrun` touch anything — and it exports `DEVELOPER_DIR` through
# `$GITHUB_ENV` so each later step in that job inherits the selection.
# `scripts/test/ci-event-policy-test.mjs` section 6p asserts the structure and
# the fail-closed exits by mutation.
#
# This gate is about the TOOLCHAIN and nothing else. It signs nothing, archives
# nothing and uploads nothing; the release-side gates in
# `docs/ios-app-store-submission.md` stay exactly where they are.
env:
  # The REQUIRED major, not a floor. Exactly one Xcode major is currently
  # certified for this lane's output: 16.4 is below Apple's upload floor, and
  # Xcode 27 is still a public preview this lane holds no App Store submission
  # evidence for. Changing this number re-points what the whole lane certifies.
  RELAYIUM_XCODE_MAJOR: '26'
  # The SDK stays a FLOOR, because it is a different fact: what Apple validates
  # is the SDK the binary was LINKED against, and any iOS 26-or-later SDK inside
  # the required Xcode major satisfies it.
  RELAYIUM_MIN_IOS_SDK_MAJOR: '26'
  RELAYIUM_SELECT_XCODE: |
    set -euo pipefail

    required_xcode="${RELAYIUM_XCODE_MAJOR:?}"
    min_sdk="${RELAYIUM_MIN_IOS_SDK_MAJOR:?}"

    # `newer A B` is true when version A sorts after B field by field, so 26.10
    # beats 26.9 and a two-field version still compares against a three-field
    # one. A plain string comparison gets both of those wrong.
    newer() {
      awk -v a="$1" -v b="$2" 'BEGIN {
        na = split(a, x, "."); nb = split(b, y, ".");
        n = (na > nb) ? na : nb;
        for (i = 1; i <= n; i++) {
          ai = (i <= na) ? x[i] + 0 : 0;
          bi = (i <= nb) ? y[i] + 0 : 0;
          if (ai > bi) exit 0;
          if (ai < bi) exit 1;
        }
        exit 1;
      }'
    }

    # `prerelease TEXT` is true when TEXT carries an EXPLICIT seed marker.
    #
    # Scope, precisely: this refuses a toolchain that announces itself as a
    # beta, preview or seed in its bundle path or its full `xcodebuild -version`
    # report. It is a cheap extra refusal, NOT a reliable prerelease detector —
    # Apple guarantees no such marker — and it is not what keeps the announced
    # Xcode 27 preview out of this lane. The required-major filter below does
    # that, and it is the defence to preserve.
    #
    # Two things are deliberately NOT treated as seed markers:
    #   * "release candidate"/"rc". Apple's App Store Connect release notes have
    #     explicitly permitted RC toolchains for App Store distribution — Xcode
    #     26.6 with the iOS 26.5 RC SDK — so blanket-refusing every RC would
    #     reject a combination Apple accepts.
    #   * A build number's shape. A trailing lowercase letter does not mean
    #     seed: stable Xcode 16.0 shipped as build `16A242d`.
    prerelease() {
      case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
        *beta*|*preview*|*seed*|*prerelease*|*pre-release*) return 0 ;;
      esac
      return 1
    }

    # Every installed toolchain, judged by what it REPORTS rather than by its
    # bundle name. The image rotates its Xcode point releases without any commit
    # here, so a hard-coded path turns an image refresh into a lane outage; but
    # the newest of them is not the answer either, so each candidate is filtered
    # before it can win.
    echo "Installed Xcode toolchains on macOS $(sw_vers -productVersion):"
    selected=""
    selected_version=""
    selected_build=""
    for app in /Applications/Xcode*.app; do
      developer="$app/Contents/Developer"
      binary="$developer/usr/bin/xcodebuild"
      [ -x "$binary" ] || continue

      # A bundle that cannot report a version is not a candidate. Skipping it
      # rather than aborting keeps one broken install from taking the lane down,
      # and costs nothing: if no candidate survives, the empty-selection exit
      # below is red.
      if ! report="$(DEVELOPER_DIR="$developer" "$binary" -version 2>/dev/null)"; then
        echo "  $app -> refused: xcodebuild reported no version"
        continue
      fi
      version="$(printf '%s\n' "$report" | awk 'NR == 1 { print $2 }')"
      build="$(printf '%s\n' "$report" | awk '/^Build version/ { print $3 }')"
      if [ -z "$version" ] || [ -z "$build" ]; then
        echo "  $app -> refused: incomplete version report from xcodebuild"
        continue
      fi

      if prerelease "$report" || prerelease "$app"; then
        echo "  $app -> Xcode $version ($build) refused: announces itself as a beta, preview or seed"
        continue
      fi

      # The required major, enforced HERE so a newer one cannot win by simply
      # being installed. A higher major is not an upgrade this lane may make on
      # its own: it is an untested toolchain, and on this image it is a preview.
      major="${version%%.*}"
      if [ "$major" != "$required_xcode" ]; then
        echo "  $app -> Xcode $version ($build) skipped: not the required major $required_xcode"
        continue
      fi

      echo "  $app -> Xcode $version ($build) eligible"
      if [ -z "$selected" ] || newer "$version" "$selected_version"; then
        selected="$developer"
        selected_version="$version"
        selected_build="$build"
      fi
    done

    # Fail closed. Reaching this line means the image carries no eligible Xcode
    # $required_xcode at all — a runner-image regression, and a lane that must
    # go red rather than quietly fall back to whatever else is on disk.
    if [ -z "$selected" ]; then
      echo "::error::no eligible Xcode $required_xcode is installed on this runner; refusing to build an iOS app with another major"
      exit 1
    fi

    # Belt and braces on the loop above: if a future edit lets a different major
    # through, this is the second place it dies rather than the first place it
    # ships.
    selected_major="${selected_version%%.*}"
    if [ "$selected_major" != "$required_xcode" ]; then
      echo "::error::selected Xcode $selected_version is not the required major $required_xcode; an archive from it is not known to be accepted at upload"
      exit 1
    fi

    export DEVELOPER_DIR="$selected"
    echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"

    # Printed on every job for audit, so a run's own log answers "which
    # toolchain built this?" without anybody rerunning it.
    xcodebuild -version
    swift --version

    sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
    simulator_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
    echo "Selected Xcode $selected_version ($selected_build) at $selected"
    echo "  iphoneos SDK $sdk_version"
    echo "  iphonesimulator SDK $simulator_sdk_version"

    # The SDK floor, checked separately from the Xcode major because they are
    # separate facts: what Apple validates at upload is the SDK the binary was
    # linked against, and an Xcode that satisfies the check above with its
    # iphoneos SDK removed or downgraded would otherwise pass.
    sdk_major="${sdk_version%%.*}"
    if [ "$sdk_major" -lt "$min_sdk" ]; then
      echo "::error::iphoneos SDK $sdk_version is below the App Store minimum major $min_sdk; an archive against it is rejected at upload"
      exit 1
    fi

# Supersede a pull request's own earlier runs, and nothing else. Identical to
# the rule in every other governed workflow, and asserted by
# `scripts/test/ci-event-policy-test.mjs`: group by PR NUMBER when there is one
# and by `github.run_id` — unique per run — otherwise, so a PR supersedes only
# itself and nothing can ever cancel a `main` or dispatch run.
#
# The prefix is a LITERAL, not `${{ github.workflow }}`, and that is a property
# of being a reusable CALLEE rather than a style choice. Inside a called
# workflow that expression is the CALLER's name, so every lane `merge-gate.yml`
# calls would land in ONE group under one `github.run_id` — with
# `cancel-in-progress` true on a pull request, the lanes would actively cancel
# each other, and the gate would then be judging cancelled runs while every
# lane reported `cancelled` rather than red. A literal prefix nothing else uses
# makes the groups disjoint by construction, and
# `scripts/test/ci-event-policy-test.mjs` asserts both the literal and that no
# two files resolve to the same one.
concurrency:
  group: ios-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR→main evidence: a cheap read-only screen before any paid macOS/Windows
  # probe. `eligible=true` only when this main push has a source proof that a
  # current toolchain certificate could complete; it ENABLES the certify jobs
  # and approves nothing. Never red, and anything but `eligible=true` means no
  # paid probe and the full lane.
  screen:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.screen.outputs.eligible }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Could a current toolchain certificate complete a proof?
        id: screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-evidence.mjs screen ios >> "$GITHUB_OUTPUT"

  # PR→main evidence: the macos-15 toolchain a fresh run of this lane would get NOW,
  # resolved by copies of the lane's own selection/setup steps and certified
  # by scripts/ci/ci-evidence-toolchain.mjs. Ordinary main pushes the screen
  # found eligible only; skipped everywhere else. Bounded at 3 minutes and never
  # red: a failed, slow or unknown probe hands over no certificate, and the
  # lane then runs in full.
  certify-macos:
    needs: screen
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.screen.result == 'success' && needs.screen.outputs.eligible == 'true' }}
    runs-on: macos-15
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      certificates: ${{ steps.export.outputs.certificates }}
    steps:
      - name: Check out the probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select and verify the Xcode 26 upload toolchain
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      - name: Certify this runner's toolchain now
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs current --profiles macos-xcode,macos-xcode-ipad,macos-xcode-iphone --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Hand the certificates to the evidence job
        id: export
        shell: bash
        run: node scripts/ci/ci-evidence-toolchain.mjs export --dir "$RUNNER_TEMP/ci-evidence-current" >> "$GITHUB_OUTPUT"

  # PR→main evidence reuse (scripts/ci/ci-evidence.mjs; docs/CI-PLATFORM-BOUNDARY.md).
  #
  # On an ORDINARY push to main, decides whether the merged pull request's
  # latest merge-gate run already proved this exact tree for this lane, on the
  # same toolchain this runner family offers now. Every other event — the merge
  # gate's own pull_request call, a dispatch, a release caller — skips the
  # decision, so `reuse` is empty and every job below runs its original steps
  # on its original runner. The verifier always exits 0 and any doubt is
  # `reuse=false`: a missing, partial, stale, uncertified or mismatched proof
  # means the full lane, never approval. It reads the GitHub API (hence the
  # read-only actions/pull-requests grants) and runs nothing it downloads.
  # Never red (`continue-on-error`), and nothing below depends on how it
  # ended: every original job's condition is an explicit `!cancelled()` over
  # its OWN needs, so a failed setup step, a timeout or a skipped dependency
  # here leaves `reuse` empty and the whole lane runs in full.
  # `!cancelled()`: a failed, timed-out or skipped dependency must not skip
  # this job either. It then decides `reuse=false`.
  evidence:
    needs: [screen, certify-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Promoted ONLY by the handover, after the witness was kept: a decision
    # whose upload failed or timed out, or whose retained file is missing or
    # not the decided witness, never reaches the jobs below.
    outputs:
      reuse: ${{ steps.handover.outputs.reuse }}
      witness: ${{ steps.handover.outputs.witness }}
    steps:
      - name: Check out the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Take the certify jobs' certificates (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CI_EVIDENCE_CERTIFICATES_MACOS: ${{ needs['certify-macos'].outputs.certificates }}
        run: node scripts/ci/ci-evidence-toolchain.mjs import --dir "$RUNNER_TEMP/ci-evidence-current"
      - name: Does the merged pull request's full proof cover this main tree?
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_CURRENT_TOOLCHAIN_DIR: ${{ runner.temp }}/ci-evidence-current
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/ios.json
        run: node scripts/ci/ci-evidence.mjs witness ios >> "$GITHUB_OUTPUT"
      - name: Keep the witness (reuse only)
        id: keep
        if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-witness-ios-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-witness
          if-no-files-found: error
          retention-days: 30
      - name: Hand the decision to the lane only once its witness is kept
        id: handover
        if: steps.verify.outputs.reuse == 'true' && steps.keep.outcome == 'success'
        env:
          CI_EVIDENCE_WITNESS: ${{ steps.verify.outputs.witness }}
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/ios.json
        run: node scripts/ci/ci-evidence.mjs handover >> "$GITHUB_OUTPUT"
  # (end of the PR→main evidence jobs; everything above was generated by scripts/ci/ci-evidence-view.mjs)

  # These jobs deliberately have no `needs:` edges. The previous single job
  # spent about 37 minutes serially doing ~2 minutes of guards, ~5 minutes of
  # builds, ~22 minutes of UI smoke and ~7 minutes of transfer acceptance. The
  # independent evidence classes now run concurrently as four jobs — the UI
  # class as two, one per shell shape, because a compact iPhone and a
  # regular-width iPad answer different questions. The iPhone UI job is itself
  # two complementary matrix shards (see `ios-ui-smoke`). The reusable workflow
  # still fails closed if any job fails, so this changes wall-clock time rather
  # than coverage.
  ios-build:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 30
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm ios
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      # The App Store candidate script's contract, driven with `xcodebuild` and
      # `xcrun` stubs -- what it REFUSES is its whole value. It lives here rather
      # than on the unfiltered lane because it requires macOS: it exits 2 off
      # Darwin and reads what it generated with `plutil`. It needs no Xcode
      # selection, so it runs before that step and costs seconds.
      - name: the App Store candidate script still refuses what it must
        if: needs.evidence.outputs.reuse != 'true'
        run: bash scripts/test/ios-app-store-candidate-test.sh
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        if: needs.evidence.outputs.reuse != 'true'
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      # No `swift test` here, on purpose. The package's guard tests over this
      # tree — project file, privacy manifest, signing, icons, plists, `.strings`
      # catalogs — ran in this job until 2026-09-21 as ten hand-kept `--filter`
      # selectors. `swift-package.yml` now starts on `apps/ios/**` and runs the
      # WHOLE suite, so that list was a strict and drifting subset of it and a
      # second package build on this runner. `scripts/test/ci-event-policy-test.mjs`
      # section 6k holds both halves: the package lane starts on every class of
      # file those guards read, and this workflow does not grow the step back.
      # `generic/platform=iOS Simulator` builds for the simulator SDK without
      # booting a device or needing a runtime download.
      - name: Build (unsigned, iOS Simulator)
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO build
      # TestFlight uses the device Release graph, not the simulator Debug graph.
      # Keep signing disabled here so forks can still exercise the compiler,
      # while catching release-only settings and device-SDK failures before an
      # archive consumes a build number.
      - name: Build (unsigned, iOS Device Release)
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-ios-release" \
            CODE_SIGNING_ALLOWED=NO build
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile macos-xcode --lane ios --job ios-build --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-ios-ios-build-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # The COMPACT shell, on an iPhone, running the whole UI target — as two
  # complementary shards on two runners rather than one serial run.
  #
  # It is deliberately the whole target and deliberately an iPhone: this is the
  # shape most of the suite is written for, and most of it asserts nothing about
  # size class. `AdaptiveShellUITests` is the exception — every one of its cases
  # opens with `guard waitForShell(app) == .regular else { throw XCTSkip(…) }`,
  # so on this job the class runs, skips, and reports green. `ios-ipad-shell`
  # below is the job that actually executes it; neither job stands in for the
  # other, and `scripts/test/ci-event-policy-test.mjs` sections 6k and 6q hold
  # both.
  #
  # ## The two shards, and why they are a partition by construction
  #
  # One serial run took 34.6 min on the last pull request measured
  # (2026-10-01): AppShellUITests about 16.0 min of execution, every other
  # class together about 11.7. So the split is at that one class boundary:
  #
  #   app-shell   -only-testing:RelayiumUITests/AppShellUITests
  #   complement  -only-testing:RelayiumUITests
  #               -skip-testing:RelayiumUITests/AppShellUITests
  #
  # The complement names the TARGET minus one class, never the remaining
  # classes, so a class added to RelayiumUITests lands in it with no edit here.
  # A hand-kept list — the shape `macos.yml`'s UI shards use — is exactly the
  # list a new class silently falls out of. Section 6u of the policy test
  # evaluates both selections against the classes declared on disk and fails
  # unless they are disjoint and together the whole target.
  #
  # Selection is not proof, and here it specifically is not: `man xcodebuild`
  # says `-only-testing` takes precedence over `-skip-testing`. So each shard
  # then reads its own result bundle and fails unless it executed tests, at
  # least one of them passed, and every executed case sits on its side of the
  # boundary — no AppShellUITests case in the complement, nothing else in
  # app-shell. A toolchain that ignored the skip would turn the complement red,
  # not quietly run the class twice.
  #
  # Cost, stated rather than hidden: each shard pays its own checkout, Xcode
  # selection, simulator boot and UI-target build, estimated at about 6.9
  # extra PAID runner-minutes per run (~20%) for an estimated 34.6 → 22.9 min
  # critical path. Both numbers are estimates until hosted runs measure them.
  # The policy test fixes the shard count at two, so this cannot become a
  # general fan-out by a one-line matrix edit.
  #
  # Budgets, from the last ten `main` runs (2026-09-28) of the unsharded job:
  # 28.1–39.9 min, so the old 45-minute ceiling was within five minutes of an
  # ordinary slow runner. 48 for the test step inside it, so a hang ends as a
  # FAILED step with its result bundle written rather than as a job timeout
  # (reported `cancelled`); and 300 s per test, five times the slowest single
  # case observed. Each shard keeps the unsharded bounds until hosted shard
  # timings justify lowering them. 65 for the job: the step bounds in order —
  # Xcode selection 10, simulator preparation 5, test 48 — plus 2 for checkout,
  # the shard proof and the uploads, so no earlier step's ceiling can spend the
  # test step's 48.
  ios-ui-smoke:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 65
    strategy:
      # One shard failing must not cancel the other: its own result, and its
      # own result bundle, are the other half of the evidence.
      fail-fast: false
      matrix:
        shard: [app-shell, complement]
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm ios
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        if: needs.evidence.outputs.reuse != 'true'
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      # The simulator the test step drives is booted, and waited for, here:
      # `simctl bootstatus -b` boots the device if it is not booted yet and
      # returns once it has finished booting. That is a boot barrier and nothing
      # more — it does not promise the accessibility services UI testing needs
      # are ready. Its own 5-minute bound means a boot that never finishes fails
      # this step, so the test step (no status function in its `if`) is skipped
      # instead of spending its 48 minutes. The device is handed on only after
      # the boot succeeded. Selection rule unchanged: the first available iPhone
      # of the listing, the rule the toolchain registry pins.
      - name: Boot the selected iPhone simulator
        if: needs.evidence.outputs.reuse != 'true'
        id: iphone_sim
        timeout-minutes: 5
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j \
            | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          print(next(device["udid"]
                     for devices in data["devices"].values()
                     for device in devices
                     if device.get("isAvailable")
                     and device.get("name", "").startswith("iPhone")))')"
          [ -n "$device_id" ] || {
            echo "::error::no available iPhone Simulator runtime"; exit 1; }
          # The listing travels as an argument: with `python3 -` the heredoc is
          # the program on stdin, so stdin cannot also carry the JSON.
          listing="$(xcrun simctl list devices available -j)"
          device_label="$(/usr/bin/python3 - "$device_id" "$listing" <<'PY'
          import json, sys
          udid = sys.argv[1]
          data = json.loads(sys.argv[2])
          hits = [(device.get("name", ""), runtime)
                  for runtime, devices in data["devices"].items()
                  for device in devices
                  if device.get("udid") == udid]
          if len(hits) != 1:
              sys.exit(f"::error::the selected simulator {udid} is not exactly one listed device")
          print(f"{hits[0][0]} {hits[0][1]}")
          PY
          )"
          echo "Compact destination: $device_label ($device_id)"
          echo "Boot started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          xcrun simctl bootstatus "$device_id" -b
          echo "Boot finished $(date -u +%Y-%m-%dT%H:%M:%SZ) after ${SECONDS}s"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS primary-task UI smoke
        if: needs.evidence.outputs.reuse != 'true'
        id: ui_smoke
        timeout-minutes: 48
        env:
          UI_SHARD: ${{ matrix.shard }}
          DEVICE_ID: ${{ steps.iphone_sim.outputs.device_id }}
        run: |
          set -euo pipefail
          [[ "${DEVICE_ID:-}" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]] || {
            echo "::error::no booted iPhone Simulator was handed over (DEVICE_ID '${DEVICE_ID:-}')"; exit 1; }
          device_id="$DEVICE_ID"
          ui_test=(-project apps/ios/Relayium.xcodeproj -scheme Relayium
            -destination "platform=iOS Simulator,id=$device_id"
            -derivedDataPath "$RUNNER_TEMP/dd-ios"
            -resultBundlePath "$RUNNER_TEMP/ios-ui-smoke-$UI_SHARD.xcresult"
            -test-timeouts-enabled YES
            -default-test-execution-time-allowance 300
            -maximum-test-execution-time-allowance 300)
          case "$UI_SHARD" in
            app-shell)
              xcodebuild "${ui_test[@]}" \
                -collect-test-diagnostics never \
                -only-testing:RelayiumUITests/AppShellUITests test
              ;;
            complement)
              xcodebuild "${ui_test[@]}" \
                -skip-testing:RelayiumUITests/AppShellUITests \
                -only-testing:RelayiumUITests test
              ;;
            *)
              echo "::error::unknown UI shard '$UI_SHARD'; it would select nothing"
              exit 1
              ;;
          esac
      # `xcodebuild … test` exits 0 for a selection that matched nothing or
      # skipped everything, and the selection above is not self-evidently
      # disjoint. So the bundle's own record is the evidence: the counts say
      # something ran, and the per-case classes say it was this shard's half.
      # The executed-case count must also equal the summary's total, so a
      # misread of the bundle's shape fails here rather than passing on an
      # empty walk.
      - name: Prove the shard executed exactly its half of the UI target
        if: needs.evidence.outputs.reuse != 'true'
        id: ui_shard_proof
        env:
          UI_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/ios-ui-smoke-$UI_SHARD.xcresult"
          xcrun xcresulttool get test-results summary \
            --path "$bundle" --format json > "$RUNNER_TEMP/ui-summary.json"
          xcrun xcresulttool get test-results tests \
            --path "$bundle" --format json > "$RUNNER_TEMP/ui-tests.json"
          /usr/bin/python3 - "$UI_SHARD" "$RUNNER_TEMP/ui-summary.json" "$RUNNER_TEMP/ui-tests.json" <<'PY'
          import json, sys
          shard, summary_path, tests_path = sys.argv[1:4]
          boundary = "AppShellUITests"
          with open(summary_path) as handle:
              summary = json.load(handle)
          total = summary.get("totalTestCount", 0)
          passed = summary.get("passedTests", 0)
          skipped = summary.get("skippedTests", 0)
          failed = summary.get("failedTests", 0)
          if total <= 0:
              sys.exit(f"::error::{shard}: the run executed no tests at all; its selection matched nothing")
          if passed <= 0:
              sys.exit(f"::error::{shard}: none of {total} case(s) passed; a fully skipped shard proves nothing")
          cases = []
          def walk(node, suite):
              kind = node.get("nodeType")
              if kind == "Test Suite":
                  suite = node.get("name")
              if kind == "Test Case":
                  identifier = node.get("nodeIdentifier") or ""
                  cases.append(suite or identifier.split("/")[0])
                  return
              for child in node.get("children") or []:
                  walk(child, suite)
          with open(tests_path) as handle:
              for node in json.load(handle).get("testNodes") or []:
                  walk(node, None)
          if len(cases) != total:
              sys.exit(f"::error::{shard}: the bundle lists {len(cases)} test case(s) but its summary counts {total}; "
                       "the per-class proof cannot be trusted")
          classes = sorted(set(cases))
          if shard == "app-shell":
              stray = [name for name in classes if name != boundary]
              if stray or boundary not in classes:
                  sys.exit(f"::error::app-shell executed {classes}; it must execute {boundary} and nothing else")
          elif shard == "complement":
              if boundary in classes:
                  sys.exit(f"::error::complement executed {boundary}, which belongs to app-shell alone; "
                           "the -skip-testing exclusion was not applied")
          else:
              sys.exit(f"::error::unknown UI shard {shard!r}")
          print(f"{shard}: {total} case(s), {passed} passed, {skipped} skipped, {failed} failed; "
                f"classes: {', '.join(classes)}")
          PY
      # On failure AND on cancellation (a job-level timeout reports as
      # `cancelled`, and `failure()` is false then) — never on success or when
      # the test step never started. Also when the shard proof failed: a bundle
      # that ran the wrong half is the evidence of what it ran. The artifact
      # name carries the shard, so the two halves of one run cannot collide.
      - name: Retain UI smoke diagnosis
        if: always() && needs.evidence.outputs.reuse != 'true' && (contains(fromJSON('["failure","cancelled"]'), steps.ui_smoke.outcome) || always() && steps.ui_shard_proof.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-smoke-diagnosis-${{ matrix.shard }}
          path: ${{ runner.temp }}/ios-ui-smoke-${{ matrix.shard }}.xcresult
          retention-days: 7
          if-no-files-found: error
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile macos-xcode-iphone --lane ios --job ios-ui-smoke --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-ios-ios-ui-smoke-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

  # The REGULAR-width shell, on an iPad, running exactly one class.
  #
  # ## The gap this job closes
  #
  # `AdaptiveShellUITests` covers the `NavigationSplitView` a full-width iPad
  # gets: the sidebar's destination list, the absence of a tab bar beside it,
  # the detail column building for every destination, and a stored link
  # presenting over the split view. None of that exists on an iPhone, and the
  # class says so by skipping rather than by asserting nothing — which is the
  # honest shape, and also the one that made the coverage loss invisible. The
  # only job that ran the UI target selected an iPhone, so every case in this
  # class skipped on every run and the lane reported green for a layout no
  # hosted run had ever executed.
  #
  # An iPad is chosen here for that reason alone: full-screen iPadOS is where
  # `horizontalSizeClass` is `.regular`, and it is the only simulator shape on
  # this image that reaches the branch.
  #
  # ## Why one class and not the target
  #
  # Running `-only-testing:RelayiumUITests` here would re-run every compact-shell,
  # local-session and pairing case on a second PAID macOS runner for no second
  # answer — the size class is the only variable that differs, and those cases
  # do not read it. The scope is the class that skips on the other job.
  #
  # ## Why the summary is read afterwards
  #
  # `xcodebuild … test` exits 0 when every selected case SKIPS, which is exactly
  # the failure this job exists for: an iPad that boots into a compact shell, a
  # `waitForShell` that times out into `.compact`, or a future `-destination`
  # edit back to an iPhone would each leave the job green while proving nothing.
  # So the result bundle's own counts are asserted: at least one test ran, and
  # none of them skipped.
  ios-ipad-shell:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.evidence.outputs.reuse == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 50
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm ios
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      # Nothing below this step may compile against the runner image's default
      # Xcode, or against an untested newer major. One shared script, declared
      # in the `env:` block above.
      - name: Select and verify the Xcode 26 upload toolchain
        if: needs.evidence.outputs.reuse != 'true'
        timeout-minutes: 10
        run: ${{ env.RELAYIUM_SELECT_XCODE }}
      # Same boot barrier as ios-ui-smoke, and the same limits: it waits for
      # the boot to finish, makes no promise about UI-testing readiness, and
      # hands the device on only after it booted. Selection rule unchanged.
      - name: Boot the selected iPad simulator
        if: needs.evidence.outputs.reuse != 'true'
        id: ipad_sim
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # SORTED, not "the first one the JSON happens to list". The image's
          # device set changes without a commit here, and an unordered pick
          # would make a rerun of the same SHA a different run. The tuple is
          # (name, runtime, udid) so the choice is stable by product name first
          # and only tie-broken by things that rotate.
          selection="$(xcrun simctl list devices available -j \
            | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          pads = sorted(
              (device["name"], runtime, device["udid"])
              for runtime, devices in data["devices"].items()
              for device in devices
              if device.get("isAvailable")
              and device.get("name", "").startswith("iPad"))
          if pads:
              name, runtime, udid = pads[0]
              print(udid, name, runtime)')"
          [ -n "$selection" ] || {
            echo "::error::no available iPad Simulator runtime; the regular-width shell has no destination on this image and this job must not fall back to a compact one"
            exit 1; }
          read -r device_id device_label <<<"$selection"
          echo "Regular-width destination: $device_label ($device_id)"
          echo "Boot started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          xcrun simctl bootstatus "$device_id" -b
          echo "Boot finished $(date -u +%Y-%m-%dT%H:%M:%SZ) after ${SECONDS}s"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      # 30 of the job's 50 minutes: the last ten `main` runs took 6.8–12.6 min
      # for the whole job. The job bound is the step bounds in order — Xcode
      # selection 10, simulator preparation 5, test 30 — plus 5 for checkout,
      # the run proof and the uploads. Same per-test allowance as ios-ui-smoke.
      - name: Run the regular-width adaptive shell on an iPad simulator
        if: needs.evidence.outputs.reuse != 'true'
        id: ipad_shell
        timeout-minutes: 30
        env:
          DEVICE_ID: ${{ steps.ipad_sim.outputs.device_id }}
        run: |
          set -euo pipefail
          [[ "${DEVICE_ID:-}" =~ ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$ ]] || {
            echo "::error::no booted iPad Simulator was handed over (DEVICE_ID '${DEVICE_ID:-}')"; exit 1; }
          device_id="$DEVICE_ID"
          xcodebuild -project apps/ios/Relayium.xcodeproj -scheme Relayium \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/dd-ios-ipad" \
            -resultBundlePath "$RUNNER_TEMP/ios-ipad-shell.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:RelayiumUITests/AdaptiveShellUITests test
      - name: Prove the regular-width cases ran rather than skipped
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          summary="$(xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/ios-ipad-shell.xcresult" --format json)"
          printf '%s\n' "$summary" | /usr/bin/python3 -c 'import json, sys
          summary = json.load(sys.stdin)
          total = summary.get("totalTestCount", 0)
          skipped = summary.get("skippedTests", 0)
          if total <= 0:
              sys.exit("::error::the iPad run executed no tests at all; -only-testing selected nothing")
          if skipped:
              sys.exit(
                  f"::error::{skipped} of {total} regular-width cases SKIPPED. "
                  "AdaptiveShellUITests skips whenever the shell is not regular width, "
                  "so this destination is not a full-width iPad and the job proved nothing.")
          print(f"regular-width shell: {total} case(s), 0 skipped")'
      - name: Retain iPad shell diagnosis
        if: always() && needs.evidence.outputs.reuse != 'true' && (contains(fromJSON('["failure","cancelled"]'), steps.ipad_shell.outcome))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipad-shell-diagnosis
          path: ${{ runner.temp }}/ios-ipad-shell.xcresult
          retention-days: 7
          if-no-files-found: error
      # PR→main evidence: the toolchain this job actually ran on, captured after
      # every tool it used (scripts/ci/ci-evidence-toolchain.mjs). An unknown
      # toolchain uploads nothing, and a job without a certificate is never
      # witnessed; the tests above are unaffected either way.
      - name: Certify this job's toolchain
        if: needs.evidence.outputs.reuse != 'true'
        shell: bash
        env:
          CI_EVIDENCE_JOB_INDEX: ${{ strategy.job-index }}
          CI_EVIDENCE_JOB_TOTAL: ${{ strategy.job-total }}
          CI_EVIDENCE_MATRIX: ${{ toJSON(matrix) }}
        run: node scripts/ci/ci-evidence-toolchain.mjs capture --role source --profile macos-xcode-ipad --lane ios --job ios-ipad-shell --out "$RUNNER_TEMP/ci-evidence-toolchain/toolchain.json"
      - name: Keep this job's toolchain certificate
        if: needs.evidence.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-toolchain-ios-ios-ipad-shell-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-toolchain/toolchain.json
          if-no-files-found: ignore
          retention-days: 7

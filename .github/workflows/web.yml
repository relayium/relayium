name: web
# The path filter also names the SERVER packages the Device Inbox gates below
# actually execute. Those two jobs run real Go code — the receiver's sealed-box
# implementation and a whole live server — so a change to either half can break
# them, and only listing `web/**` would let a server-side change land with a
# green board while the cross-implementation contract was already broken.
#
# Deliberately surgical rather than `server/**`: everything else in the server
# is covered by its own workflow, and widening this one would re-run the full
# web suite plus the accessibility scan on every unrelated backend change.
on:
  push:
    # Only `main`. A branch push used to start this workflow AND its pull
    # request start a second, identical run of the same commit. The
    # pull_request trigger below is what gates branch work; this one exists so
    # `main` itself is never unverified.
    branches:
      - main
    paths: &paths
      - 'web/**'
      - 'server/internal/inbox/**'
      - 'server/internal/inboxclient/**'
      - 'server/account/deviceinbox*'
      - 'server/account/taskobject.go'
      - 'server/account/files.go'
      - 'server/account/uploads_resumable.go'
      - '.github/workflows/web.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# `github.ref` is the obvious fallback and is WRONG here: it puts every `main`
# run in one group, and GitHub cancels an older PENDING run in a group when a
# newer one arrives even with `cancel-in-progress: false`. Two quick merges
# would silently drop the first commit's verification, and the branch would show
# a cancelled — not failed, not missing — check for a commit nobody tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # The runner image happens to ship a Go toolchain, which would make the
      # sealed-box interoperability suite self-enable inside this Node-only job.
      # It has its own job below, with a pinned toolchain; opting out here keeps
      # the decision explicit instead of dependent on the image contents.
      RELAYIUM_GO_INTEROP: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      # Runs immediately after build: the scanner serves web/dist and drives a real
      # headless Chrome, so it needs the freshly built output — an earlier position
      # would scan whatever dist happened to be lying around, or nothing at all.
      # Fails on any axe violation not claimed by e2e/a11y-allowlist.json (empty);
      # `incomplete` results are printed and never fail.
      - run: npm run test:a11y
      # Two real tabs in one real pairing-code room, driving the freshly built
      # dist through a controlled rendezvous/ICE fixture. It is the ONLY gate
      # that executes the promoted routing decision — a code-room peer that
      # announces link/1 now gets the unified workspace instead of the legacy
      # file-or-text fork — end to end: one action, one SAS, a composer with
      # file/folder controls, text and a real file over the SAME connection,
      # Arabic RTL at 390px, and teardown.
      #
      # It cannot skip: the harness resolves a browser or throws, and the
      # fixture serves the built dist or fails to start. A missing Chrome is a
      # red build here, never a silent pass.
      - run: npm run test:e2e:code-room
      # Same real Chrome, same freshly built dist, one question the axe scan
      # cannot answer: is the feature FINDABLE. It walks /cli → My Devices →
      # rename → revoke at 1440×900, 390×844 and in Arabic RTL. It caught three
      # defects no unit test could have — a language-prefixed /cli link that
      # 404s in eight locales, an anchor the SPA never scrolls to, and a CTA
      # styled as a heading.
      - run: npm run test:device-discovery
      # A separate findability journey for the first-class Device Inbox route:
      # / → Device Inbox → server setup/account action at desktop, 390px and RTL.
      # Keep it as its own step so a discovery failure cannot hide this signal.
      - run: npm run test:device-inbox-entry
      - run: npm audit --audit-level=high

  # A sealed box produced by the REAL browser implementation, opened by the REAL
  # Go device implementation, in one run. Both halves execute; nothing here is a
  # frozen vector or a self round trip. The suite also requires a deliberately
  # tampered box to FAIL, so a harness that silently stopped proving anything is
  # itself a red build.
  sealed-box-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      # RELAYIUM_GO_INTEROP=1 (set by the script) makes a skip impossible: if the
      # toolchain is missing the suite fails instead of quietly reporting green.
      - run: npm run test:interop

  # Browser -> central -> CLI -> disk, with nothing simulated: a real server on a
  # temporary database, a real `relayium inbox` worker holding its own X25519
  # private key, and a real headless Chrome doing the encryption and the drop.
  # This is the only gate that can show "uploaded is not saved", because it is
  # the only one with a receiver that has genuinely not saved anything yet.
  device-inbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      # The script serves web/dist through the real server, so the build has to
      # exist before it runs — the same ordering constraint as the a11y scan.
      - run: npm run build
      - run: npm run test:device-inbox

  windows-temporary-downloader:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Executes the exact generated PowerShell against the pinned official
      # Windows artifact. The CLI then reaches a deliberate local connection
      # failure, proving verification/extraction/execution and finally cleanup.
      - run: npx vitest run src/lib/temp-downloader-windows.test.ts

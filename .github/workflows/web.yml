name: web
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      # Runs immediately after build: the scanner serves web/dist and drives a real
      # headless Chrome, so it needs the freshly built output — an earlier position
      # would scan whatever dist happened to be lying around, or nothing at all.
      # Fails on any axe violation not claimed by e2e/a11y-allowlist.json (empty);
      # `incomplete` results are printed and never fail.
      - run: npm run test:a11y
      - run: npm audit --audit-level=high

  windows-temporary-downloader:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Executes the exact generated PowerShell against the pinned official
      # Windows artifact. The CLI then reaches a deliberate local connection
      # failure, proving verification/extraction/execution and finally cleanup.
      - run: npx vitest run src/lib/temp-downloader-windows.test.ts

name: release
on:
  push:
    tags:
      - 'v*'
  # Invoked with a tag ref by auto-release.yml, and available for a manual
  # re-run of a tag whose first attempt failed.
  #
  # This is not redundant with the trigger above. A tag pushed by a workflow
  # using the default GITHUB_TOKEN does NOT start another workflow — GitHub
  # suppresses it to stop recursion — so auto-release can create the tag and
  # then has to say so out loud. Without this entry the tag would appear and
  # nothing would build it, which is a worse failure than not tagging at all:
  # the version looks released and no artifact exists.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # OIDC token for the SLSA build-provenance attestation
  attestations: write   # write SLSA build-provenance attestations for the release artifacts

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (with the human-readable
      # version in a trailing comment) so a compromised or retagged upstream release
      # can't silently change what runs in this trusted, token-holding workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Materialize the release signing key (RELAYIUM_RELEASE_KEY secret, a PEM
      # EC private key) to a 0600 temp file. goreleaser's `signs` block signs
      # checksums.txt with it via openssl. Fails loudly if the secret is unset so
      # a release is never silently published unsigned once signing is expected.
      - name: Materialize release signing key
        env:
          RELAYIUM_RELEASE_KEY: ${{ secrets.RELAYIUM_RELEASE_KEY }}
        run: |
          if [ -z "$RELAYIUM_RELEASE_KEY" ]; then
            echo "::error::RELAYIUM_RELEASE_KEY secret is not set — add it before tagging a release (see the release-signing runbook in relayium-ops)"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/relayium-release.key"
          ( umask 077; printf '%s\n' "$RELAYIUM_RELEASE_KEY" > "$keyfile" )
          echo "RELAYIUM_RELEASE_KEY_FILE=$keyfile" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/relayium-release.key"
      # SLSA build provenance for every distributable archive goreleaser produced.
      # Verifiable with: gh attestation verify <archive> --repo relayium/relayium
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/relayium_*.tar.gz
            dist/relayium_*.zip
            dist/relayium-node_*.tar.gz

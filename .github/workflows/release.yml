name: release
on:
  push:
    tags:
      # Narrowed from `v*`, which matched `vmacos-v1.2.0` — the malformed tag
      # the auto-release incident created and then dispatched a build for.
      # A leading digit is the cheapest way to keep another tag family out.
      #
      # This is a first cut, not the check. GitHub's filter globs cannot say
      # "digits only, exactly three components, nothing after": `v1.2.3-rc1`
      # and `v1.2.3.4` still match, and workflow_dispatch below ignores this
      # list entirely. The job re-checks the ref it actually got.
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # Invoked with a tag ref by auto-release.yml, and available for a manual
  # re-run of a tag whose first attempt failed.
  #
  # This is not redundant with the trigger above. A tag pushed by a workflow
  # using the default GITHUB_TOKEN does NOT start another workflow — GitHub
  # suppresses it to stop recursion — so auto-release can create the tag and
  # then has to say so out loud. Without this entry the tag would appear and
  # nothing would build it, which is a worse failure than not tagging at all:
  # the version looks released and no artifact exists.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # OIDC token for the SLSA build-provenance attestation
  attestations: write   # write SLSA build-provenance attestations for the release artifacts

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (with the human-readable
      # version in a trailing comment) so a compromised or retagged upstream release
      # can't silently change what runs in this trusted, token-holding workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # DEFENSE IN DEPTH, and the last step before this job becomes trusted:
      # everything below materializes the release signing key and hands the ref
      # to GoReleaser, which publishes a GitHub release named after it.
      #
      # Two ways in exist and neither is self-limiting. The push filter is a
      # glob, so it cannot reject `v1.2.3-rc1`; workflow_dispatch can be aimed
      # at ANY ref, including a branch, which would publish a "release" built
      # from an untagged commit. auto-release.yml no longer produces a
      # malformed tag, but it was never the only thing that can create one —
      # a hand-pushed or mistyped tag arrives here indistinguishably.
      #
      # The check is the same matcher auto-release bumps versions with, so the
      # two ends cannot drift into disagreeing about what a server tag is.
      #
      # It is not a defence against someone who can already push here: a
      # push-triggered run uses the workflow and scripts from the pushed ref,
      # so they could change both. It stops the accident and the stray tag,
      # which is what actually happened.
      - name: Refuse any ref that is not a canonical server tag
        run: |
          set -eu
          if ! tag="$(sh scripts/release/server-tag.sh validate-ref "$GITHUB_REF")"; then
            echo "::error::refusing to build and sign a release from '$GITHUB_REF' — re-run this workflow against a v<major>.<minor>.<patch> tag"
            exit 1
          fi
          echo "Building release **$tag** from \`$GITHUB_REF\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Materialize the release signing key (RELAYIUM_RELEASE_KEY secret, a PEM
      # EC private key) to a 0600 temp file. goreleaser's `signs` block signs
      # checksums.txt with it via openssl. Fails loudly if the secret is unset so
      # a release is never silently published unsigned once signing is expected.
      - name: Materialize release signing key
        env:
          RELAYIUM_RELEASE_KEY: ${{ secrets.RELAYIUM_RELEASE_KEY }}
        run: |
          if [ -z "$RELAYIUM_RELEASE_KEY" ]; then
            echo "::error::RELAYIUM_RELEASE_KEY secret is not set — add it before tagging a release (see the release-signing runbook in relayium-ops)"
            exit 1
          fi
          keyfile="$RUNNER_TEMP/relayium-release.key"
          ( umask 077; printf '%s\n' "$RELAYIUM_RELEASE_KEY" > "$keyfile" )
          echo "RELAYIUM_RELEASE_KEY_FILE=$keyfile" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/relayium-release.key"
      # SLSA build provenance for every distributable archive goreleaser produced.
      # Verifiable with: gh attestation verify <archive> --repo relayium/relayium
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/relayium_*.tar.gz
            dist/relayium_*.zip
            dist/relayium-node_*.tar.gz

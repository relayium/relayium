name: macos
# The macOS half of the native product. The iOS half is `ios.yml`.
#
# This file used to carry an `ios-build` job and the iOS acceptance, so the two
# platforms could not be told apart: `apps/**` and `scripts/**` in the filter
# meant every iOS-only change started the macOS signing lane and every
# macOS-only change started an iOS runner. Path filters are per-workflow, so
# separating them required separating the FILES; the iOS job moved out whole and
# unedited except for its trigger condition.
#
# What each tree in the filter is an input TO:
#
#   apps/mac/**          the app, its Share extension, its UI tests and every
#                        release script this workflow runs
#   apps/RelayiumKit/**  the SHARED package this workflow's app targets compile
#                        against; deliberately in this filter AND in ios.yml's,
#                        because a change there can break either app alone
#
# …minus one subtree. `!apps/RelayiumKit/Tests/**` follows the line above, and
# GitHub evaluates a `paths:` list per file in order with the LAST match
# winning, so the package's SOURCE still starts this workflow and the package's
# own XCTest target and fixtures no longer do. Nothing under
# `apps/RelayiumKit/Tests/` is compiled by `apps/mac/Relayium.xcodeproj`, read
# by any release script here, or linked into the signed product — the app
# targets build the package's library products, not its test target — so a
# test-only edit used to start this whole workflow, and the `signed-build`
# lane's `needs:` chain with it, to produce no evidence about the change at all.
#
# That subtree is not unwatched: `.github/workflows/swift-package.yml` owns the
# package's own suite, has no such exclusion, and runs the repository's one
# unfiltered `swift test`. A MIXED diff — a source file and a test file in the
# same commit — still starts this workflow, because the source file is still a
# positive match and one match is enough.
#
# `scripts/**` is deliberately GONE. After the move, no job in this file reads
# anything under `scripts/` — the three acceptance runs that did are the iOS
# job's, and they moved with it. Re-adding it would restart macOS signing runs
# on Go-shard and pairing-script edits.
#
# `apps/` top-level files (`apps/README.md`, `apps/LICENSE`) no longer trigger
# either native workflow. That is intentional: neither is an input to any build
# or test here, and `apps/**` was matching them only because it was coarse.
#
# workflow_dispatch is the manual escape hatch, and the only way to reach the
# notarization, release-staging and publication jobs below.
on:
  push:
    # Only `main`. A branch push used to start this workflow AND its pull
    # request start a second, identical run of the same commit. The
    # pull_request trigger below is what gates branch work; this one exists so
    # `main` itself is never unverified.
    branches:
      - main
    # Defined once and aliased below, the way `web.yml` and
    # `native-web-pairing.yml` already do it. The two lists were previously
    # maintained by hand, which is how a `push` filter and a `pull_request`
    # filter drift into a gate that passes on the branch and never runs after
    # the merge.
    #
    # ORDER IS LOAD-BEARING. GitHub applies these per file, in order, and the
    # last pattern that matches decides — so the negation has to follow
    # `apps/RelayiumKit/**`, never precede it. Reordering the two lines makes
    # the exclusion match first and be overridden immediately after, which
    # leaves the filter valid, leaves actionlint happy, and silently restores
    # the behaviour this entry exists to remove.
    paths: &paths
      - 'apps/mac/**'
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Submit the signed DMG to Apple, staple it, and run Gatekeeper verification'
        required: true
        default: false
        type: boolean
      validate_notary_credentials:
        description: 'Authenticate to Apple without submitting software'
        required: true
        default: false
        type: boolean
      validate_sparkle_key:
        description: 'Sign a disposable appcast entry and prove the update key matches the app'
        required: true
        default: false
        type: boolean
      release_version:
        description: 'Stage immutable public-release metadata for this app version (for example 1.0)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish the versioned GitHub Release and deliver its appcast/download metadata to main'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# This REPLACES a `macos-${{ github.sha }}` group whose cancel-in-progress was
# `github.event_name == 'workflow_dispatch'`, i.e. a release dispatch cancelled
# the push verification of the same commit. That saved a runner and cost
# release trust in both directions:
#
#   * `push` is now restricted to `main`, so the duplicate that grouping existed
#     to collapse — a branch push plus its pull request — no longer happens at
#     all, and the remaining `main` run is the one nobody should cancel;
#   * a `github.sha` group is shared by every dispatch for that SHA, and GitHub
#     cancels an older PENDING run in a group even when cancel-in-progress is
#     false. A second dispatch could therefore drop a queued signing,
#     notarization or publication run for the same immutable source.
#
# Under run_id nothing outside a pull request can cancel anything, which is the
# correct default for a workflow that imports a Developer ID certificate and can
# publish an immutable GitHub Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: macos-15
    # Finite, and chosen rather than inherited. Outside a workflow_dispatch the
    # whole step below is skipped, so the job is a checkout; the 32 successful
    # runs in this workflow's recent history took 61s at worst and 24s on
    # average. Only a release dispatch reaches the one `xcodebuild
    # -showBuildSettings`, which reads the project rather than building it. The
    # bound is far above either path and exists for the third case: a wedged
    # `xcodebuild` gives a PAID macOS runner back in minutes instead of holding
    # it for GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate release contract
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NOTARIZE: ${{ inputs.notarize }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$RELEASE_VERSION" ]; then
              printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || exit 1
              [ "$NOTARIZE" = true ] || exit 1
              actual="$(xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium -showBuildSettings | awk '/MARKETING_VERSION =/{print $3; exit}')"
              [ "$actual" = "$RELEASE_VERSION" ] || { echo "::error::release $RELEASE_VERSION != MARKETING_VERSION $actual"; exit 1; }
            fi
            if [ "$PUBLISH_RELEASE" = true ]; then
              [ -n "$RELEASE_VERSION" ] && [ "$GITHUB_REF" = refs/heads/main ] || exit 1
              node apps/mac/scripts/check-release-readiness.mjs --require-approved
            fi
          fi

  # No secrets, so this runs on pull requests from forks like any other check.
  test:
    runs-on: macos-15
    # Finite, and chosen rather than inherited.
    #
    # This job used to be one unfiltered `swift test` over the shared package
    # PLUS the four release-script tests below, and the 59 successful runs in
    # recent history took 5.5 minutes at worst and 3.5 on average for both
    # halves together. The `swift test` moved to
    # `.github/workflows/swift-package.yml`; what is left is a checkout, two
    # `-version` probes and four shell tests that run entirely against mocked
    # `codesign`/`hdiutil`/`xcrun` binaries and build nothing.
    #
    # The remaining work is therefore bounded above by that same recorded 5.5
    # minutes — it is a strict subset of what produced it — and 10 is the
    # conservative bound chosen from that evidence rather than from a fresh
    # measurement this branch has not taken. It still turns a wedged run red in
    # minutes instead of holding a PAID macOS runner for GitHub's 6-hour
    # default. Re-measure and lower it once this shape has its own run history.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # The unfiltered `swift test` that used to run here now lives in
      # `.github/workflows/swift-package.yml`, which is the repository's sole
      # owner of it. It is not gone and it is not weaker: that workflow watches
      # `apps/RelayiumKit/**` with no exclusion, so it starts on strictly MORE
      # of the package than this filter does — including the test target and the
      # fixtures this one now excludes. `scripts/test/swift-ci-boundary-test.mjs`
      # asserts that exactly one unfiltered `swift test` exists and that it is
      # that job, so this comment cannot decay into a step that quietly went
      # missing.
      - name: Release script tests
        run: |
          apps/mac/scripts/test-package-dmg.sh
          apps/mac/scripts/test-resign-sparkle.sh
          apps/mac/scripts/test-notarize-dmg.sh
          apps/mac/scripts/test-release-readiness.sh

  # Needs the signing certificate, so it cannot run where secrets are
  # unavailable. This repository is public: a fork's pull request cannot read
  # repository secrets, and a job that tried would fail confusingly rather than
  # skip cleanly.
  # The complete product-flow suite is split only at XCTest class boundaries.
  # Both shards are mandatory; neither changes, skips, or weakens a test.
  ui-smoke:
    needs: [test, contract]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: app-shell
            tests: RelayiumUITests/AppShellUITests
            timeout: 30
          - shard: device-inbox
            tests: RelayiumUITests/DeviceInboxUITests,RelayiumUITests/SubscriptionUITests,RelayiumUITests/LocalSessionUITests
            timeout: 35
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Import UI signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12_BASE64" ] && [ -n "$CERT_PASSWORD" ] || exit 1
          keychain="$RUNNER_TEMP/ui-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/ui-cert.p12"
          ( umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert" )
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -P "$cert"
      - name: Install UI provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.MACOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$PROFILE_BASE64" ] && [ -n "$SHARE_PROFILE_BASE64" ] || exit 1
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$PROFILE_BASE64" | base64 --decode > "$dir/relayium.provisionprofile" )
          ( umask 077; printf '%s' "$SHARE_PROFILE_BASE64" | base64 --decode > "$dir/relayium-share.provisionprofile" )
      - name: Run macOS product-flow UI smoke (${{ matrix.shard }})
        id: ui_smoke
        env:
          TEST_CLASSES: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          only=()
          IFS=',' read -ra classes <<< "$TEST_CLASSES"
          for class in "${classes[@]}"; do only+=("-only-testing:$class"); done
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac-ui-${{ matrix.shard }}" \
            "${only[@]}" test
      - name: Upload macOS UI smoke failure evidence
        if: failure() && steps.ui_smoke.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-macos-ui-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dd-mac-ui-${{ matrix.shard }}/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Remove UI signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ui-signing.keychain-db" || true

  signed-build:
    needs: [test, contract]
    runs-on: macos-15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Finite, and chosen rather than inherited, with the widest headroom in this
    # file because this job has the widest spread. It builds TWO full xcodebuild
    # graphs — the Mac App Store target unsigned, then the signed Release — then
    # re-signs the Sparkle components, verifies signature and entitlements, and
    # packages and verifies the DMG. The 47 successful runs in recent history
    # ranged from about 15 minutes on average to 30.3 at worst, so the bound is
    # roughly twice the slowest real run rather than a round number. It has to
    # be a bound and not the default: this job imports the Developer ID
    # certificate, so a wedged run holds a PAID macOS runner with the signing
    # key materialized in a keychain on disk.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERT_P12_BASE64 / MACOS_SIGNING_CERT_PASSWORD are not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          certfile="$RUNNER_TEMP/cert.p12"
          ( umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$certfile" )
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$certfile" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without a partition list, codesign blocks on a GUI authorization
          # prompt nobody can click and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" > /dev/null
          # Put it on the search list without evicting the default keychain.
          current_keychains=()
          while IFS= read -r current; do
            current="${current#\"}"
            current="${current%\"}"
            current_keychains+=("$current")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${current_keychains[@]}"
          rm -P "$certfile"
          security find-identity -v -p codesigning "$keychain"
      # keychain-access-groups is the entitlement that makes a profile
      # mandatory — proven by building once without it, which succeeded. The
      # profile carries keychain-access-groups = <team>.* by default, so there
      # is nothing to configure on Apple's side beyond creating it.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::MACOS_PROVISIONING_PROFILE_BASE64 is not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$PROFILE_BASE64" | base64 --decode > "$dir/relayium.provisionprofile" )
          # Name, not UUID: PROVISIONING_PROFILE_SPECIFIER in the project names
          # "Relayium Mac", and a mismatch here fails at signing time with a
          # message that does not mention this step.
          security cms -D -i "$dir/relayium.provisionprofile" \
            | plutil -extract Name raw -o - -
      # A second profile, because the Share extension is a second bundle with its
      # own App ID and its own App Groups entitlement. Without it the signed
      # Release fails at the appex with "requires a provisioning profile", and
      # the message does not mention this step.
      - name: Install Share extension provisioning profile
        env:
          SHARE_PROFILE_BASE64: ${{ secrets.MACOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SHARE_PROFILE_BASE64" ]; then
            echo "::error::MACOS_SHARE_PROVISIONING_PROFILE_BASE64 is not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$SHARE_PROFILE_BASE64" \
            | base64 --decode > "$dir/relayium-share.provisionprofile" )
          # Name, not UUID, for the reason above: the appex's
          # PROVISIONING_PROFILE_SPECIFIER names "Relayium Mac Share Extension".
          security cms -D -i "$dir/relayium-share.provisionprofile" \
            | plutil -extract Name raw -o - -
      # A successful compile cannot prove that the App scene opens, sidebar
      # actions render the intended task, or Pairing Code stays on its owning
      # surface. This runs here because the app and Share extension entitlements
      # require the profiles installed above; stripping them for ad-hoc signing
      # produces a different app that cannot load UI automation. The Debug-only
      # launch argument keeps the hosted runner off the public Nearby rendezvous.
      # The Mac App Store product, built unsigned.
      #
      # UNSIGNED deliberately, and it is the only build here that is: this
      # target signs automatically, so Xcode resolves a Mac App Store
      # certificate and profile against the signed-in account — credentials this
      # workflow does not hold and must not create. What a compile CAN prove is
      # the half that breaks silently — that the shared source really does build
      # both ways through the distribution seam, that the App Store target's own
      # file links the StoreKit adapter, and that its Share extension embeds. The
      # linkage and entitlement claims are asserted from the project file and
      # the plists by `StoreKitLinkageTests` in the Swift suite above.
      #
      # Its own derived-data path, because both macOS products build a
      # `Relayium.app`: same app, two channels, so they share the product name
      # on purpose, and separate paths keep one build from replacing the
      # artifact a later step verifies.
      - name: Build (Mac App Store target, unsigned)
        run: |
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme RelayiumAppStore \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-mas" \
            CODE_SIGNING_ALLOWED=NO build
      # And the two absences that decide whether the submission is even
      # accepted, read off the built product rather than off the project.
      - name: Verify the App Store product embeds no updater
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd-mas/Build/Products/Release/Relayium.app"
          [ -d "$app" ] || { echo "::error::the App Store product was not built"; exit 1; }
          if [ -e "$app/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::the App Store build embeds Sparkle"; exit 1
          fi
          binary="$app/Contents/MacOS/Relayium"
          linked="$(otool -L "$binary")"
          printf '%s\n' "$linked"
          if printf '%s' "$linked" | grep -q Sparkle; then
            echo "::error::the App Store binary links Sparkle"; exit 1
          fi
          if ! printf '%s' "$linked" | grep -q StoreKit; then
            echo "::error::the App Store binary does not link StoreKit"; exit 1
          fi
          [ -d "$app/Contents/PlugIns/RelayiumShare.appex" ] || {
            echo "::error::the App Store build does not embed its Share extension"; exit 1; }
      # The two files Apple requires of a submission, read off the built product.
      #
      # Their CONTENT is decided by `MacPrivacyManifestTests`, which re-derives
      # the declarations from the source and the server storage they describe.
      # What no Swift test can see is whether each file reached the bundle Apple
      # actually opens: both app folders are synchronized, so membership is a
      # filesystem fact rather than a project edit, and a manifest dropped from a
      # target produces no diff, no build failure and no runtime symptom — just a
      # rejected upload.
      - name: Verify the App Store product ships both privacy manifests
        run: |
          bash apps/mac/scripts/verify-privacy-manifests.sh \
            "$RUNNER_TEMP/dd-mas/Build/Products/Release/Relayium.app" "App Store"
      - name: Build (signed, Release)
        run: |
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" build
      # Sparkle's prebuilt helpers carry distribution-inappropriate ad-hoc
      # signatures. A normal `build` does not replace those nested signatures,
      # so re-sign leaf-to-root and then restore the app's outer resource seal.
      - name: Re-sign Sparkle distribution components
        run: |
          apps/mac/scripts/resign-sparkle.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" \
            "Developer ID Application"
      # The reason this job exists. An entitlement regression compiles fine and
      # passes swift test; it shows up as a runtime Keychain failure weeks later
      # on somebody's machine.
      - name: Verify signature and entitlements
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app"
          codesign --verify --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/Relayium" -verify_arch arm64 x86_64 || {
            echo "::error::Release executable is not universal (arm64 + x86_64)"; exit 1; }
          signature_details="$(codesign -d --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature_details"
          printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime' || {
            echo "::error::Hardened Runtime flag missing from the signed build"; exit 1; }
          printf '%s\n' "$signature_details" | grep -q '^Timestamp=' || {
            echo "::error::Secure timestamp missing from the signed build"; exit 1; }
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          for component in \
            "$sparkle/Autoupdate" \
            "$sparkle/Updater.app" \
            "$sparkle/XPCServices/Installer.xpc" \
            "$sparkle/XPCServices/Downloader.xpc"; do
            details="$(codesign -d --verbose=4 "$component" 2>&1)"
            printf '%s\n' "$details"
            printf '%s\n' "$details" | grep -q 'TeamIdentifier=7PVYUG4YQS' || {
              echo "::error::Sparkle component is not signed by the Relayium team: $component"; exit 1; }
            printf '%s\n' "$details" | grep -q '^Timestamp=' || {
              echo "::error::Sparkle component has no secure timestamp: $component"; exit 1; }
          done
          # The Share extension is a separate signature, a separate entitlement
          # set and a separate notarization subject. Verifying the app alone
          # would pass while the appex inside it was unsigned, un-hardened, or
          # carrying an entitlement it has no business holding.
          appex="$app/Contents/PlugIns/RelayiumShare.appex"
          [ -d "$appex" ] || {
            echo "::error::the Share extension is not embedded in the signed app"; exit 1; }
          codesign --verify --strict --verbose=2 "$appex"
          appex_details="$(codesign -d --verbose=4 "$appex" 2>&1)"
          printf '%s\n' "$appex_details"
          printf '%s\n' "$appex_details" | grep -q 'flags=.*runtime' || {
            echo "::error::Hardened Runtime flag missing from the Share extension"; exit 1; }
          printf '%s\n' "$appex_details" | grep -q '^Timestamp=' || {
            echo "::error::Secure timestamp missing from the Share extension"; exit 1; }
          appex_ents="$(codesign -d --entitlements - --xml "$appex" | plutil -convert xml1 -o - -)"
          printf '%s\n' "$appex_ents"
          printf '%s' "$appex_ents" | grep -q '7PVYUG4YQS.com.relayium.shared' || {
            echo "::error::Share extension is not in the app's App Group"; exit 1; }
          # The absences are the point: a staging process that gains the network
          # or the Keychain stops being one.
          for forbidden in keychain-access-groups network.client network.server \
            associated-domains applesignin; do
            if printf '%s' "$appex_ents" | grep -q "$forbidden"; then
              echo "::error::Share extension claims $forbidden; it only stages files"; exit 1
            fi
          done
          ents="$(codesign -d --entitlements - --xml "$app" | plutil -convert xml1 -o - -)"
          printf '%s\n' "$ents"
          printf '%s' "$ents" | grep -q 'com.apple.security.application-groups' || {
            echo "::error::app is not in the App Group its Share extension writes to"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.apple.security.app-sandbox' || {
            echo "::error::app-sandbox entitlement missing from the signed build"; exit 1; }
          # The expanded value, not $(AppIdentifierPrefix): an unexpanded prefix
          # means the team never applied, and the app would fail at runtime.
          printf '%s' "$ents" | grep -q '7PVYUG4YQS.com.relayium.shared' || {
            echo "::error::keychain access group missing or unexpanded in the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'applinks:relayium.com' || {
            echo "::error::relayium.com Associated Domain missing from the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.relayium.mac-spks' || {
            echo "::error::Sparkle installer server entitlement missing from the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.relayium.mac-spki' || {
            echo "::error::Sparkle installer client entitlement missing from the signed build"; exit 1; }
          [ "$(plutil -extract SUEnableInstallerLauncherService raw -o - "$app/Contents/Info.plist")" = true ] || {
            echo "::error::Sparkle Installer.xpc is not enabled"; exit 1; }
          [ "$(plutil -extract SUFeedURL raw -o - "$app/Contents/Info.plist")" = \
            "https://relayium.com/apps/macos/appcast.xml" ] || {
            echo "::error::Sparkle feed URL is missing or unexpected"; exit 1; }
          [ -n "$(plutil -extract SUPublicEDKey raw -o - "$app/Contents/Info.plist")" ] || {
            echo "::error::Sparkle EdDSA public key is missing"; exit 1; }
          get_task_allow="$(
            printf '%s' "$ents" \
              | plutil -extract com.apple.security.get-task-allow raw -o - - 2>/dev/null \
              || true
          )"
          if [ "$get_task_allow" = "true" ]; then
            echo "::error::Release build carries get-task-allow — it must not ship debuggable"
            exit 1
          fi
      # The same two files in the direct download, which builds from the same
      # synchronized folders, checked to the same exact sets. Only the App Store
      # product is submitted, so this is not a store requirement — it is how an
      # exclusion that removed a manifest from one channel gets noticed while
      # both are still meant to be one app.
      # Read-only: nothing here re-signs or repackages anything.
      - name: Verify the direct product ships both privacy manifests
        run: |
          bash apps/mac/scripts/verify-privacy-manifests.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" "direct"
      # Exercise the exact packaging path intended for release: the script
      # verifies the source signature, mounts the finished image, and verifies
      # the copied app again before emitting its checksum.
      - name: Package and verify DMG
        run: |
          apps/mac/scripts/package-dmg.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" \
            "$RUNNER_TEMP/Relayium.dmg" \
            "Developer ID Application"
      - name: Record signed package provenance
        id: package_identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app"
          build="$(defaults read "$app/Contents/Info" CFBundleVersion)"
          version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
          [ -z "$RELEASE_VERSION" ] || [ "$version" = "$RELEASE_VERSION" ]
          hash="$(shasum -a 256 "$RUNNER_TEMP/Relayium.dmg" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg version "$version" --arg build "$build" --arg hash "$hash" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,sha:$sha,version:$version,build:$build,
              signedDmgSha256:$hash,dmgSha256:$hash,runAttempt:$attempt}' \
            > "$RUNNER_TEMP/provenance.json"
          mkdir "$RUNNER_TEMP/release-tools"
          cp "$RUNNER_TEMP/dd/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            "$RUNNER_TEMP/release-tools/generate_appcast"
      - name: Upload signed package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-macos-signed-${{ github.sha }}-${{ inputs.release_version || 'ci' }}
          path: |
            ${{ runner.temp }}/Relayium.dmg
            ${{ runner.temp }}/Relayium.dmg.sha256
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/release-tools/generate_appcast
          if-no-files-found: error
          retention-days: 14
      # This is a disposable acceptance check, not release publication. Sparkle
      # refuses to add an EdDSA enclosure signature when the supplied private
      # key does not derive the SUPublicEDKey embedded in the mounted app.
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  notarize-stage:
    needs: [ui-smoke, signed-build]
    if: github.event_name == 'workflow_dispatch' && (inputs.notarize || inputs.validate_notary_credentials || inputs.validate_sparkle_key || inputs.release_version != '')
    runs-on: macos-15
    # Finite, and derived from Apple's wait rather than from this job's observed
    # runtime. Every real notarization in recent history finished in 63-84
    # seconds end to end, with Apple's own queue answering in 35-50, so an
    # observation-scaled bound would be about two minutes. That number would be
    # WRONG here: `apps/mac/scripts/notarize-dmg.sh` submits with
    # `--wait --timeout 45m`, so a slow notary day is a legitimate 45-minute
    # wait, and a bound below it would kill the job mid-wait and burn a
    # notarization submission for a run that was going to succeed. The bound is
    # therefore Apple's 45-minute wait plus room for the provenance check,
    # stapling, Gatekeeper assessment, release staging and artifact upload that
    # follow it — and it is still a bound, so a submission that never returns at
    # all gives the runner back instead of holding it for 6 hours with the
    # notarization API key on disk.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: relayium-macos-signed-${{ github.sha }}-${{ inputs.release_version || 'ci' }}
          path: ${{ runner.temp }}
      - name: Verify signed package provenance
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [ "$(jq -r .repository "$RUNNER_TEMP/provenance.json")" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r .sha "$RUNNER_TEMP/provenance.json")" = "$GITHUB_SHA" ]
          [ "$(jq -r .runAttempt "$RUNNER_TEMP/provenance.json")" -ge 1 ]
          [ -z "$RELEASE_VERSION" ] || [ "$(jq -r .version "$RUNNER_TEMP/provenance.json")" = "$RELEASE_VERSION" ]
          (cd "$RUNNER_TEMP" && shasum -a 256 -c Relayium.dmg.sha256)
          [ "$(jq -r .dmgSha256 "$RUNNER_TEMP/provenance.json")" = "$(shasum -a 256 "$RUNNER_TEMP/Relayium.dmg" | awk '{print $1}')" ]
          mount="$RUNNER_TEMP/verify-mount"; mkdir "$mount"
          hdiutil attach "$RUNNER_TEMP/Relayium.dmg" -mountpoint "$mount" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$mount/Relayium.app"
          [ "$(defaults read "$mount/Relayium.app/Contents/Info" CFBundleVersion)" = "$(jq -r .build "$RUNNER_TEMP/provenance.json")" ]
          hdiutil detach "$mount"
          chmod 0755 "$RUNNER_TEMP/release-tools/generate_appcast"
          test -x "$RUNNER_TEMP/release-tools/generate_appcast" || {
            echo "::error::restored generate_appcast is not executable"
            exit 1
          }
      - name: Validate Sparkle update-signing key
        if: github.event_name == 'workflow_dispatch' && inputs.validate_sparkle_key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::MACOS_SPARKLE_PRIVATE_KEY is not set"
            exit 1
          fi
          tools="$RUNNER_TEMP/release-tools"
          validation_dir="$RUNNER_TEMP/sparkle-key-validation"
          log="$RUNNER_TEMP/sparkle-key-validation.log"
          mkdir "$validation_dir"
          cp "$RUNNER_TEMP/Relayium.dmg" "$validation_dir/Relayium.dmg"
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$tools/generate_appcast" \
                --ed-key-file - \
                --download-url-prefix "https://relayium.com/apps/macos/" \
                "$validation_dir" > "$log" 2>&1
          appcast="$validation_dir/appcast.xml"
          [ -s "$appcast" ] || {
            echo "::error::Sparkle did not generate a validation appcast"; exit 1; }
          grep -q '<enclosure ' "$appcast" || {
            echo "::error::Validation appcast has no release enclosure"; exit 1; }
          grep -q 'sparkle:edSignature=' "$appcast" || {
            echo "::error::The secret does not match the app's embedded Sparkle public key"; exit 1; }
          if grep -q 'does not match key EdDSA' "$log"; then
            echo "::error::The secret does not match the app's embedded Sparkle public key"
            exit 1
          fi
          echo "Sparkle update-signing key matches the app and signed a disposable enclosure"
      # Notarization is deliberately opt-in rather than part of every push:
      # Apple limits daily submissions, and an accepted build is a release
      # candidate rather than ordinary compile evidence.
      - name: Materialize notarization API key
        if: github.event_name == 'workflow_dispatch' && (inputs.notarize || inputs.validate_notary_credentials)
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_KEY_P8_BASE64" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::MACOS_NOTARY_KEY_P8_BASE64 / MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER_ID are not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          ( umask 077; printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8" )
          mkdir -p "$RUNNER_TEMP/notarization"
      # `history` exercises the same key/key-ID/issuer authentication as a
      # submission but performs no upload and consumes no notarization quota.
      - name: Validate notarization credentials without submitting
        if: github.event_name == 'workflow_dispatch' && inputs.validate_notary_credentials
        env:
          MACOS_NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          xcrun notarytool history \
            --key "$MACOS_NOTARY_KEY_PATH" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --output-format json > /dev/null
      - name: Notarize, staple, and assess DMG
        if: github.event_name == 'workflow_dispatch' && inputs.notarize
        env:
          MACOS_NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          apps/mac/scripts/notarize-dmg.sh \
            "$RUNNER_TEMP/Relayium.dmg" \
            "$RUNNER_TEMP/notarization"
      - name: Finalize notarized package provenance
        if: github.event_name == 'workflow_dispatch' && inputs.notarize
        run: |
          set -euo pipefail
          hash="$(shasum -a 256 "$RUNNER_TEMP/Relayium.dmg" | awk '{print $1}')"
          jq --arg hash "$hash" '.dmgSha256=$hash | .notarized=true' \
            "$RUNNER_TEMP/provenance.json" > "$RUNNER_TEMP/provenance.final.json"
          mv "$RUNNER_TEMP/provenance.final.json" "$RUNNER_TEMP/provenance.json"
          (cd "$RUNNER_TEMP" && shasum -a 256 Relayium.dmg > Relayium.dmg.sha256)
      # A public feed must sign the final stapled bytes, not the pre-notarized
      # package. The staging script also pins the enclosure to the immutable
      # macos-v<VERSION> release URL and emits the single web manifest that
      # flips the /apps card.
      - name: Stage public release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::MACOS_SPARKLE_PRIVATE_KEY is not set"
            exit 1
          fi
          built_version="$(jq -r .version "$RUNNER_TEMP/provenance.json")"
          if [ "$built_version" != "$RELEASE_VERSION" ]; then
            echo "::error::release_version $RELEASE_VERSION does not match the built app version $built_version"
            exit 1
          fi
          tools="$RUNNER_TEMP/release-tools"
          generated="$RUNNER_TEMP/generated-appcast"
          staged="$RUNNER_TEMP/release-web"
          mkdir -p "$generated" "$staged/public/apps/macos"
          cp "$RUNNER_TEMP/Relayium.dmg" "$generated/Relayium.dmg"
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$tools/generate_appcast" \
                --ed-key-file - \
                --download-url-prefix \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/macos-v${RELEASE_VERSION}/" \
                "$generated"
          cp web/native-releases.json "$staged/native-releases.json"
          cp web/public/apps/macos/appcast.xml "$staged/public/apps/macos/appcast.xml"
          # The native client policy, which the stager READS to derive the
          # Sparkle critical-update threshold and then rewrites with this
          # release as the latest version. Without it the staging step refuses
          # to run at all, which is deliberate: a feed whose critical threshold
          # was guessed is worse than a release that stops here.
          cp web/native-client-policy.json "$staged/native-client-policy.json"
          cp web/public/apps/macos/client-policy.json \
            "$staged/public/apps/macos/client-policy.json"
          node web/scripts/stage-macos-release.mjs \
            --version "$RELEASE_VERSION" \
            --appcast "$generated/appcast.xml" \
            --web-root "$staged" \
            --repository "$GITHUB_REPOSITORY"
          grep -Fq "url=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/macos-v${RELEASE_VERSION}/Relayium.dmg\"" \
            "$staged/public/apps/macos/appcast.xml"
          grep -q 'sparkle:edSignature="[^"]' "$staged/public/apps/macos/appcast.xml"
          # The critical-update threshold survived generation, and it is the one
          # the policy names. `generate_appcast` writes a fresh feed and knows
          # nothing about the policy, so this is the assertion that the
          # derivation ran rather than a hand edit having been preserved.
          critical="$(jq -r '.macos.minimumSupportedBuild' "$staged/native-client-policy.json")"
          grep -Fq "<sparkle:criticalUpdate sparkle:version=\"$critical\">" \
            "$staged/public/apps/macos/appcast.xml" || {
            echo "::error::the staged appcast carries no critical-update threshold"; exit 1; }
          [ "$(jq -r '.macos.latestVersion' "$staged/native-client-policy.json")" \
            = "$RELEASE_VERSION" ] || {
            echo "::error::the staged client policy does not name this release"; exit 1; }
          # The replay barrier moved exactly as much as the document did. Every
          # client remembers the highest revision it has accepted and refuses a
          # different document under a revision it already holds, so a release
          # that changed `latestVersion` without advancing the revision would
          # publish a policy the installed fleet declines — and a release that
          # advanced it without changing anything would make each rerun of the
          # recovery path a fresh diff against main.
          previous_revision="$(jq -r '.macos.policyRevision' web/native-client-policy.json)"
          previous_latest="$(jq -r '.macos.latestVersion' web/native-client-policy.json)"
          staged_revision="$(jq -r '.macos.policyRevision' "$staged/native-client-policy.json")"
          if [ "$previous_latest" = "$RELEASE_VERSION" ]; then
            expected_revision="$previous_revision"
          else
            expected_revision="$((previous_revision + 1))"
          fi
          [ "$staged_revision" = "$expected_revision" ] || {
            echo "::error::staged policyRevision is $staged_revision, expected $expected_revision"
            exit 1; }
          cmp "$staged/native-client-policy.json" "$staged/public/apps/macos/client-policy.json"
      # Without the manual notarize input this remains a CI acceptance artifact,
      # not a public release. Public publication and the /apps page flip are
      # separate, explicitly controlled G5 steps.
      - name: Upload notarization evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.notarize
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-macos-notarization-${{ github.sha }}
          path: ${{ runner.temp }}/notarization
          if-no-files-found: warn
          retention-days: 30
      - name: Remove notarization API key
        if: always()
        run: rm -P "$RUNNER_TEMP/notary-key.p8" 2>/dev/null || true
      - name: Upload notarized release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-macos-${{ github.sha }}-${{ inputs.release_version || 'ci' }}
          path: |
            ${{ runner.temp }}/Relayium.dmg
            ${{ runner.temp }}/Relayium.dmg.sha256
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/release-web/native-releases.json
            ${{ runner.temp }}/release-web/public/apps/macos/appcast.xml
            ${{ runner.temp }}/release-web/native-client-policy.json
            ${{ runner.temp }}/release-web/public/apps/macos/client-policy.json
          if-no-files-found: error
          retention-days: 14

  # This job is the only holder of repository write permission. Ordinary
  # signed builds, credential checks, and notarization candidates cannot
  # publish anything.
  publish:
    needs: notarize-stage
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    # Finite, and chosen rather than inherited. The cheapest job here — it runs
    # on a free Linux runner and the 5 successful runs in recent history took
    # 3.8 minutes at worst — but the one with the least recoverable failure: it
    # publishes an immutable GitHub Release and writes the appcast to `main`. A
    # bound is what stops a wedged publication from sitting half-done for six
    # hours while the release it was supposed to announce is neither published
    # nor visibly failed.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: relayium-macos-${{ github.sha }}-${{ inputs.release_version || 'ci' }}
          path: ${{ runner.temp }}/release
      - name: Verify publication artifacts
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          cd "$release"
          shasum -a 256 -c Relayium.dmg.sha256
          [ "$(jq -r .repository provenance.json)" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r .sha provenance.json)" = "$GITHUB_SHA" ]
          [ "$(jq -r .version provenance.json)" = "$RELEASE_VERSION" ]
          [ "$(jq -r .notarized provenance.json)" = true ]
          [ "$(jq -r .dmgSha256 provenance.json)" = \
            "$(shasum -a 256 Relayium.dmg | awk '{print $1}')" ]
          [ "$(jq -r .build provenance.json)" -gt 0 ]
          expected="https://github.com/${GITHUB_REPOSITORY}/releases/download/macos-v${RELEASE_VERSION}/Relayium.dmg"
          [ "$(jq -r '.macos.available' release-web/native-releases.json)" = true ]
          [ "$(jq -r '.macos.version' release-web/native-releases.json)" = "$RELEASE_VERSION" ]
          [ "$(jq -r '.macos.build' release-web/native-releases.json)" -gt 0 ]
          [ "$(jq -r '.macos.downloadUrl' release-web/native-releases.json)" = "$expected" ]
          grep -Fq "url=\"$expected\"" release-web/public/apps/macos/appcast.xml
          grep -q 'sparkle:edSignature="[^"]' release-web/public/apps/macos/appcast.xml
          # The client policy travelled with the artifact, names this release,
          # and its threshold is the one written into the feed.
          [ "$(jq -r '.macos.latestVersion' release-web/native-client-policy.json)" \
            = "$RELEASE_VERSION" ]
          critical="$(jq -r '.macos.minimumSupportedBuild' release-web/native-client-policy.json)"
          grep -Fq "<sparkle:criticalUpdate sparkle:version=\"$critical\">" \
            release-web/public/apps/macos/appcast.xml
          # The revision the fleet will remember. Outside this range no client
          # acts on the document at all, and a revision that is not below main's
          # is what keeps the published policy ahead of the one already served.
          revision="$(jq -r '.macos.policyRevision' release-web/native-client-policy.json)"
          [ "$revision" -ge 1 ]
          [ "$revision" -le 1000000000 ]
          [ "$revision" -ge "$(jq -r '.macos.policyRevision' \
            "$GITHUB_WORKSPACE/web/native-client-policy.json")" ]
          cmp release-web/native-client-policy.json \
            release-web/public/apps/macos/client-policy.json
      # Everything from here to the release creation builds the COMPLETE
      # metadata commit and hands it to the suites that own it. A GitHub Release
      # is immutable, so this is the last place a "no" costs nothing.
      #
      # Both macOS publications so far were assembled in the opposite order. Run
      # 31931451292 created macos-v1.2.5 and only then discovered that the
      # manifest had moved while README.md, apps/README.md, the release-page
      # source and the generated English and Simplified Chinese pages had not:
      # the release was public and permanent, relayium.com still offered 1.2.4,
      # and recovery took a separate hand-assembled commit. The 1.2.4 release
      # failed the same way. `scripts/test/macos-publish-order-test.mjs` is what
      # keeps this order from being undone by a later edit.
      #
      # The job is split into two phases with one hard boundary. This step is the
      # WRITE phase: every command that can rewrite a tracked file — the document
      # bump, `gen:pages`, `npm run check`, `npm run build` and the archived-locale
      # restore — runs here and only here. The step after it is the JUDGE phase:
      # it stages the result and then does nothing but read. That boundary is the
      # point. Tests that ran before a later generation step judged a tree that no
      # longer exists, and "generation is deterministic" is an assumption, not a
      # check — so the suite is made to run last, against the exact staged bytes,
      # and an index/worktree guard proves those bytes reached the commit.
      - name: Assemble the complete metadata candidate
        id: assemble
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::workflow commit is no longer an ancestor of main"; exit 1; }
          git checkout --detach origin/main
          # Read before overwriting: this is the version main currently
          # documents, and therefore the one the prose has to be moved FROM.
          previous="$(jq -r '.macos.version' web/native-releases.json)"
          cp "$RUNNER_TEMP/release/release-web/native-releases.json" web/native-releases.json
          cp "$RUNNER_TEMP/release/release-web/public/apps/macos/appcast.xml" \
            web/public/apps/macos/appcast.xml
          # The canonical client policy, from the same artifact. Its published
          # twin under `public/` is regenerated by `gen:pages` below from
          # exactly this file, so copying the canonical one is what makes the
          # two agree in the commit.
          cp "$RUNNER_TEMP/release/release-web/native-client-policy.json" \
            web/native-client-policy.json
          staged="$(jq -r '.macos.version' web/native-releases.json)"
          [ "$staged" = "$RELEASE_VERSION" ] || {
            echo "::error::the staged manifest names $staged, not $RELEASE_VERSION"; exit 1; }
          if [ "$previous" = "$staged" ]; then
            # A rerun after the metadata already landed — the ordinary way to
            # recover a delivery that failed after the release was created.
            # There is nothing to bump, and the candidate below must come out
            # EMPTY: everything is already correct on main, so re-deriving it has
            # to reproduce main byte for byte. The suites still run, because a
            # rerun is also the moment to prove the delivered tree is green.
            echo "main already documents $staged; re-deriving it must change nothing."
            echo "already-delivered=true" >> "$GITHUB_OUTPUT"
          else
            node web/scripts/macos-release-candidate.mjs bump \
              --from "$previous" --to "$staged"
            echo "already-delivered=false" >> "$GITHUB_OUTPUT"
          fi
          cd web
          npm ci
          npm run gen:pages
          # `npm run check` is svelte-check plus two `noEmit` tsc projects whose
          # build info lives under node_modules, so today it writes nothing
          # tracked. It still runs inside the write phase rather than beside the
          # suite: if a tsconfig ever starts emitting, the emission lands here,
          # before the candidate is staged, instead of silently editing a tree
          # the suite had already judged.
          npm run check
          npm run build
          cd ..
          # gen-pages rewrites all nine /apps pages from the manifest, including
          # the seven archived locales, which are byte-for-byte frozen. Restoring
          # them from the index is what keeps a release commit from quietly
          # refreshing a translation the product no longer maintains; the scope
          # check below is what proves the restore happened.
          #
          # `npm run build` runs gen-pages again on its way to vite, so this is
          # placed after the build rather than after gen:pages — and it is the
          # last tracked-file write in the whole job.
          git checkout -- \
            web/public/ar web/public/de web/public/es web/public/fr \
            web/public/ja web/public/ko web/public/pt
      # The JUDGE phase. Nothing below rewrites a tracked file: the candidate is
      # staged first, and every verdict — the scope check and the owning web
      # suite — is rendered against exactly those staged bytes. This is the
      # ordering invariant that the previous revision of this job broke by
      # running `npm run build` and the locale restore after `npm test`: the
      # bytes the suite approved were then regenerated before being committed,
      # so what shipped was only *expected* to equal what passed.
      - name: Validate the staged candidate
        id: validate
        env:
          ALREADY_DELIVERED: ${{ steps.assemble.outputs.already-delivered }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          candidate_tree="$(git write-tree)"
          git diff --cached --name-only \
            | node web/scripts/macos-release-candidate.mjs check-scope \
                --already-delivered "$ALREADY_DELIVERED"
          cd web
          npm test -- --run
          cd ..
          # The suite is the last word on this release, so it has to have been
          # the last word on these exact bytes. An unstaged tracked change or a
          # different index tree means something moved between generation and
          # judgment, and the tree that passed is not the tree about to be
          # committed. That is a hard stop, not a warning: the next step creates
          # something permanent.
          git diff --quiet || {
            echo "::error::tracked files changed during validation; the tested bytes are not the candidate"
            exit 1
          }
          [ "$(git write-tree)" = "$candidate_tree" ] || {
            echo "::error::the staged candidate tree changed during validation"; exit 1; }
          echo "tree=$candidate_tree" >> "$GITHUB_OUTPUT"
      # The candidate becomes one commit BEFORE the release exists, so what is
      # pushed afterwards is exactly the tree the suites above judged — no
      # regeneration, no second test run, nothing that can newly fail. The tree
      # hash is carried across the step boundary and rechecked here, so a step
      # inserted between validation and this commit cannot smuggle a byte in.
      - name: Freeze the validated candidate
        id: freeze
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TREE: ${{ steps.validate.outputs.tree }}
        run: |
          set -euo pipefail
          git diff --quiet || {
            echo "::error::tracked files changed after validation"; exit 1; }
          [ "$(git write-tree)" = "$CANDIDATE_TREE" ] || {
            echo "::error::the index no longer holds the validated candidate"; exit 1; }
          if git diff --cached --quiet; then
            echo "Release metadata is already present on main."
            echo "candidate=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "relayium-release[bot]"
          git config user.email "github@relayium.com"
          git commit -m "release(mac): publish ${RELEASE_VERSION}"
          [ "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE" ] || {
            echo "::error::the release commit does not carry the validated tree"; exit 1; }
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          tag="macos-v${RELEASE_VERSION}"
          release="$RUNNER_TEMP/release"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_state="$(
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease \
                --jq '[.isDraft, .isPrerelease] | @tsv'
            )"
            [ "$release_state" = $'false\tfalse' ] || {
              echo "::error::$tag exists but is not a public, stable release"; exit 1; }
            git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
            [ "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" ] || {
              echo "::error::$tag already targets a different commit"; exit 1; }
            existing="$RUNNER_TEMP/existing-release"
            mkdir "$existing"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern Relayium.dmg --pattern Relayium.dmg.sha256 \
              --pattern appcast.xml --dir "$existing"
            cmp "$release/Relayium.dmg" "$existing/Relayium.dmg"
            cmp "$release/Relayium.dmg.sha256" "$existing/Relayium.dmg.sha256"
            cmp "$release/release-web/public/apps/macos/appcast.xml" "$existing/appcast.xml"
            echo "Existing $tag contains the identical release; continuing metadata recovery."
          else
            gh release create "$tag" \
              "$release/Relayium.dmg" \
              "$release/Relayium.dmg.sha256" \
              "$release/release-web/public/apps/macos/appcast.xml#appcast.xml" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Relayium for macOS ${RELEASE_VERSION}" \
              --notes "Signed, notarized universal macOS release. The disk image passed Apple notarization, stapling, and Gatekeeper assessment in workflow run ${GITHUB_RUN_ID}."
          fi
      # Delivery is a push and nothing else. Its input is a commit that already
      # passed `npm run check`, the full web suite, the build and the candidate
      # scope check, so there is no test here that could newly fail against
      # unstaged sources — which is precisely how run 31931451292 ended up with a
      # permanent release and no metadata behind it.
      #
      # Idempotent in both directions. A rerun after a successful delivery
      # assembles the same candidate against a main that already carries it,
      # finds nothing staged, and freezes no commit — so this step has nothing to
      # push and says so. Nothing is rebuilt, retagged, re-uploaded or replaced.
      #
      # Not forced. If main moved between validation and here the push is
      # rejected, and the correct response is another run against the new main —
      # not overwriting whatever landed in between.
      - name: Deliver the frozen candidate to main
        env:
          CANDIDATE: ${{ steps.freeze.outputs.candidate }}
        run: |
          set -euo pipefail
          if [ -z "$CANDIDATE" ]; then
            echo "Release metadata is already present on main; nothing to deliver."
            exit 0
          fi
          git push origin "$CANDIDATE:main"

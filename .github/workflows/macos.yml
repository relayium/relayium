name: macos
# The macOS half of the native product. The iOS half is `ios.yml`.
#
# This file used to carry an `ios-build` job and the iOS acceptance, so the two
# platforms could not be told apart: `apps/**` and `scripts/**` in the filter
# meant every iOS-only change started the macOS signing lane and every
# macOS-only change started an iOS runner. Path filters are per-workflow, so
# separating them required separating the FILES; the iOS job moved out whole and
# unedited except for its trigger condition.
#
# What each tree in the filter is an input TO:
#
#   apps/mac/**          the app, its Share extension, its UI tests and every
#                        release script this workflow runs
#   apps/RelayiumKit/**  the SHARED package this workflow's app targets compile
#                        against; deliberately in this filter AND in ios.yml's,
#                        because a change there can break either app alone
#
# …minus one subtree. `!apps/RelayiumKit/Tests/**` follows the line above, and
# GitHub evaluates a `paths:` list per file in order with the LAST match
# winning, so the package's SOURCE still starts this workflow and the package's
# own XCTest target and fixtures no longer do. Nothing under
# `apps/RelayiumKit/Tests/` is compiled by `apps/mac/Relayium.xcodeproj`, read
# by any release script here, or linked into the signed product — the app
# targets build the package's library products, not its test target — so a
# test-only edit used to start this whole workflow, and the `signed-build`
# lane's `needs:` chain with it, to produce no evidence about the change at all.
#
# That subtree is not unwatched: `.github/workflows/swift-package.yml` owns the
# package's own suite, has no such exclusion, and runs the repository's one
# unfiltered `swift test`. A MIXED diff — a source file and a test file in the
# same commit — still starts this workflow, because the source file is still a
# positive match and one match is enough.
#
# `scripts/**` is deliberately GONE. After the move, no job in this file reads
# anything under `scripts/` — the three acceptance runs that did are the iOS
# job's, and they moved with it. Re-adding it would restart macOS signing runs
# on Go-shard and pairing-script edits.
#
# `apps/` top-level files (`apps/README.md`, `apps/LICENSE`) no longer trigger
# either native workflow. That is intentional: neither is an input to any build
# or test here, and `apps/**` was matching them only because it was coarse.
#
# This file is now CI ONLY, and it is deliberately unable to release anything.
# It holds `contents: read` and no job-level permission, it materializes no
# notary key and no Sparkle private key, and it contains no `gh release`, no
# `git push` and no `GITHUB_TOKEN`. Everything that notarizes, stages public
# metadata or publishes lives in `.github/workflows/macos-release.yml`, which is
# the sole manual entry point and the sole holder of `contents: write`.
#
# The two halves are joined by `workflow_call` rather than by a shared file: the
# release workflow calls THIS one, so a release builds through exactly the same
# signed-build lane every push to `main` and every pull request already runs.
# The three inputs below are the only ones the remaining jobs read, and their
# defaults are the CI defaults — an ordinary push supplies none of them, and no
# combination of the safe defaults reaches a release operation, because no
# release operation is in this file to reach.
on:
  push:
    # Only `main`, and this trigger is LOAD-BEARING. Branch work is gated by
    # `merge-gate.yml`, which CALLS this file; this event is the only thing
    # that verifies `main` itself, because the gate runs on `pull_request`
    # only. No lane may lose it — `relayium-ops`' `deploy/promote.sh` reads
    # check runs on the `main` commit, and a lane that stopped reporting there
    # would wedge production promotion rather than fail visibly here.
    branches:
      - main
    # This list is the merge gate's only statement of what this lane watches:
    # `scripts/ci/select-lanes.mjs` reads it off disk and selects this lane from
    # it and from nothing else, so an entry changed here changes what the gate
    # requires. The `&paths` ANCHOR this list used to declare is gone with the
    # `pull_request:` block that aliased it — an anchor nothing references is a
    # dangling one, and the gate is the pull-request entry point now.
    #
    # ORDER IS LOAD-BEARING. GitHub applies these per file, in order, and the
    # last pattern that matches decides — so the negation has to follow
    # `apps/RelayiumKit/**`, never precede it. Reordering the two lines makes
    # the exclusion match first and be overridden immediately after, which
    # leaves the filter valid, leaves actionlint happy, and silently restores
    # the behaviour this entry exists to remove.
    paths:
      - 'apps/mac/**'
      - 'apps/RelayiumKit/**'
      - '!apps/RelayiumKit/Tests/**'
      - '.github/workflows/macos.yml'
  # Called by `.github/workflows/macos-release.yml` and by
  # `.github/workflows/merge-gate.yml`, and by nothing else. There is
  # deliberately no `workflow_dispatch:` here any more: a manual run of this
  # file could import the signing certificate and build, which is exactly what a
  # push already does, and every reason to start it BY HAND is a release reason
  # that now belongs to the release workflow.
  #
  # The gate is the second caller and the reason this file no longer carries a
  # `pull_request:` trigger of its own. A path-filtered lane that does not
  # trigger emits no check run at all, so branch protection could never tell a
  # passing macOS lane from one that was legitimately not selected; the gate
  # calls this file, judges its result, and reports one always-present context.
  # It passes NO `with:` block, so all three inputs below take their CI
  # defaults, and only the four signing secrets — never `inherit`.
  #
  # Exactly three inputs, because exactly three are read below — `contract`
  # reads all three and `signed-build` reads `release_version`. An input no job
  # consumes is a lever that appears to do something; the caller passes these
  # three and nothing else.
  #
  # Every one is OPTIONAL with the CI default. `push` and `pull_request` supply
  # no inputs at all, so `inputs.release_version` is the empty string and both
  # booleans are false on those events; the defaults are written out so the
  # workflow_call path behaves identically when the caller omits one.
  workflow_call:
    inputs:
      release_version:
        description: 'The app version this build is a candidate for, or empty for ordinary CI'
        required: false
        default: ''
        type: string
      notarize:
        description: 'Whether the caller intends to notarize this build; read by the release contract only'
        required: false
        default: false
        type: boolean
      publish_release:
        description: 'Whether the caller intends to publish this build; read by the release contract only'
        required: false
        default: false
        type: boolean
    # The signing and profile material this file's own jobs use, and nothing
    # else. The notary key and the Sparkle private key are NOT here: no job in
    # this file reads them, and a callee that declares a secret it never uses is
    # a callee a future caller can be asked to hand one to.
    #
    # Optional, because the four are already how the certificate steps fail: each
    # checks its own variable and exits with the runbook name. A `required: true`
    # here would move that failure to a caller-side syntax error whose message
    # names neither the secret nor the runbook.
    secrets:
      MACOS_SIGNING_CERT_P12_BASE64:
        required: false
      MACOS_SIGNING_CERT_PASSWORD:
        required: false
      MACOS_PROVISIONING_PROFILE_BASE64:
        required: false
      MACOS_SHARE_PROVISIONING_PROFILE_BASE64:
        required: false
    # The one thing a caller needs from this file: the name of the artifact
    # `signed-build` uploaded, so the caller's notarization job downloads THAT
    # build rather than reconstructing its name from inputs it hopes match.
    #
    # `jobs['signed-build']` in bracket form, not `jobs.signed-build`: a hyphen
    # in a property path is parsed as subtraction, so the dotted spelling
    # silently evaluates to an empty string and the caller downloads nothing
    # under a name it was never given.
    outputs:
      signed_artifact:
        description: 'The artifact name `signed-build` uploaded the signed DMG, its checksum and its provenance under'
        value: ${{ jobs['signed-build'].outputs.signed_artifact }}

permissions:
  contents: read

# Supersede a pull request's own earlier runs, and nothing else.
#
# The group key is the PR NUMBER, so pushing three times to a branch leaves one
# live run instead of three. Every non-PR event falls back to `github.run_id`,
# which is unique per run, so no two such runs ever share a group and nothing
# outside a pull request can cancel anything.
#
# This REPLACES a `macos-${{ github.sha }}` group whose cancel-in-progress was
# `github.event_name == 'workflow_dispatch'`, i.e. a release dispatch cancelled
# the push verification of the same commit. That saved a runner and cost
# release trust in both directions:
#
#   * `push` is now restricted to `main`, so the duplicate that grouping existed
#     to collapse — a branch push plus its pull request — no longer happens at
#     all, and the remaining `main` run is the one nobody should cancel;
#   * a `github.sha` group is shared by every dispatch for that SHA, and GitHub
#     cancels an older PENDING run in a group even when cancel-in-progress is
#     false. A second dispatch could therefore drop a queued signing,
#     notarization or publication run for the same immutable source.
#
# Under run_id nothing outside a pull request can cancel anything, which is the
# correct default for a workflow that imports a Developer ID certificate.
#
# The prefix is the LITERAL `macos-ci`, for the reason every lane the merge
# gate calls now carries one: inside a called workflow `${{ github.workflow }}`
# is the CALLER's name. Under the shared expression a release run would put
# `macos-release.yml`'s own jobs and this file's jobs in one group, keyed on one
# `github.run_id`, and the callee would queue behind the caller that is waiting
# for it — and every lane the gate calls would land in that one group together,
# cancelling each other under a pull request's `cancel-in-progress`. A literal
# prefix that no other workflow uses makes the groups disjoint by construction,
# and `scripts/test/ci-event-policy-test.mjs` asserts both the literal and its
# uniqueness across every file it governs.
concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: macos-15
    # Finite, and chosen rather than inherited. Outside a workflow_dispatch the
    # whole step below is skipped, so the job is a checkout; the 32 successful
    # runs in this workflow's recent history took 61s at worst and 24s on
    # average. Only a release dispatch reaches the one `xcodebuild
    # -showBuildSettings`, which reads the project rather than building it. The
    # bound is far above either path and exists for the third case: a wedged
    # `xcodebuild` gives a PAID macOS runner back in minutes instead of holding
    # it for GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate release contract
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NOTARIZE: ${{ inputs.notarize }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          # Widened with the split. The condition used to be
          # `workflow_dispatch` alone, because that was the only event that
          # could carry these inputs; now they arrive through `workflow_call`
          # from `macos-release.yml`, where `GITHUB_EVENT_NAME` is the CALLER's
          # event and the dispatch test alone would skip the whole contract on
          # exactly the runs it exists for. The dispatch test is kept rather
          # than replaced — a direct dispatch of a caller is still a release
          # intent — and either input naming a release now reaches the same
          # checks. Nothing inside is relaxed: this branch only becomes
          # reachable more often.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || [ -n "$RELEASE_VERSION" ] || [ "$PUBLISH_RELEASE" = true ]; then
            if [ -n "$RELEASE_VERSION" ]; then
              printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || exit 1
              [ "$NOTARIZE" = true ] || exit 1
              actual="$(xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium -showBuildSettings | awk '/MARKETING_VERSION =/{print $3; exit}')"
              [ "$actual" = "$RELEASE_VERSION" ] || { echo "::error::release $RELEASE_VERSION != MARKETING_VERSION $actual"; exit 1; }
            fi
            if [ "$PUBLISH_RELEASE" = true ]; then
              [ -n "$RELEASE_VERSION" ] && [ "$GITHUB_REF" = refs/heads/main ] || exit 1
              node apps/mac/scripts/check-release-readiness.mjs --require-approved
            fi
          fi

  # No secrets, so this runs on pull requests from forks like any other check.
  test:
    runs-on: macos-15
    # Finite, and chosen rather than inherited.
    #
    # This job used to be one unfiltered `swift test` over the shared package
    # PLUS the four release-script tests below, and the 59 successful runs in
    # recent history took 5.5 minutes at worst and 3.5 on average for both
    # halves together. The `swift test` moved to
    # `.github/workflows/swift-package.yml`; what is left is a checkout, two
    # `-version` probes and four shell tests that run entirely against mocked
    # `codesign`/`hdiutil`/`xcrun` binaries and build nothing.
    #
    # The remaining work is therefore bounded above by that same recorded 5.5
    # minutes — it is a strict subset of what produced it — and 10 is the
    # conservative bound chosen from that evidence rather than from a fresh
    # measurement this branch has not taken. It still turns a wedged run red in
    # minutes instead of holding a PAID macOS runner for GitHub's 6-hour
    # default. Re-measure and lower it once this shape has its own run history.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Recorded in the log so a future failure can be compared against the
      # toolchain that produced the last green run.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # The unfiltered `swift test` that used to run here now lives in
      # `.github/workflows/swift-package.yml`, which is the repository's sole
      # owner of it. It is not gone and it is not weaker: that workflow watches
      # `apps/RelayiumKit/**` with no exclusion, so it starts on strictly MORE
      # of the package than this filter does — including the test target and the
      # fixtures this one now excludes. `scripts/test/swift-ci-boundary-test.mjs`
      # asserts that exactly one unfiltered `swift test` exists and that it is
      # that job, so this comment cannot decay into a step that quietly went
      # missing.
      - name: Release script tests
        run: |
          apps/mac/scripts/test-package-dmg.sh
          apps/mac/scripts/test-resign-sparkle.sh
          apps/mac/scripts/test-notarize-dmg.sh
          apps/mac/scripts/test-release-readiness.sh

  # Needs the signing certificate, so it cannot run where secrets are
  # unavailable. This repository is public: a fork's pull request cannot read
  # repository secrets, and a job that tried would fail confusingly rather than
  # skip cleanly.
  # The complete product-flow suite is split only at XCTest class boundaries.
  # Both shards are mandatory; neither changes, skips, or weakens a test.
  ui-smoke:
    needs: [test, contract]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: app-shell
            tests: RelayiumUITests/AppShellUITests
            timeout: 30
          - shard: device-inbox
            tests: RelayiumUITests/DeviceInboxUITests,RelayiumUITests/SubscriptionUITests,RelayiumUITests/LocalSessionUITests
            timeout: 35
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Import UI signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12_BASE64" ] && [ -n "$CERT_PASSWORD" ] || exit 1
          keychain="$RUNNER_TEMP/ui-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/ui-cert.p12"
          ( umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert" )
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -P "$cert"
      - name: Install UI provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.MACOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$PROFILE_BASE64" ] && [ -n "$SHARE_PROFILE_BASE64" ] || exit 1
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$PROFILE_BASE64" | base64 --decode > "$dir/relayium.provisionprofile" )
          ( umask 077; printf '%s' "$SHARE_PROFILE_BASE64" | base64 --decode > "$dir/relayium-share.provisionprofile" )
      - name: Run macOS product-flow UI smoke (${{ matrix.shard }})
        id: ui_smoke
        env:
          TEST_CLASSES: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          only=()
          IFS=',' read -ra classes <<< "$TEST_CLASSES"
          for class in "${classes[@]}"; do only+=("-only-testing:$class"); done
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac-ui-${{ matrix.shard }}" \
            "${only[@]}" test
      - name: Upload macOS UI smoke failure evidence
        if: failure() && steps.ui_smoke.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-macos-ui-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dd-mac-ui-${{ matrix.shard }}/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Remove UI signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ui-signing.keychain-db" || true

  signed-build:
    needs: [test, contract]
    runs-on: macos-15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The one value a caller gets from this file: the name the upload step
    # actually used. It is computed once, in the shell, and both the upload and
    # every consumer read that single string — so a caller cannot download an
    # artifact whose name it re-derived from inputs that no longer agree.
    #
    # A SKIPPED job still satisfies `needs:` and still contributes its outputs,
    # and its outputs are empty. That is why the caller's notarization job
    # guards on this value being non-empty before it downloads anything: a fork
    # pull request skips this job, and an unguarded caller would ask
    # download-artifact for the artifact named "" and fail on the wrong thing.
    outputs:
      signed_artifact: ${{ steps.package_identity.outputs.artifact_name }}
    # Finite, and chosen rather than inherited, with the widest headroom in this
    # file because this job has the widest spread. It builds TWO full xcodebuild
    # graphs — the Mac App Store target unsigned, then the signed Release — then
    # re-signs the Sparkle components, verifies signature and entitlements, and
    # packages and verifies the DMG. The 47 successful runs in recent history
    # ranged from about 15 minutes on average to 30.3 at worst, so the bound is
    # roughly twice the slowest real run rather than a round number. It has to
    # be a bound and not the default: this job imports the Developer ID
    # certificate, so a wedged run holds a PAID macOS runner with the signing
    # key materialized in a keychain on disk.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERT_P12_BASE64 / MACOS_SIGNING_CERT_PASSWORD are not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          certfile="$RUNNER_TEMP/cert.p12"
          ( umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$certfile" )
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$certfile" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without a partition list, codesign blocks on a GUI authorization
          # prompt nobody can click and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" > /dev/null
          # Put it on the search list without evicting the default keychain.
          current_keychains=()
          while IFS= read -r current; do
            current="${current#\"}"
            current="${current%\"}"
            current_keychains+=("$current")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${current_keychains[@]}"
          rm -P "$certfile"
          security find-identity -v -p codesigning "$keychain"
      # keychain-access-groups is the entitlement that makes a profile
      # mandatory — proven by building once without it, which succeeded. The
      # profile carries keychain-access-groups = <team>.* by default, so there
      # is nothing to configure on Apple's side beyond creating it.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::MACOS_PROVISIONING_PROFILE_BASE64 is not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$PROFILE_BASE64" | base64 --decode > "$dir/relayium.provisionprofile" )
          # Name, not UUID: PROVISIONING_PROFILE_SPECIFIER in the project names
          # "Relayium Mac", and a mismatch here fails at signing time with a
          # message that does not mention this step.
          security cms -D -i "$dir/relayium.provisionprofile" \
            | plutil -extract Name raw -o - -
      # A second profile, because the Share extension is a second bundle with its
      # own App ID and its own App Groups entitlement. Without it the signed
      # Release fails at the appex with "requires a provisioning profile", and
      # the message does not mention this step.
      - name: Install Share extension provisioning profile
        env:
          SHARE_PROFILE_BASE64: ${{ secrets.MACOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SHARE_PROFILE_BASE64" ]; then
            echo "::error::MACOS_SHARE_PROVISIONING_PROFILE_BASE64 is not set — see the macos-signing runbook in relayium-ops"
            exit 1
          fi
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          ( umask 077; printf '%s' "$SHARE_PROFILE_BASE64" \
            | base64 --decode > "$dir/relayium-share.provisionprofile" )
          # Name, not UUID, for the reason above: the appex's
          # PROVISIONING_PROFILE_SPECIFIER names "Relayium Mac Share Extension".
          security cms -D -i "$dir/relayium-share.provisionprofile" \
            | plutil -extract Name raw -o - -
      # A successful compile cannot prove that the App scene opens, sidebar
      # actions render the intended task, or Pairing Code stays on its owning
      # surface. This runs here because the app and Share extension entitlements
      # require the profiles installed above; stripping them for ad-hoc signing
      # produces a different app that cannot load UI automation. The Debug-only
      # launch argument keeps the hosted runner off the public Nearby rendezvous.
      # The Mac App Store product, built unsigned.
      #
      # UNSIGNED deliberately, and it is the only build here that is: this
      # target signs automatically, so Xcode resolves a Mac App Store
      # certificate and profile against the signed-in account — credentials this
      # workflow does not hold and must not create. What a compile CAN prove is
      # the half that breaks silently — that the shared source really does build
      # both ways through the distribution seam, that the App Store target's own
      # file links the StoreKit adapter, and that its Share extension embeds. The
      # linkage and entitlement claims are asserted from the project file and
      # the plists by `StoreKitLinkageTests` in the Swift suite above.
      #
      # Its own derived-data path, because both macOS products build a
      # `Relayium.app`: same app, two channels, so they share the product name
      # on purpose, and separate paths keep one build from replacing the
      # artifact a later step verifies.
      - name: Build (Mac App Store target, unsigned)
        run: |
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme RelayiumAppStore \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-mas" \
            CODE_SIGNING_ALLOWED=NO build
      # And the two absences that decide whether the submission is even
      # accepted, read off the built product rather than off the project.
      - name: Verify the App Store product embeds no updater
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd-mas/Build/Products/Release/Relayium.app"
          [ -d "$app" ] || { echo "::error::the App Store product was not built"; exit 1; }
          if [ -e "$app/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::the App Store build embeds Sparkle"; exit 1
          fi
          binary="$app/Contents/MacOS/Relayium"
          linked="$(otool -L "$binary")"
          printf '%s\n' "$linked"
          if printf '%s' "$linked" | grep -q Sparkle; then
            echo "::error::the App Store binary links Sparkle"; exit 1
          fi
          if ! printf '%s' "$linked" | grep -q StoreKit; then
            echo "::error::the App Store binary does not link StoreKit"; exit 1
          fi
          [ -d "$app/Contents/PlugIns/RelayiumShare.appex" ] || {
            echo "::error::the App Store build does not embed its Share extension"; exit 1; }
      # The two files Apple requires of a submission, read off the built product.
      #
      # Their CONTENT is decided by `MacPrivacyManifestTests`, which re-derives
      # the declarations from the source and the server storage they describe.
      # What no Swift test can see is whether each file reached the bundle Apple
      # actually opens: both app folders are synchronized, so membership is a
      # filesystem fact rather than a project edit, and a manifest dropped from a
      # target produces no diff, no build failure and no runtime symptom — just a
      # rejected upload.
      - name: Verify the App Store product ships both privacy manifests
        run: |
          bash apps/mac/scripts/verify-privacy-manifests.sh \
            "$RUNNER_TEMP/dd-mas/Build/Products/Release/Relayium.app" "App Store"
      - name: Build (signed, Release)
        run: |
          xcodebuild -project apps/mac/Relayium.xcodeproj -scheme Relayium \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" build
      # Sparkle's prebuilt helpers carry distribution-inappropriate ad-hoc
      # signatures. A normal `build` does not replace those nested signatures,
      # so re-sign leaf-to-root and then restore the app's outer resource seal.
      - name: Re-sign Sparkle distribution components
        run: |
          apps/mac/scripts/resign-sparkle.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" \
            "Developer ID Application"
      # The reason this job exists. An entitlement regression compiles fine and
      # passes swift test; it shows up as a runtime Keychain failure weeks later
      # on somebody's machine.
      - name: Verify signature and entitlements
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app"
          codesign --verify --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/Relayium" -verify_arch arm64 x86_64 || {
            echo "::error::Release executable is not universal (arm64 + x86_64)"; exit 1; }
          signature_details="$(codesign -d --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature_details"
          printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime' || {
            echo "::error::Hardened Runtime flag missing from the signed build"; exit 1; }
          printf '%s\n' "$signature_details" | grep -q '^Timestamp=' || {
            echo "::error::Secure timestamp missing from the signed build"; exit 1; }
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          for component in \
            "$sparkle/Autoupdate" \
            "$sparkle/Updater.app" \
            "$sparkle/XPCServices/Installer.xpc" \
            "$sparkle/XPCServices/Downloader.xpc"; do
            details="$(codesign -d --verbose=4 "$component" 2>&1)"
            printf '%s\n' "$details"
            printf '%s\n' "$details" | grep -q 'TeamIdentifier=7PVYUG4YQS' || {
              echo "::error::Sparkle component is not signed by the Relayium team: $component"; exit 1; }
            printf '%s\n' "$details" | grep -q '^Timestamp=' || {
              echo "::error::Sparkle component has no secure timestamp: $component"; exit 1; }
          done
          # The Share extension is a separate signature, a separate entitlement
          # set and a separate notarization subject. Verifying the app alone
          # would pass while the appex inside it was unsigned, un-hardened, or
          # carrying an entitlement it has no business holding.
          appex="$app/Contents/PlugIns/RelayiumShare.appex"
          [ -d "$appex" ] || {
            echo "::error::the Share extension is not embedded in the signed app"; exit 1; }
          codesign --verify --strict --verbose=2 "$appex"
          appex_details="$(codesign -d --verbose=4 "$appex" 2>&1)"
          printf '%s\n' "$appex_details"
          printf '%s\n' "$appex_details" | grep -q 'flags=.*runtime' || {
            echo "::error::Hardened Runtime flag missing from the Share extension"; exit 1; }
          printf '%s\n' "$appex_details" | grep -q '^Timestamp=' || {
            echo "::error::Secure timestamp missing from the Share extension"; exit 1; }
          appex_ents="$(codesign -d --entitlements - --xml "$appex" | plutil -convert xml1 -o - -)"
          printf '%s\n' "$appex_ents"
          printf '%s' "$appex_ents" | grep -q '7PVYUG4YQS.com.relayium.shared' || {
            echo "::error::Share extension is not in the app's App Group"; exit 1; }
          # The absences are the point: a staging process that gains the network
          # or the Keychain stops being one.
          for forbidden in keychain-access-groups network.client network.server \
            associated-domains applesignin; do
            if printf '%s' "$appex_ents" | grep -q "$forbidden"; then
              echo "::error::Share extension claims $forbidden; it only stages files"; exit 1
            fi
          done
          ents="$(codesign -d --entitlements - --xml "$app" | plutil -convert xml1 -o - -)"
          printf '%s\n' "$ents"
          printf '%s' "$ents" | grep -q 'com.apple.security.application-groups' || {
            echo "::error::app is not in the App Group its Share extension writes to"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.apple.security.app-sandbox' || {
            echo "::error::app-sandbox entitlement missing from the signed build"; exit 1; }
          # The expanded value, not $(AppIdentifierPrefix): an unexpanded prefix
          # means the team never applied, and the app would fail at runtime.
          printf '%s' "$ents" | grep -q '7PVYUG4YQS.com.relayium.shared' || {
            echo "::error::keychain access group missing or unexpanded in the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'applinks:relayium.com' || {
            echo "::error::relayium.com Associated Domain missing from the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.relayium.mac-spks' || {
            echo "::error::Sparkle installer server entitlement missing from the signed build"; exit 1; }
          printf '%s' "$ents" | grep -q 'com.relayium.mac-spki' || {
            echo "::error::Sparkle installer client entitlement missing from the signed build"; exit 1; }
          [ "$(plutil -extract SUEnableInstallerLauncherService raw -o - "$app/Contents/Info.plist")" = true ] || {
            echo "::error::Sparkle Installer.xpc is not enabled"; exit 1; }
          [ "$(plutil -extract SUFeedURL raw -o - "$app/Contents/Info.plist")" = \
            "https://relayium.com/apps/macos/appcast.xml" ] || {
            echo "::error::Sparkle feed URL is missing or unexpected"; exit 1; }
          [ -n "$(plutil -extract SUPublicEDKey raw -o - "$app/Contents/Info.plist")" ] || {
            echo "::error::Sparkle EdDSA public key is missing"; exit 1; }
          get_task_allow="$(
            printf '%s' "$ents" \
              | plutil -extract com.apple.security.get-task-allow raw -o - - 2>/dev/null \
              || true
          )"
          if [ "$get_task_allow" = "true" ]; then
            echo "::error::Release build carries get-task-allow — it must not ship debuggable"
            exit 1
          fi
      # The same two files in the direct download, which builds from the same
      # synchronized folders, checked to the same exact sets. Only the App Store
      # product is submitted, so this is not a store requirement — it is how an
      # exclusion that removed a manifest from one channel gets noticed while
      # both are still meant to be one app.
      # Read-only: nothing here re-signs or repackages anything.
      - name: Verify the direct product ships both privacy manifests
        run: |
          bash apps/mac/scripts/verify-privacy-manifests.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" "direct"
      # Exercise the exact packaging path intended for release: the script
      # verifies the source signature, mounts the finished image, and verifies
      # the copied app again before emitting its checksum.
      - name: Package and verify DMG
        run: |
          apps/mac/scripts/package-dmg.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app" \
            "$RUNNER_TEMP/Relayium.dmg" \
            "Developer ID Application"
      - name: Record signed package provenance
        id: package_identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release/Relayium.app"
          build="$(defaults read "$app/Contents/Info" CFBundleVersion)"
          version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
          [ -z "$RELEASE_VERSION" ] || [ "$version" = "$RELEASE_VERSION" ]
          hash="$(shasum -a 256 "$RUNNER_TEMP/Relayium.dmg" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg version "$version" --arg build "$build" --arg hash "$hash" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,sha:$sha,version:$version,build:$build,
              signedDmgSha256:$hash,dmgSha256:$hash,runAttempt:$attempt}' \
            > "$RUNNER_TEMP/provenance.json"
          mkdir "$RUNNER_TEMP/release-tools"
          cp "$RUNNER_TEMP/dd/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            "$RUNNER_TEMP/release-tools/generate_appcast"
          # The canonical artifact name, emitted once and consumed by the upload
          # below and by the job output above. The bytes are unchanged: this is
          # the same string the `with: name:` expression produced before the
          # split — `${{ inputs.release_version || 'ci' }}` is the empty-is-falsy
          # rule that `${RELEASE_VERSION:-ci}` reproduces here.
          #
          # It is emitted rather than re-derived because the consumer is now in
          # ANOTHER FILE. Two copies of one naming expression in two workflows
          # is a rename away from a download that looks for an artifact this run
          # never uploaded, and that failure surfaces after the signing runner
          # has already been paid for.
          printf 'artifact_name=relayium-macos-signed-%s-%s\n' \
            "$GITHUB_SHA" "${RELEASE_VERSION:-ci}" >> "$GITHUB_OUTPUT"
      - name: Upload signed package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_identity.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/Relayium.dmg
            ${{ runner.temp }}/Relayium.dmg.sha256
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/release-tools/generate_appcast
          if-no-files-found: error
          retention-days: 14
      # Tear down the job-scoped signing keychain unconditionally, so the
      # imported identity does not outlive the job even when a step above failed.
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

name: android-interop
# The Android ↔ Web interoperability acceptance: the real APK on a real
# emulator, a real headless Chrome on the real built Web bundle, one real Go
# server between them, and real WebRTC — the cell no unit suite here can fill,
# for the same reason `native-web-pairing.yml` exists on the Apple side.
#
# What each entry in the filter is an input TO:
#
#   apps/android/**                          the APK under test
#   scripts/android-interop-acceptance.sh    the acceptance run itself
#   scripts/android-ui-acceptance.sh         the offline UI matrix (join form, lifecycle)
#   scripts/android-ui-session-acceptance.sh the real-DocumentsUI session round
#   scripts/android-update-acceptance.sh     the update check against a real feed
#   scripts/lib/instrumentation-result.sh    the rule that decides a run passed
#   scripts/lib/local-acceptance.sh          the isolation library it sources
#   scripts/test/android-interop-oracle.py   the comparison the run's one bit comes from
#   web/e2e/android-interop.mjs              the browser half it drives
#   web/**                                   the bundle the browser half loads
#   server/**                                the signalling server between them
#
# `web/**` and `server/**` ARE inputs, and are named for exactly the reason
# `native-web-pairing.yml` names them on the Apple side: this run BUILDS the
# Web bundle and BUILDS and RUNS the Go server, so a realtime-wire or
# signalling change on either side can break Android interoperability with no
# edit under `apps/android/**` at all. Leaving them out would defer that break
# to whenever an Android file next changed — which is not a filter decision,
# it is a gate that does not hold. `web.yml` and `go.yml` owning those trees
# is about their OWN suites; it says nothing about this acceptance's inputs.
#
# What is deliberately NOT here: `apps/RelayiumKit/**` and the other Apple
# trees. This lane compiles no Swift.
#
# This lane became requireable only after the same script ran green LOCALLY
# against the same server, bundle and a real device image; it is not a
# hoped-for gate. No step here waives a timeout or re-rolls a failure.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - 'scripts/android-interop-acceptance.sh'
      # A12: the CLI ↔ Android cell run in the emulator step below.
      - 'scripts/interop/cli-android-acceptance.sh'
      - 'scripts/interop/cli-android-peer.mjs'
      - 'scripts/interop/cli-android-oracle.py'
      - 'scripts/interop/cli-matrix-plan.py'
      - 'scripts/interop/cli-process.mjs'
      - 'scripts/lib/local-acceptance.sh'
      # The oracle is a RUNTIME input of the acceptance — the shell invokes it
      # for every round's comparison — so an edit to it must re-run the real
      # integration, not only the oracle's own mutation test in repo-hygiene.
      - 'scripts/test/android-interop-oracle.py'
      - 'scripts/android-ui-acceptance.sh'
      - 'scripts/android-ui-session-acceptance.sh'
      # The update acceptance and, separately, the manifest it must agree with.
      # `web/android-release.json` is a RUNTIME input in the same sense the
      # oracle is: the client's official feed URL and the document that URL
      # serves are two halves of one contract, and an edit to either can only be
      # judged by running the check against a real feed.
      - 'scripts/android-update-acceptance.sh'
      # The pass/fail rule the update acceptance is judged by. `am instrument`
      # exits 0 for a crashed process and a missing instrumentation alike, so
      # this file is what separates "one test passed" from "nothing ran" — a
      # runtime input in the same sense the interop oracle is.
      - 'scripts/lib/instrumentation-result.sh'
      - 'web/android-release.json'
      - 'web/**'
      - 'server/**'
      - '.github/workflows/android-interop.yml'
      # The PR→main evidence verifier, its registry, the filter reader it imports,
      # the adoption transform, the toolchain certificate probe and registry, and
      # their tests decide whether a main push may witness this lane instead of
      # re-running it — so a change to any of them is a change to this lane
      # (scripts/ci/ci-evidence-view.mjs).
      - 'scripts/ci/ci-evidence.mjs'
      - 'scripts/ci/ci-evidence-registry.json'
      - 'scripts/ci/select-lanes.mjs'
      - 'scripts/ci/ci-evidence-view.mjs'
      - 'scripts/test/ci-evidence-test.mjs'
      - 'scripts/ci/ci-evidence-toolchain.mjs'
      - 'scripts/ci/ci-evidence-toolchain-registry.json'
      - 'scripts/test/ci-evidence-toolchain-test.mjs'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-interop-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR→main evidence reuse (scripts/ci/ci-evidence.mjs; docs/CI-PLATFORM-BOUNDARY.md).
  #
  # On an ORDINARY push to main, decides whether the merged pull request's
  # latest merge-gate run already proved this exact tree for this lane, on the
  # same toolchain this runner family offers now. Every other event — the merge
  # gate's own pull_request call, a dispatch, a release caller — skips the
  # decision, so `reuse` is empty and every job below runs its original steps
  # on its original runner. The verifier always exits 0 and any doubt is
  # `reuse=false`: a missing, partial, stale, uncertified or mismatched proof
  # means the full lane, never approval. It reads the GitHub API (hence the
  # read-only actions/pull-requests grants) and runs nothing it downloads.
  # Never red (`continue-on-error`), and nothing below depends on how it
  # ended: every original job's condition is an explicit `!cancelled()` over
  # its OWN needs, so a failed setup step, a timeout or a skipped dependency
  # here leaves `reuse` empty and the whole lane runs in full.
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Promoted ONLY by the handover, after the witness was kept: a decision
    # whose upload failed or timed out, or whose retained file is missing or
    # not the decided witness, never reaches the jobs below.
    outputs:
      reuse: ${{ steps.handover.outputs.reuse }}
      witness: ${{ steps.handover.outputs.witness }}
    steps:
      - name: Check out the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (ordinary main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Does the merged pull request's full proof cover this main tree?
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVIDENCE_CURRENT_TOOLCHAIN_DIR: ${{ runner.temp }}/ci-evidence-current
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/android-interop.json
        run: node scripts/ci/ci-evidence.mjs witness android-interop >> "$GITHUB_OUTPUT"
      - name: Keep the witness (reuse only)
        id: keep
        if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relayium-ci-evidence-witness-android-interop-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-witness
          if-no-files-found: error
          retention-days: 30
      - name: Hand the decision to the lane only once its witness is kept
        id: handover
        if: steps.verify.outputs.reuse == 'true' && steps.keep.outcome == 'success'
        env:
          CI_EVIDENCE_WITNESS: ${{ steps.verify.outputs.witness }}
          CI_EVIDENCE_WITNESS_FILE: ${{ runner.temp }}/ci-evidence-witness/android-interop.json
        run: node scripts/ci/ci-evidence.mjs handover >> "$GITHUB_OUTPUT"
  # (end of the PR→main evidence jobs; everything above was generated by scripts/ci/ci-evidence-view.mjs)

  interop:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # An emulator boot plus two application builds plus the rounds themselves.
    # Finite: a wedged boot fails the lane rather than holding a runner for six
    # hours, and the failure is the truthful result. 60 before A12 added the
    # CLI ↔ Android cell (at most eight more paced rounds, APKs reused).
    timeout-minutes: 85
    steps:
      # Witness path (main push whose pull request proof was verified by the
      # `evidence` job): bind this job's check run to that proof, then run
      # nothing else that is not marked fresh in scripts/ci/ci-evidence-registry.json.
      # Every original step below is guarded by `reuse != 'true'`, so an empty,
      # false or unknown decision runs exactly the original job.
      - name: Check out the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node for the verifier (witness path only)
        if: needs.evidence.outputs.reuse == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Witness — the pull request's full proof covers this job
        if: needs.evidence.outputs.reuse == 'true'
        shell: bash
        env:
          CI_EVIDENCE_WITNESS: ${{ needs.evidence.outputs.witness }}
        run: node scripts/ci/ci-evidence.mjs confirm android-interop
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.evidence.outputs.reuse != 'true'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.evidence.outputs.reuse != 'true'
        with:
          node-version: 24
      # Hosted Linux runners gate /dev/kvm behind a root-owned udev rule; the
      # emulator is unusably slow without it.
      - name: Enable KVM for the emulator
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the pinned SDK platform
        if: needs.evidence.outputs.reuse != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      # The browser half's dependencies, from the lockfile. `npm ci` and not
      # `npm install`: the run must exercise the resolved tree the repository
      # pins, not whatever the registry offers today.
      - name: Install the Web dependencies
        if: needs.evidence.outputs.reuse != 'true'
        working-directory: web
        run: npm ci
      # The harness LAUNCHES a real Chrome or throws — it never degrades to a
      # skip — so a missing browser must fail here, by name, rather than deep
      # inside a round as an unexplained timeout. Ubuntu runners ship one.
      - name: Verify a real Chrome is present
        if: needs.evidence.outputs.reuse != 'true'
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$chrome" ] || { echo "::error::no Google Chrome on this runner"; exit 1; }
          "$chrome" --version
      # The same image family the local acceptance runs on: the AOSP `default`
      # tag, no Play, no GMS — only the ABI differs (x86_64 here, arm64 on the
      # Apple-silicon dev machine). The acceptance script itself is the single
      # source of what happens once the device is up.
      # Both acceptances run inside ONE emulator boot: the wire interop (the
      # real APK ↔ real browser round trips) and then the offline UI matrix
      # (the join form's visible validation and the launch/recreation
      # lifecycle, across the en/light and zh/dark/320dp/font2 corners). The UI
      # matrix needs no server or browser, so it is cheap to append here and
      # keeps the emulator this workflow already pays for doing both.
      #
      # The update acceptance rides the same emulator for the same reason. It
      # serves its own throwaway feed on the runner's loopback and points the
      # app at it through the debug feed override, so it needs neither the Go
      # server nor the browser — but it DOES need a device, and the "an update
      # is available" branch cannot be reached any other way: 0.1.1 is the first
      # build with an updater and there is no newer public release to check
      # against. Nothing it does downloads or installs anything; the download
      # test intercepts the real ACTION_VIEW Intent and blocks the launch.
      - name: Run the Android ↔ Web interop and UI acceptances
        if: needs.evidence.outputs.reuse != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./scripts/android-interop-acceptance.sh
            RELAYIUM_ANDROID_PREBUILT=1 ./scripts/interop/cli-android-acceptance.sh
            ./scripts/android-ui-acceptance.sh
            ./scripts/android-ui-session-acceptance.sh
            ./scripts/android-update-acceptance.sh

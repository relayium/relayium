name: compat
# The always-required compatibility gate: the cheap, platform-independent checks
# that judge a CONTRACT between two implementations, and that every platform —
# present and future — has to pass before anything expensive starts.
#
# ## Why this is a workflow of its own rather than a job somewhere else
#
# It used to be the first step of `native-web-pairing.yml`, which is a 45-minute
# macOS job behind a path filter. Both of those are wrong for a contract check:
#
#   * `npm run test:vectors` needs a checkout, Node, and the PRODUCTION half of
#     `web/`'s dependency tree — `gen-crypto-vectors.mjs` imports
#     `libsodium-wrappers`. It does NOT need a macOS runner, a Go toolchain, a
#     Chrome, a Vite build, or any devDependency, and running it inside a job
#     that has all of those means the seconds-long answer waits behind minutes
#     of setup that have nothing to do with it.
#   * A path filter is per-WORKFLOW. As the first step of a filtered workflow,
#     the vector gate ran only when that workflow's own trees changed — so the
#     moment a filter is narrowed, or a NEW platform root appears with its own
#     workflow, the wire-compatibility check silently stops covering it. A gate
#     that a new platform can bypass by existing is not a gate.
#
# So this file has deliberately NO `paths:` filter. It runs on every pull
# request — through `merge-gate.yml`, which calls it unconditionally — and on
# every `main` push, it is cheap enough to do that, and a future
# `apps/android/**` or `apps/windows/**` cannot route around it.
#
# ## What belongs here, and what does not
#
# Belongs: a check that is seconds long, needs no platform runner, and asserts
# that two independent implementations of one wire still agree.
#
# Does not belong: anything that builds or signs a platform artifact, anything
# needing a macOS/Windows runner, and anything slow enough that always-on would
# be expensive. Those are the heavy per-platform workflows — `macos.yml`,
# `ios.yml`, `native-web-pairing.yml` — and they stay filtered.
#
# ## "Always-required" here is a property of this file, not of the repository
#
# Everything above is enforceable in workflow code and is enforced there: no
# `paths:` on any event, no job-level `if:`, no `continue-on-error`, no retry,
# a finite timeout, and a real command. That makes this gate always-RUN and
# fail-closed — it starts on every pull request, through the gate that calls it
# with no condition, and on every `main` push, and it reports red when the
# contract breaks.
#
# It does not, by itself, make a red result BLOCK a merge. That is a GitHub
# branch-protection setting on `main`, it lives in repository configuration
# rather than in this repository's source, and nothing in this file can assert
# it. The check to require there is named:
#
#     compat / wire-vectors
#
# (the workflow's `name:` and the job key, joined the way GitHub renders a status
# context).
#
# THAT CONTEXT IS NO LONGER WHAT `main` REQUIRES, and the difference is the
# whole of the migration this file has just finished.
#
# `main` protection is enabled and strict, bound to GitHub Actions `app_id`
# 15368, with force pushes and deletions disabled. It required the bare
# `wire-vectors` from 2026-08-21 (PR #6, `24a29ec6`); protection edit A added
# `merge-gate` beside it; protection edit B then narrowed the set to
# `merge-gate` ALONE, read back after the write as `strict: true` with that one
# context. So the string above is the context `merge-gate.yml` sees this file
# report as the `compat` lane it calls, and it reaches the merge button through
# the aggregate's verdict rather than on its own.
#
# The bare `wire-vectors` has NOT stopped mattering; it stopped being
# branch-required. `relayium-ops`' `deploy/promote.sh` refuses to promote a
# `main` commit that has no green check run named `wire-vectors` ON THAT COMMIT,
# and the `push: main` trigger below is the only thing that puts one there —
# `merge-gate.yml` runs on `pull_request` only. That is why `push: main` is
# permanent here and why removing it would wedge production promotion rather
# than fail a pull request.
#
# The `app_id` binding still answers what it always answered: a differently
# owned check publishing the same context name cannot satisfy the requirement
# on behalf of a gate that never ran. What it cannot answer — a SECOND job named
# `wire-vectors` in this repository — is asserted in source instead, by section
# 6j of `scripts/test/ci-event-policy-test.mjs`.
#
# So this gate MAY be described as merge-required, because it is — now through
# `merge-gate`. The earlier instruction here — to treat it as NOT merge-required
# — is stale and superseded, as is any statement elsewhere calling it an
# outstanding operational requirement.
#
# A merge HAS been observed blocked by a red required check: the never-merged
# red probe PR #38 turned `merge-gate` red and GitHub reported
# `mergeStateStatus: BLOCKED`. That was `merge-gate` rather than this file's own
# context, and the distinction is recorded in `docs/CI-PLATFORM-BOUNDARY.md`
# rather than claimed away here.
#
# `docs/CI-PLATFORM-BOUNDARY.md` states the whole boundary;
# `scripts/test/ci-event-policy-test.mjs` is what enforces it, because none of
# it is visible to YAML validity or to actionlint.
#
# ## One pull-request entry point, permanently
#
# `merge-gate.yml` CALLS this file as an unconditional reusable lane, and that
# call is now the ONLY way a pull request reaches it. This file carried its own
# `pull_request:` trigger for exactly one migration step — while the bare
# `wire-vectors` was still a required context, dropping the direct trigger would
# have left that context reported by no run at all, and an ABSENT required
# context blocks every pull request rather than failing one. Protection edit B
# closed that window by requiring `merge-gate` alone, so the direct trigger is
# gone and this workflow runs ONCE per pull request again.
#
# Bringing `pull_request:` back would restore the duplicate — two identical runs
# of the same commit, nothing reading the second — and
# `scripts/test/ci-event-policy-test.mjs` fails by name if it returns. The two
# triggers that remain are permanent: `push: main` for the promotion check run
# described above, and `workflow_call:` for the gate. Without the latter the
# gate's `uses:` is unresolvable, the WHOLE aggregate run fails to load, and
# `merge-gate` reports nothing rather than red.
on:
  push:
    # Only `main`, and permanently. `merge-gate.yml` runs on `pull_request`
    # only, so this is the ONE event that puts a check run named `wire-vectors`
    # on a `main` commit — which is exactly what `relayium-ops`'
    # `deploy/promote.sh` reads before it promotes. Branch work is gated by the
    # aggregate calling this file, not by anything here.
    branches:
      - main
    # Deliberately no `paths:` here, and none on any other event either. See
    # the header: a filter is exactly how a new platform root would inherit an
    # exemption from the compatibility contract without anybody deciding to
    # grant it.
  workflow_dispatch:
  # The aggregate merge gate's entry point, and the only way a pull request
  # reaches this file. It calls with no `with:` block at all — and there is
  # nothing to pass: this workflow declares NO inputs, deliberately.
  #
  # It ran on every pull request in the repository before the gate existed and
  # it does so now, so an input here would be the widest behaviour switch it is
  # possible to add — a lever any caller could pull to make the always-on
  # compatibility gate check less. The transitional `concurrency_scope`
  # discriminator that lived here is gone with the second entry point it existed
  # to tell apart; the concurrency group below no longer needs one.
  workflow_call:

# Supersede a pull request's own earlier run of this lane, and nothing else.
#
# The suffix is the repository-wide rule, unchanged and asserted by
# `scripts/test/ci-event-policy-test.mjs`: group by PR NUMBER when there is one
# and by `github.run_id` — unique per run — otherwise, so a PR supersedes only
# itself and nothing can ever cancel a `main` or dispatch run.
#
# The prefix is a LITERAL nothing else uses, which is what every other called
# lane carries and for the same reason: it may not be `${{ github.workflow }}`,
# because inside a CALLED workflow that expression is the CALLER's name —
# `merge-gate` — so the called run would land in the caller's own group under
# one `github.run_id`. The callee then queues behind the caller that is waiting
# for it: a deadlock, invisible to YAML validity and to actionlint. `compat-lane`
# is distinct from `merge-gate` and from every other lane's literal, so the
# groups are disjoint by construction whatever any file is renamed to later.
#
# It no longer carries an entry-point discriminator, and does not need one. This
# file had two entry points for one migration step, and the two runs of one pull
# request shared a `github.event.pull_request.number`; the discriminator is what
# kept them from cancelling each other. With the direct `pull_request:` trigger
# gone, the only run keyed by a PR number is the CALLED one — `push` and
# `workflow_dispatch` supply no pull request, so they key on `github.run_id`,
# which is unique per run and cannot collide with anything, including with each
# other.
#
# `cancel-in-progress` is unchanged: a pull request still supersedes its own
# earlier called run, and a `main` or dispatch run can never be superseded at
# all.
concurrency:
  group: compat-lane-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No secrets, so this runs on fork pull requests like any other check.
  # Deliberately no job-level `if:`, no `continue-on-error` and no retry: a
  # compatibility gate that may skip, may be advisory, or may be re-rolled until
  # it agrees is indistinguishable from no gate, and the policy test asserts the
  # absence of all three.
  wire-vectors:
    runs-on: ubuntu-latest
    # Seconds of real work. The bound is generous only so a runner that is
    # merely slow does not read as drift, and finite so a wedged run cannot hold
    # a slot until GitHub's 6-hour default expires.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (with the
      # human-readable version in a trailing comment) so a compromised or
      # retagged upstream release can't silently change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # This job DOES need a dependency install, and the comment here used to
      # say the opposite.
      #
      # It was true until `gen-crypto-vectors.mjs` joined the gate's table in
      # `5619f062`: before that, `check-wire-vectors.mjs` and both generators
      # imported nothing but `node:` builtins. That generator imports
      # `libsodium-wrappers` — a PRODUCTION dependency — so from that commit on a
      # runner with no dependency tree cannot run this gate at all. It went
      # unnoticed because a developer checkout already has `web/node_modules`
      # lying around; a clean runner gets ERR_MODULE_NOT_FOUND and the gate is
      # red for a reason that has nothing to do with the contract it checks,
      # which is the shortest path to somebody making it advisory.
      #
      # So: the smallest deterministic closure that actually runs the
      # generators, and nothing else.
      #
      #   * `npm ci`, never `npm install` — the tree comes from
      #     `package-lock.json` exactly, and the lockfile is never rewritten
      #     here. A gate that compares frozen bytes is installed from frozen
      #     bytes.
      #   * `--omit=dev` — the generators need `libsodium-wrappers`; they do not
      #     need Vite, Vitest, svelte-check or TypeScript. 31 packages rather
      #     than the whole tree.
      #   * `--ignore-scripts` — nothing in that closure needs a lifecycle
      #     script to work, and two packages in it (`yargs`, `get-caller-file`)
      #     declare `prepare` scripts shelling out to `tsc` and `npm run
      #     compile`, which `--omit=dev` has deliberately not installed.
      #
      # Deliberately still no `cache: npm`. Measured from tracked bytes only
      # with an empty npm cache, this install is ~1.2s against ~0.5s for the
      # gate itself; a setup-node cache restore-and-save round trip is not
      # reliably cheaper than that, and it would put a shared mutable artifact
      # in the path of the one check that gates every merge. A second that may
      # not exist is not worth that blast radius.
      #
      # Presence, ordering, working directory and each flag are asserted by
      # `scripts/test/ci-event-policy-test.mjs`; none of it is visible to YAML
      # validity or to actionlint.
      - name: Install the production dependency closure the generators import
        working-directory: web
        run: npm ci --ignore-scripts --omit=dev
      # `apps/RelayiumKit/Tests/Fixtures/*-wire-vectors.json` are transcriptions
      # of the Web implementation that the Swift suites assert against. If the
      # Web wire moves and the fixtures are not regenerated, every Swift vector
      # test still passes — against the OLD wire — and the two implementations
      # have diverged with a green board.
      #
      # The verifying form is observably read-only: it regenerates, compares and
      # restores what it found. The writing form (`gen:vectors`) must never
      # appear in CI, and `scripts/test/native-web-pairing-gate-test.mjs`
      # asserts that.
      - name: Regenerate the cross-language wire vectors and require zero diff
        working-directory: web
        run: npm run test:vectors

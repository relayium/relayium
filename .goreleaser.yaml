version: 2
project_name: relayium

builds:
  - id: relayium
    dir: server
    main: ./cmd/relayium
    binary: relayium
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: relayium-node
    dir: server
    main: ./cmd/relayium-node
    binary: relayium-node
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: relayium
    ids: [relayium]
    name_template: "relayium_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: relayium-node
    ids: [relayium-node]
    name_template: "relayium-node_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

# ECDSA (P-256) signature over the checksum file with a release key. Its PUBLIC
# half is embedded in the relayium binary (internal/selfupdate/release_pubkey.go)
# and in install.sh, so `relayium update` and install.sh verify the signature
# with the Go standard library / stock openssl — NO cosign needed on the user's
# machine (the old keyless flow only verified when cosign happened to be present,
# i.e. almost never). The private key is the RELAYIUM_RELEASE_KEY secret,
# materialized to RELAYIUM_RELEASE_KEY_FILE by the release workflow before this runs.
signs:
  - id: checksums-ecdsa
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.RELAYIUM_RELEASE_KEY_FILE }}"
      - -out
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  github:
    owner: relayium
    name: relayium
  draft: false

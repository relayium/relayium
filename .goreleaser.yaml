version: 2
project_name: relayium

builds:
  - id: relayium
    dir: server
    main: ./cmd/relayium
    binary: relayium
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: relayium
    name_template: "relayium_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: relayium
    name: relayium
  draft: false
